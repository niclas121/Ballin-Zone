<style>
/* Layout: one column on phones, sidebar + two-column cards on tablets and desktops. Deliberately dark only: floodlight look with neon green. */
:root{
  color-scheme:dark;
  --bg:#090c0a; --surface:#131814; --fg:#eef5ef; --muted:#8fa397; --line:#27322b;
  --pitch:#3dff7c; --pitch-deep:#0e1611; --on-pitch:#03170a; --chalk:rgba(61,255,124,.28);
  --accent:#ffd23f; --on-accent:#221a00; --soft:#1a231d; --warn:#ff8a80;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
#app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 96px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:1.5rem;font-weight:700} h3{font-size:1.15rem;font-weight:700}
p{margin:0} .muted{color:var(--muted)} .small{font-size:.875rem} .note{color:var(--warn)}
.band{margin-inline:-16px;padding:20px 16px 18px;position:relative;overflow:hidden;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;
  background:repeating-linear-gradient(90deg,var(--surface) 0 56px,var(--pitch-deep) 56px 112px)}
.band h1{font-size:2.2rem;font-weight:800;font-style:italic;color:var(--pitch);overflow-wrap:anywhere}
.band>div{min-width:0}
.ava{flex:none;width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--pitch);background:var(--soft);display:grid;place-items:center;font:700 1.5rem var(--display);color:var(--pitch)}
.logo{flex:none;width:54px;height:54px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{border-color:var(--pitch)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .row>.grow,.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 1.7rem/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--pitch);color:var(--on-pitch);border:0;border-radius:10px;padding:12px 16px;font:700 1.1rem var(--display);text-transform:uppercase;letter-spacing:.04em}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)} .btn.block{width:100%} .btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-weight:600}
.opt small{display:block;font-weight:400;color:var(--muted)} .opt.on{border-color:var(--pitch)}
.opts{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--pitch)}
.line{display:flex;align-items:center;gap:4px} .line .check{flex:1;min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;background:none;border:0;padding:8px 0;text-align:left;width:100%}
.check .box{flex:none;width:24px;height:24px;border:2px solid var(--pitch);border-radius:6px;display:grid;place-items:center;font-weight:700;color:var(--on-pitch)}
.check.on .box{background:var(--pitch)} .check.on span:last-child{color:var(--muted);text-decoration:line-through}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;list-style:none} .ex summary::-webkit-details-marker{display:none}
.ex summary b{flex:1;min-width:0}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;background:var(--soft);border-radius:6px;padding:2px 7px;white-space:nowrap;align-self:flex-start}
.an{width:100%;max-width:440px;border-radius:10px;display:block;margin-inline:auto}
.an .g{fill:var(--soft)} .an .l{stroke:var(--chalk);fill:none;stroke-width:1.5} .an .c{fill:var(--accent)}
.an .pm{stroke:var(--pitch);fill:none;stroke-width:1.2;stroke-dasharray:4 4;opacity:.6} .an .pb{stroke:var(--fg);fill:none;stroke-width:1;stroke-dasharray:1 4;opacity:.6}
.an .me{fill:var(--pitch)} .an .mate{fill:var(--accent)} .an .ball{fill:var(--fg);stroke:var(--bg);stroke-width:1} .an .z{fill:var(--chalk);stroke:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dose{font:700 1.5rem var(--display);color:var(--pitch);text-align:center}
.timer{font:700 4rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--pitch);text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{border:1px solid var(--line);border-radius:8px;padding:6px 0;font-size:.68rem;background:var(--surface);overflow:hidden;min-width:0}
.week b{display:block;font:700 1rem var(--display)} .week .today{border-color:var(--pitch);border-width:2px} .week .done{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1.5px solid transparent;border-radius:20px;padding:7px 12px;font-size:.875rem}
.chip.on{background:var(--pitch);color:var(--on-pitch)}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--pitch)}
textarea{min-height:160px;resize:vertical}
label{font-size:.8rem;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.meal{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.x{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:4px 8px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1.5px dashed var(--line);border-radius:12px;padding:10px 6px;text-align:center;font-size:.78rem;color:var(--muted)}
.badge b{display:block;font:700 1rem var(--display);text-transform:uppercase}
.badge.on{border-style:solid;border-color:var(--accent);background:var(--soft);color:var(--fg)}
.pp{display:flex;flex-direction:column;gap:8px;background:var(--soft);border:2px solid var(--chalk);border-radius:14px;padding:12px}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pb2{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 2px;font:700 1.2rem var(--display);min-width:0}
.pb2 small{display:block;font:400 .68rem var(--body);color:var(--muted);overflow-wrap:anywhere} .pb2:disabled{opacity:.3}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:130px}
.chart div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chart i{display:block;width:100%;background:var(--pitch);border-radius:4px 4px 0 0;min-height:2px} .chart .now{color:var(--fg);font-weight:600}
.msg{padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.msg.user{align-self:flex-end;background:var(--pitch);color:var(--on-pitch);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
.out{white-space:pre-wrap;overflow-wrap:anywhere}
.sched{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center}
.sched b{font:700 1.1rem var(--display)}
.lb{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb b{font:700 1.2rem var(--display)} .lb.me{color:var(--pitch)} .lb span{overflow-wrap:anywhere;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;text-align:left;font:700 1.3rem var(--display);text-transform:uppercase}
.tile small{display:block;font:400 .85rem var(--body);text-transform:none;color:var(--muted)}
.ring{flex:none;width:84px;height:84px} .ring text{font:700 26px var(--display);fill:var(--fg)} .ring .t{stroke:var(--soft)} .ring .v{stroke:var(--pitch)}
.an .m{fill:var(--fg);font:600 7px var(--body)} .an .dm{fill:var(--accent)}
.ph{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:2px}
.ph li{color:var(--muted);padding:3px 8px;border-radius:6px} .ph li.on{color:var(--fg);background:var(--soft);font-weight:600}
.lbl{font:700 .82rem var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--pitch)}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:2px}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .subs .chip{padding:9px 2px;text-align:center;font-weight:600;border-radius:10px}
.rowbtn{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;padding:0}
.dctl{justify-content:center}
.sbar{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;border-top:3px solid transparent;padding:12px 0;font:700 .95rem var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
nav button.on{color:var(--pitch);border-top-color:var(--pitch)}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;max-width:528px;margin:0 auto;z-index:9;background:var(--pitch);color:var(--on-pitch);border-radius:14px;padding:14px 16px;text-align:center}
#toast b{display:block;font:700 1.4rem var(--display);text-transform:uppercase}
@media (min-width:900px){
  body.has-nav{padding-left:210px}
  #app{max-width:900px;padding-inline:28px;padding-block:0 40px}
  .band{margin-inline:-28px;padding-inline:28px}
  nav{right:auto;top:0;width:210px;border-top:0;border-right:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
  nav div{grid-template-columns:1fr;max-width:none}
  nav button{border-top:0;border-left:3px solid transparent;text-align:left;padding:14px 22px;font-size:1.15rem}
  nav button.on{border-left-color:var(--pitch);border-top-color:transparent}
  .narrow{max-width:560px;width:100%;align-self:center}
}
/* ---- v4: depth, icons, calendar, figure ---- */
:root{--surface2:#1a231d;--glow:rgba(61,255,124,.15)}

.card .card{box-shadow:none}

.btn{background:linear-gradient(180deg,#62ff97,#2ee76a);box-shadow:0 6px 16px rgba(61,255,124,.2);border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.btn.ghost{background:rgba(255,255,255,.04);box-shadow:none;border:1.5px solid rgba(255,255,255,.12)}
.chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.07);display:inline-flex;align-items:center}
.chip.on{background:linear-gradient(180deg,#62ff97,#2ee76a)}
.opt{background:linear-gradient(180deg,var(--surface2),var(--surface));border-color:rgba(255,255,255,.1)}
.ic{width:1.15em;height:1.15em;margin-right:.4em;fill:none;stroke:var(--pitch);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.btn .ic,.chip.on .ic,nav .ic{stroke:currentColor}
h3{display:flex;align-items:center} h3 .ic{width:1.3em;height:1.3em}
.lbl{display:flex;align-items:center}
p>.lbl{display:inline-flex;margin-right:.4em}
.band{background:linear-gradient(180deg,#15241c,#0c120e);border-bottom-color:rgba(255,255,255,.07)}

.subs{grid-template-columns:repeat(5,1fr)}

.bi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--glow);flex:none} .bi .ic{margin:0;width:25px;height:25px}

.tile{background:linear-gradient(180deg,var(--surface2),var(--surface));border-color:rgba(255,255,255,.07);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.45)} .tile .ic{display:block;width:26px;height:26px;margin:0 0 8px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pill{display:flex;align-items:center;justify-content:center;padding:7px 2px;border-radius:10px;background:rgba(255,255,255,.05);font:700 .82rem var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pill .ic{stroke:currentColor} .pill.on{background:var(--glow);color:var(--pitch)}

.week button b{font:700 .95rem var(--display)} .week button .ic{margin:0;width:16px;height:16px}
.week button.today{border-color:rgba(255,255,255,.4)} .week button.sel{border-color:var(--pitch);background:var(--glow)} .week button.done .ic{stroke:var(--accent)}
.fg{width:100%;max-width:340px;display:block;margin-inline:auto;border-radius:12px}
.fg .g{fill:var(--soft)} .fg .fl{stroke:var(--chalk);stroke-width:2;fill:none}

/* ---- v5: orange-gold identity, floating menu, new components ---- */
:root{--bg:#070708;--surface:#111113;--surface2:#19191c;--fg:#f5f3ee;--muted:#9c978d;--line:#2a2a2e;--pitch:#ffa826;--pitch-deep:#0e0e10;--on-pitch:#201300;--chalk:rgba(255,168,38,.32);--accent:#7fd4ff;--on-accent:#04202e;--soft:#1b1b1f;--glow:rgba(255,168,38,.15)}
body{background:radial-gradient(1000px 460px at 50% -10%,#241a0c 0,var(--bg) 60%) fixed,var(--bg)}
.card{border-radius:24px;background:linear-gradient(180deg,var(--surface2),var(--surface))}
.hero{border-color:rgba(255,168,38,.5)}
.btn{background:linear-gradient(180deg,#ffbe55,#ff9a1f);box-shadow:0 6px 18px rgba(255,160,40,.25);border-radius:999px}
.btn.ghost{border-radius:999px;background:rgba(255,255,255,.04);box-shadow:none}
.chip.on{background:linear-gradient(180deg,#ffbe55,#ff9a1f)}
.band{background:none;border-bottom:0;padding-bottom:6px}
.fg .far{stroke:#b06f12}
.week button.done .ic{stroke:var(--pitch)}

.strk{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:var(--glow);border:1px solid var(--chalk);font:700 1.1rem var(--display)} .strk .ic{margin-right:4px}
.rb{flex:none;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center} .rb .ic{margin:0;stroke:var(--fg)}
.today{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#ffc259,#ff8a1a);color:var(--on-pitch);box-shadow:0 14px 34px rgba(255,140,30,.25)}
.today h2{font-size:2rem;font-style:italic;font-weight:800} .today .tg{font:700 .8rem var(--display);text-transform:uppercase;letter-spacing:.12em;opacity:.8} .today p{opacity:.85}
.wbtn{background:#fff8ec;color:#201300;border:0;border-radius:999px;padding:14px 16px;font:700 1.15rem var(--display);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:6px} .wbtn .ic{margin:0;stroke:currentColor}
.rk,.lbp{text-align:left;color:inherit} .big{font:700 1.5rem var(--display);text-transform:uppercase}
.rowl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 0;border-top:1px solid rgba(255,255,255,.07);color:inherit}
.list{gap:0;padding-block:6px} .list>.rowl:first-child{border-top:0} .list>.fl:first-child{border-top:0}
.rowl b{display:block} .rowl small{display:block;color:var(--muted);font-size:.85rem} .rowl>.ic{margin:0;stroke:var(--muted)} .rowl .grow{min-width:0}

pain_t:["Don't train through pain. If it is in a joint, came from a knock, or lasts more than a few days, have a doctor or physiotherapist look at it.","Trainiere nicht gegen Schmerzen. Sitzt er im Gelenk, kam er durch einen Schlag oder hält er länger als ein paar Tage an, lass ihn ärztlich oder physiotherapeutisch abklären.","No entrenes con dolor. Si es en una articulación, viene de un golpe o dura más de unos días, que lo vea un médico o fisioterapeuta.","Ne t'entraîne pas avec une douleur. Si elle touche une articulation, vient d'un choc ou dure plus de quelques jours, consulte un médecin ou un kiné."],

match_extra:["It's matchday. The session below is only in case the game is cancelled.","Heute ist Spieltag. Die Einheit unten ist nur für den Fall, dass das Spiel ausfällt.","Hoy hay partido. La sesión de abajo es solo por si se suspende.","C'est jour de match. La séance ci-dessous ne sert que si le match est annulé."],
rest_extra:["Today is a rest day. If you still feel like it, here is an optional session.","Heute ist Ruhetag. Wenn du trotzdem Lust hast, ist hier eine freiwillige Einheit.","Hoy es día de descanso. Si te apetece, aquí tienes una sesión opcional.","Aujourd'hui, repos. Si tu en as envie, voici une séance facultative."],
light_note:["Match tomorrow: today's volume is cut by about 40 %.","Morgen ist Spiel: Der Umfang heute ist um etwa 40 % reduziert.","Mañana hay partido: el volumen de hoy se reduce un 40 %.","Match demain : le volume du jour est réduit d'environ 40 %."],
tip_gk:["Do the technique drills with throws and goal kicks too. Passing with both feet is a must for you.","Mach die Technikdrills auch mit Abwürfen und Abschlägen. Passspiel mit beiden Füßen ist für dich Pflicht.","Haz los ejercicios técnicos también con saques de mano y de puerta. Pasar con ambas piernas es obligatorio.","Fais aussi les exercices techniques avec relances à la main et dégagements. Le jeu au pied des deux pieds est indispensable."],
tip_cb:["Brake cleanly and practise running backwards in every drill. Add long passes after your wall work.","Achte in jedem Drill auf sauberes Abbremsen und Rückwärtslaufen. Häng lange Bälle an die Wandarbeit.","Frena bien y practica la carrera de espaldas en cada ejercicio. Añade pases largos tras el trabajo de pared.","Freine proprement et travaille la course arrière dans chaque exercice. Ajoute des longues passes après le mur."],
tip_fb:["Link sprints with deliveries: after every run, one clean ball into the box.","Verbinde Sprints mit Hereingaben: nach jedem Lauf ein sauberer Ball in den Strafraum.","Une esprints y centros: tras cada carrera, un buen balón al área.","Enchaîne sprints et centres : après chaque course, un bon ballon dans la surface."],
tip_mf:["Look over your shoulder before every first touch. You are the outlet under pressure.","Mach vor jedem ersten Kontakt einen Schulterblick. Du bist die Anspielstation unter Druck.","Mira por encima del hombro antes de cada primer toque. Eres la salida bajo presión.","Regarde par-dessus ton épaule avant chaque première touche. Tu es la solution sous pression."],
tip_am:["Always take the ball forwards. Finish dribbles with a through ball or a shot.","Nimm den Ball immer nach vorn mit. Schließ Dribblings mit Steckpass oder Schuss ab.","Orienta siempre el balón hacia delante. Termina los regates con pase al hueco o tiro.","Oriente toujours le ballon vers l'avant. Termine tes dribbles par une passe en profondeur ou un tir."],
tip_wg:["Go at defenders one on one and finish with a cross or a shot.","Geh bewusst ins Eins-gegen-eins und schließ mit Flanke oder Schuss ab.","Encara en el uno contra uno y termina con centro o tiro.","Provoque le un contre un et termine par un centre ou un tir."],
tip_st:["End every technique drill with a finish: first touch, second touch shot.","Schließ jeden Technikdrill mit einem Abschluss ab: erster Kontakt, zweiter Kontakt Schuss.","Termina cada ejercicio técnico con un remate: primer toque, segundo toque tiro.","Termine chaque exercice technique par une frappe : première touche, deuxième touche tir."],
tip_grow:["You are still growing: coordination, technique and clean movement matter more than load right now.","Du wächst noch: Koordination, Technik und saubere Bewegung zählen jetzt mehr als Belastung.","Aún estás creciendo: la coordinación, la técnica y el movimiento limpio importan más que la carga.","Tu grandis encore : coordination, technique et qualité du geste comptent plus que la charge."],
tip_tall:["With your height: use your reach in the air and work on quick first steps and low turns.","Mit deiner Größe: Nutze deine Reichweite in der Luft und arbeite an schnellen ersten Schritten und tiefen Drehungen.","Con tu altura: aprovecha tu alcance por arriba y trabaja los primeros pasos rápidos y los giros bajos.","Avec ta taille : profite de ton envergure dans les airs et travaille les premiers appuis rapides et les demi-tours bas."],
tip_small:["With your height: your low centre of gravity is a weapon in tight turns. Work on timing and body position for duels.","Mit deiner Größe: Dein tiefer Schwerpunkt ist eine Waffe bei engen Drehungen. Arbeite an Timing und Körperstellung im Zweikampf.","Con tu altura: tu centro de gravedad bajo es un arma en los giros cortos. Trabaja el timing y la posición del cuerpo en los duelos.","Avec ta taille : ton centre de gravité bas est une arme dans les petits espaces. Travaille le timing et le placement du corps dans les duels."],
tip_mid:["Cone distances in the drills are set for your height.","Die Hütchenabstände in den Drills sind auf deine Größe abgestimmt.","Las distancias entre conos se ajustan a tu altura.","Les distances entre plots sont réglées selon ta taille."],

wu:["Warm-up","Aufwärmen","Calentamiento","Échauffement"],wu_t:["Jog easily, then do leg swings, lunges with a twist, high knees and two build-up runs.","Trabe locker, dann Beinpendel, Ausfallschritte mit Drehung, Kniehebelauf und zwei Steigerungsläufe.","Trota suave y luego haz balanceos de pierna, zancadas con giro, rodillas arriba y dos progresivos.","Trottine, puis balancements de jambes, fentes avec rotation, montées de genoux et deux accélérations progressives."],
cd:["Cool-down","Cool-down","Vuelta a la calma","Retour au calme"],cd_t:["Walk or jog for two minutes, then stretch calves, thighs and hip flexors for 30 seconds each. Drink.","Geh oder trabe zwei Minuten, dann Waden, Oberschenkel und Hüftbeuger je 30 Sekunden dehnen. Trinken.","Camina o trota dos minutos y estira gemelos, muslos y flexores de cadera 30 segundos cada uno. Bebe.","Marche ou trottine deux minutes, puis étire mollets, cuisses et fléchisseurs de hanche 30 secondes chacun. Bois."],

privacy_text:[
"Provider and controller: [NAME, ADDRESS, E-MAIL OF THE PROVIDER].\n\nWhat is processed: first name, age, height, weight, playing level, position, training plan and results, checklists, food and water log, journal, profile picture, coach chats and saved analyses. This data is stored only in the browser of your device and is not transmitted to the provider.\n\nAI features (optional): if you allow them, your messages, profile data, recent app entries and the images you upload are sent to Claude, a service of Anthropic, to generate answers.\n\nLeaderboard (optional): if you join, your nickname, points, streak, position and friends code are stored online and are visible to other users.\n\nLegal basis: your consent (Art. 6(1)(a) and, for health-related data, Art. 9(2)(a) GDPR). You can withdraw it at any time in Settings.\n\nMinimum age: 13. Users under 16 need the consent of a parent or guardian.\n\nYour rights: access, correction, erasure, restriction, data portability and complaint to a supervisory authority. Export and deletion are available in Settings.\n\nThe app uses no advertising and no tracking.",
"Anbieter und Verantwortlicher: [NAME, ANSCHRIFT, E-MAIL DES ANBIETERS].\n\nWas verarbeitet wird: Vorname, Alter, Größe, Gewicht, Spielniveau, Position, Trainingsplan und -ergebnisse, Checklisten, Essens- und Trinkprotokoll, Journal, Profilbild, Coach-Chats und gespeicherte Analysen. Diese Daten liegen nur im Browser deines Geräts und werden nicht an den Anbieter übertragen.\n\nKI-Funktionen (freiwillig): Wenn du sie erlaubst, werden deine Nachrichten, Profildaten, letzten App-Einträge und hochgeladenen Bilder an Claude, einen Dienst von Anthropic, gesendet, um Antworten zu erzeugen.\n\nLeaderboard (freiwillig): Wenn du teilnimmst, werden Spitzname, Punkte, Serie, Position und Freunde-Code online gespeichert und sind für andere Nutzer sichtbar.\n\nRechtsgrundlage: deine Einwilligung (Art. 6 Abs. 1 lit. a und für Gesundheitsdaten Art. 9 Abs. 2 lit. a DSGVO). Du kannst sie jederzeit in den Einstellungen widerrufen.\n\nMindestalter: 13 Jahre. Unter 16 ist die Einwilligung eines Erziehungsberechtigten nötig.\n\nDeine Rechte: Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Beschwerde bei einer Aufsichtsbehörde. Export und Löschung findest du in den Einstellungen.\n\nDie App nutzt keine Werbung und kein Tracking.",
"Proveedor y responsable: [NOMBRE, DIRECCIÓN, CORREO DEL PROVEEDOR].\n\nQué se trata: nombre, edad, altura, peso, nivel, posición, plan y resultados de entreno, listas, registro de comida y agua, diario, foto de perfil, chats con el coach y análisis guardados. Estos datos se guardan solo en el navegador de tu dispositivo y no se transmiten al proveedor.\n\nFunciones de IA (opcional): si las permites, tus mensajes, datos de perfil, entradas recientes e imágenes subidas se envían a Claude, un servicio de Anthropic, para generar respuestas.\n\nClasificación (opcional): si te unes, tu apodo, puntos, racha, posición y código de amigos se guardan en línea y son visibles para otros usuarios.\n\nBase jurídica: tu consentimiento (art. 6.1.a y, para datos de salud, art. 9.2.a RGPD). Puedes retirarlo en Ajustes en cualquier momento.\n\nEdad mínima: 13 años. Los menores de 16 necesitan el consentimiento de un padre, madre o tutor.\n\nTus derechos: acceso, rectificación, supresión, limitación, portabilidad y reclamación ante una autoridad de control. La exportación y el borrado están en Ajustes.\n\nLa app no usa publicidad ni rastreo.",
"Éditeur et responsable du traitement : [NOM, ADRESSE, E-MAIL DE L'ÉDITEUR].\n\nDonnées traitées : prénom, âge, taille, poids, niveau, poste, plan et résultats d'entraînement, listes, suivi des repas et de l'eau, journal, photo de profil, chats avec le coach et analyses enregistrées. Ces données sont stockées uniquement dans le navigateur de ton appareil et ne sont pas transmises à l'éditeur.\n\nFonctions IA (facultatif) : si tu les autorises, tes messages, données de profil, dernières saisies et images envoyées sont transmis à Claude, un service d'Anthropic, pour générer des réponses.\n\nClassement (facultatif) : si tu participes, ton pseudo, tes points, ta série, ton poste et ton code amis sont stockés en ligne et visibles par les autres utilisateurs.\n\nBase légale : ton consentement (art. 6, § 1, a et, pour les données de santé, art. 9, § 2, a du RGPD). Tu peux le retirer à tout moment dans les Réglages.\n\nÂge minimum : 13 ans. Les moins de 16 ans ont besoin de l'accord d'un parent ou tuteur.\n\nTes droits : accès, rectification, effacement, limitation, portabilité et réclamation auprès d'une autorité de contrôle. L'export et la suppression se trouvent dans les Réglages.\n\nL'app n'utilise ni publicité ni suivi."],
terms_text:[
"1. Baller Zone is a training aid for football players aged 13 and over. It is provided by [NAME OF THE PROVIDER].\n\n2. No medical advice: training, nutrition and AI content is general information. It does not replace a doctor, physiotherapist, dietitian or qualified coach. If you have pain, an injury or a medical condition, get professional advice before training.\n\n3. You train at your own risk. Warm up, choose a safe place and adapt the load to how you feel.\n\n4. AI coach and analysis can be wrong. Do not rely on them for health decisions.\n\n5. Leaderboard: use a nickname that is not your real name and is not offensive. Entries that break this rule may be removed.\n\n6. Only upload images and videos you are allowed to use and that show people who agree to it.\n\n7. The provider may change the app and these terms. [GOVERNING LAW AND CONTACT].",
"1. Baller Zone ist eine Trainingshilfe für Fußballer ab 13 Jahren. Anbieter ist [NAME DES ANBIETERS].\n\n2. Keine medizinische Beratung: Trainings-, Ernährungs- und KI-Inhalte sind allgemeine Informationen. Sie ersetzen keinen Arzt, Physiotherapeuten, Ernährungsberater oder qualifizierten Trainer. Bei Schmerzen, Verletzungen oder Erkrankungen hol dir vor dem Training fachlichen Rat.\n\n3. Du trainierst auf eigenes Risiko. Wärm dich auf, wähle einen sicheren Ort und pass die Belastung an dein Befinden an.\n\n4. KI-Coach und Analyse können sich irren. Verlass dich bei Gesundheitsfragen nicht darauf.\n\n5. Leaderboard: Nutze einen Spitznamen, der nicht dein echter Name und nicht beleidigend ist. Einträge, die dagegen verstoßen, können entfernt werden.\n\n6. Lade nur Bilder und Videos hoch, die du verwenden darfst und auf denen die gezeigten Personen einverstanden sind.\n\n7. Der Anbieter kann die App und diese Bedingungen ändern. [ANWENDBARES RECHT UND KONTAKT].",
"1. Baller Zone es una ayuda de entrenamiento para futbolistas a partir de 13 años. El proveedor es [NOMBRE DEL PROVEEDOR].\n\n2. No es consejo médico: los contenidos de entreno, nutrición e IA son información general. No sustituyen a un médico, fisioterapeuta, dietista o entrenador titulado. Si tienes dolor, una lesión o una enfermedad, pide consejo profesional antes de entrenar.\n\n3. Entrenas bajo tu propia responsabilidad. Calienta, elige un lugar seguro y adapta la carga a cómo te sientes.\n\n4. El coach de IA y el análisis pueden equivocarse. No te bases en ellos para decisiones de salud.\n\n5. Clasificación: usa un apodo que no sea tu nombre real ni resulte ofensivo. Las entradas que lo incumplan pueden eliminarse.\n\n6. Sube solo imágenes y vídeos que puedas usar y en los que las personas mostradas estén de acuerdo.\n\n7. El proveedor puede modificar la app y estas condiciones. [LEY APLICABLE Y CONTACTO].",
"1. Baller Zone est une aide à l'entraînement pour les footballeurs de 13 ans et plus. L'éditeur est [NOM DE L'ÉDITEUR].\n\n2. Pas de conseil médical : les contenus d'entraînement, de nutrition et d'IA sont des informations générales. Ils ne remplacent pas un médecin, un kinésithérapeute, un diététicien ou un entraîneur diplômé. En cas de douleur, de blessure ou de maladie, demande un avis professionnel avant de t'entraîner.\n\n3. Tu t'entraînes à tes propres risques. Échauffe-toi, choisis un lieu sûr et adapte la charge à ton état.\n\n4. Le coach IA et l'analyse peuvent se tromper. Ne t'y fie pas pour des décisions de santé.\n\n5. Classement : utilise un pseudo qui n'est pas ton vrai nom et qui n'est pas offensant. Les entrées contraires à cette règle peuvent être supprimées.\n\n6. N'envoie que des images et vidéos que tu as le droit d'utiliser et dont les personnes visibles sont d'accord.\n\n7. L'éditeur peut modifier l'app et ces conditions. [DROIT APPLICABLE ET CONTACT]."]

["v1","duel","p","t",5,20,"tight","tired","Shielding","Protect the ball from your partner for 20 seconds, with your body between them and the ball.","Ball abschirmen","Schirme den Ball 20 Sekunden vor deinem Partner ab, dein Körper ist zwischen ihm und dem Ball.","Proteger el balón","Protege el balón de tu compañero durante 20 segundos, con el cuerpo entre él y el balón.","Protection de balle","Protège le ballon de ton partenaire pendant 20 secondes, ton corps entre lui et le ballon."],
["v1","square","c","t",4,40,"head","speed","Box escape","Dribble inside the box with many small touches, then burst out through one side.","Ausbruch aus dem Quadrat","Dribble im Quadrat mit vielen kleinen Kontakten und brich dann über eine Seite aus.","Salida del cuadrado","Conduce dentro del cuadrado con muchos toques cortos y sal de golpe por un lado.","Sortie du carré","Conduis dans le carré avec beaucoup de petites touches, puis sors d'un coup par un côté."],
["v1","sprint","","r",2,6,"weak","clock","Knock and run","Push the ball ten metres past an imaginary defender and sprint onto it.","Vorlegen und sprinten","Leg den Ball zehn Meter an einem gedachten Gegner vorbei und sprinte hinterher.","Autopase y esprint","Adelanta el balón diez metros por delante de un defensor imaginario y esprinta a por él.","Grand pont et sprint","Pousse le ballon dix mètres au-delà d'un défenseur imaginaire et sprinte pour le reprendre."],
["v1","duel","cp","r",1,8,"tight","tired","1v1 to small goals","Attack your partner and score in a small cone goal behind them.","1 gegen 1 auf Minitore","Greif deinen Partner an und triff in ein kleines Hütchentor hinter ihm.","1 contra 1 a miniporterías","Encara a tu compañero y marca en una portería pequeña de conos detrás de él.","1 contre 1 sur mini-buts","Attaque ton partenaire et marque dans un petit but de plots derrière lui."],
["v1","shuttle","","r",3,8,"weak","speed","Drag-back turns","Dribble forward, drag the ball back with your sole, turn and go the other way.","Zurückzieher","Dribble vor, zieh den Ball mit der Sohle zurück, dreh dich und geh in die andere Richtung.","Giros con la suela","Conduce, arrastra el balón hacia atrás con la suela, gira y sal al otro lado.","Râteaux et demi-tours","Conduis, ramène le ballon en arrière avec la semelle, tourne et repars dans l'autre sens."],

["fi","shot","c","r",2,8,"weak","speed","Dribble and shoot","Dribble around the cone and shoot with your second touch.","Dribbling und Abschluss","Dribble um das Hütchen und schließe mit dem zweiten Kontakt ab.","Conducir y tirar","Rodea el cono conduciendo y tira con el segundo toque.","Conduite et tir","Contourne le plot en conduite et tire à la deuxième touche."],
["fi","shot","c","r",2,10,"weak","far","Placement into the corners","From twelve metres, pass the ball into the bottom corners with the inside of your foot.","Platziert in die Ecken","Schiebe den Ball aus zwölf Metern mit der Innenseite flach in die Ecken.","Colocación a las esquinas","Desde doce metros, coloca el balón raso en las esquinas con el interior.","Placement dans les coins","À douze mètres, place le ballon à ras de terre dans les coins de l'intérieur du pied."],
["fi","turn","wc","r",2,8,"weak","one","Wall one-two and shoot","Play a one-two off the wall and shoot with your next touch.","Doppelpass mit der Wand und Schuss","Spiel einen Doppelpass mit der Wand und schieß mit dem nächsten Kontakt.","Pared y tiro","Haz una pared con el muro y tira con el siguiente toque.","Une-deux avec le mur et tir","Fais un une-deux avec le mur et tire à la touche suivante."],
["fi","cross","cp","r",2,8,"one","air","Finish a cross","Your partner crosses from the wing. Time your run and finish in the box.","Flanke verwerten","Dein Partner flankt von außen. Time deinen Lauf und schließ im Strafraum ab.","Rematar un centro","Tu compañero centra desde la banda. Mide tu carrera y remata en el área.","Reprendre un centre","Ton partenaire centre depuis l'aile. Règle ta course et conclus dans la surface."],
["fi","shot","c","r",2,10,"weak","speed","First-time finish","Roll the ball ahead of you and strike it first time.","Direktabschluss","Leg dir den Ball vor und schieß direkt.","Remate de primera","Adelántate el balón y remata de primera.","Frappe en une touche","Pousse le ballon devant toi et frappe sans contrôle."],
["fi","touch","","r",3,10,"weak","air","Laces technique","Drop the ball from your hands and strike it low a few metres with your laces, toe pointing down.","Spanntechnik","Lass den Ball aus den Händen fallen und triff ihn flach mit dem Spann über ein paar Meter, Fußspitze nach unten.","Técnica de empeine","Deja caer el balón de las manos y golpéalo raso unos metros con el empeine, punta hacia abajo.","Technique du cou-de-pied","Laisse tomber le ballon des mains et frappe-le bas sur quelques mètres du cou-de-pied, pointe vers le bas."],
["fi","shot","c","r",2,8,"weak","press","Turn and shoot","Start with your back to goal, turn with one touch and shoot with the second.","Drehen und schießen","Starte mit dem Rücken zum Tor, dreh dich mit einem Kontakt und schieß mit dem zweiten.","Girar y tirar","Empieza de espaldas a portería, gira con un toque y tira con el segundo.","Pivoter et tirer","Commence dos au but, pivote en une touche et tire à la deuxième."],

["de","jockey","","t",4,30,"speed","tired","Jockey steps","Move backwards in a low, side-on stance and zigzag left and right.","Rückwärts verteidigen","Beweg dich tief und seitlich gestellt rückwärts im Zickzack nach links und rechts.","Pasos de temporización","Retrocede en posición baja y de perfil haciendo zigzag a izquierda y derecha.","Pas de recul défensif","Recule en position basse et de profil en zigzaguant à gauche et à droite."],
["de","jockey","p","t",5,30,"tight","tired","Shadow the attacker","Your partner dribbles at you. Stay an arm's length away and mirror every move without tackling.","Gegner begleiten","Dein Partner dribbelt auf dich zu. Bleib eine Armlänge entfernt und spiegle jede Bewegung, ohne zu attackieren.","Acompañar al atacante","Tu compañero te encara conduciendo. Mantente a un brazo de distancia y refleja cada movimiento sin entrar.","Accompagner l'attaquant","Ton partenaire te fixe en dribble. Reste à un bras de distance et reproduis chaque mouvement sans tacler."],
["de","shuttle","c","r",3,6,"speed","tired","Press and recover","Sprint to the cone as if pressing, slow down with small steps, then backpedal to the start.","Anlaufen und absichern","Sprinte zum Hütchen wie beim Anlaufen, brems mit kleinen Schritten ab und lauf rückwärts zum Start.","Presionar y replegar","Esprinta al cono como si presionaras, frena con pasos cortos y vuelve de espaldas a la salida.","Presser et se replacer","Sprinte vers le plot comme pour presser, freine à petits pas, puis recule jusqu'au départ."],
["de","duel","p","r",3,8,"weak","speed","Block tackle","Meet the ball together with your partner at walking pace: firm inside foot, body weight behind it.","Blocktackling","Triff den Ball gleichzeitig mit deinem Partner im Gehtempo: feste Innenseite, Körpergewicht dahinter.","Entrada de bloqueo","Ve al balón a la vez que tu compañero, andando: interior firme y el peso del cuerpo detrás.","Tacle de face","Va au ballon en même temps que ton partenaire, en marchant : intérieur du pied ferme, poids du corps derrière."],
["de","tee","c","t",4,30,"speed","tired","Defensive slides","Shuffle sideways between the cones without crossing your feet.","Seitliches Verschieben","Verschieb dich seitlich zwischen den Hütchen, ohne die Füße zu kreuzen.","Desplazamientos laterales","Desplázate lateralmente entre los conos sin cruzar los pies.","Déplacements latéraux","Déplace-toi latéralement entre les plots sans croiser les pieds."],
["de","duel","p","r",1,8,"tight","tired","1v1 defend the line","Your partner attacks. Stop them from dribbling over the line behind you.","1 gegen 1 Linie verteidigen","Dein Partner greift an. Verhindere, dass er über die Linie hinter dir dribbelt.","1 contra 1 defender la línea","Tu compañero ataca. Evita que cruce conduciendo la línea que tienes detrás.","1 contre 1 défendre la ligne","Ton partenaire attaque. Empêche-le de franchir en dribble la ligne derrière toi."],
["de","spot","","r",3,8,"speed","hold","Heading jumps","Jump off both feet and attack an imaginary ball with your forehead at the highest point.","Kopfballsprünge","Spring beidbeinig ab und geh am höchsten Punkt mit der Stirn zu einem gedachten Ball.","Saltos de cabeza","Salta con los dos pies y ataca un balón imaginario con la frente en el punto más alto.","Sauts de tête","Saute à deux pieds et attaque un ballon imaginaire du front au point le plus haut."],
["de","gate","cp","r",3,8,"speed","press","Interception","Your partner passes between two cones. Read it, step in and win the ball.","Pass abfangen","Dein Partner passt zwischen zwei Hütchen. Lies den Pass, geh dazwischen und hol den Ball.","Interceptar","Tu compañero pasa entre dos conos. Lee el pase, métete y roba el balón.","Interception","Ton partenaire passe entre deux plots. Lis la passe, coupe la trajectoire et récupère le ballon."],
["de","sprint","","r",2,6,"clock","tired","Recovery run","Backpedal five steps, turn and sprint 20 metres towards your own goal.","Rückwärtsbewegung und Sprint","Lauf fünf Schritte rückwärts, dreh dich und sprinte 20 Meter Richtung eigenes Tor.","Carrera de repliegue","Retrocede cinco pasos, gira y esprinta 20 metros hacia tu portería.","Course de repli","Recule de cinq pas, retourne-toi et sprinte 20 mètres vers ton but."],

["pc","sprint","","r",1,8,"clock","far","10-metre starts","Sprint ten metres from a standing start. Walk back and recover fully.","10-Meter-Antritte","Sprinte zehn Meter aus dem Stand. Geh zurück und erhol dich vollständig.","Salidas de 10 metros","Esprinta diez metros desde parado. Vuelve caminando y recupérate del todo.","Départs sur 10 mètres","Sprinte dix mètres départ arrêté. Reviens en marchant et récupère complètement."],

["pc","shuttle","c","r",1,6,"clock","short","5-10-5 change of direction","Start at the middle cone: sprint five metres one way, ten metres back, five metres to the middle.","Richtungswechsel 5-10-5","Starte am mittleren Hütchen: fünf Meter zur einen Seite, zehn zurück, fünf zur Mitte.","Cambio de dirección 5-10-5","Sal del cono central: cinco metros a un lado, diez de vuelta y cinco al centro.","Changement de direction 5-10-5","Pars du plot central : cinq mètres d'un côté, dix dans l'autre sens, cinq pour revenir au centre."],
["pc","spot","","t",4,15,"speed","short","High knees and skips","Drive your knees up fast on the spot, staying tall with quick arms.","Kniehebelauf und Skippings","Zieh die Knie am Ort schnell hoch, bleib aufrecht und arbeite mit den Armen.","Rodillas arriba y skipping","Sube las rodillas rápido en el sitio, erguido y con brazos activos.","Montées de genoux et skipping","Monte les genoux vite sur place, buste droit et bras actifs."],
["pc","tee","c","r",1,5,"clock","short","T-run","Sprint forward ten metres, shuffle five metres left, ten right, five back, then backpedal to the start.","T-Lauf","Sprinte zehn Meter vor, fünf Meter seitlich nach links, zehn nach rechts, fünf zurück, dann rückwärts zum Start.","Carrera en T","Esprinta diez metros, desplázate cinco a la izquierda, diez a la derecha, cinco de vuelta y regresa de espaldas.","Course en T","Sprinte dix mètres, déplace-toi de cinq à gauche, dix à droite, cinq pour revenir, puis recule jusqu'au départ."],
["pc","sprint","","r",1,8,"clock","far","Reaction starts","Drop the ball from shoulder height and sprint the moment it hits the ground.","Reaktionsstarts","Lass den Ball aus Schulterhöhe fallen und sprinte los, sobald er den Boden berührt.","Salidas de reacción","Deja caer el balón desde el hombro y esprinta en cuanto toque el suelo.","Départs réactifs","Lâche le ballon à hauteur d'épaule et sprinte dès qu'il touche le sol."],
["pc","spot","","t",4,15,"speed","short","Pogo jumps","Bounce on the balls of your feet with stiff ankles and as little ground contact as possible.","Pogo-Sprünge","Federe auf den Fußballen mit steifen Sprunggelenken und möglichst kurzem Bodenkontakt.","Saltos pogo","Rebota sobre las puntas con los tobillos rígidos y el menor contacto posible con el suelo.","Sauts pogo","Rebondis sur l'avant des pieds, chevilles rigides, avec un contact au sol minimal."],
["pc","sprint","","r",1,6,"clock","far","Hill sprints","Sprint up a gentle hill for 15 metres and walk back down.","Bergsprints","Sprinte 15 Meter einen leichten Hügel hoch und geh zurück.","Esprints en cuesta","Esprinta 15 metros por una cuesta suave y baja caminando.","Sprints en côte","Sprinte 15 mètres dans une côte légère et redescends en marchant."],
["pc","slalom","c","r",1,6,"clock","speed","Curve sprints","Sprint on an arc around the cones and lean into the curve.","Kurvensprints","Sprinte im Bogen um die Hütchen und leg dich in die Kurve.","Esprints en curva","Esprinta trazando un arco alrededor de los conos e inclínate hacia dentro.","Sprints en courbe","Sprinte en arc autour des plots en te penchant dans la courbe."],
["pc","sprint","p","r",1,6,"far","tired","Chase starts","Your partner starts two metres ahead. Catch them within 20 metres.","Verfolgungsstarts","Dein Partner startet zwei Meter vor dir. Hol ihn innerhalb von 20 Metern ein.","Salidas de persecución","Tu compañero sale dos metros por delante. Alcánzalo antes de 20 metros.","Départs poursuite","Ton partenaire part deux mètres devant. Rattrape-le en moins de 20 mètres."],

["cr","cross","c","r",2,8,"weak","speed","Wing run and cross","Dribble down the wing and cross into the zone in front of goal.","Flügellauf und Flanke","Dribble den Flügel entlang und flanke in die Zone vor dem Tor.","Carrera por banda y centro","Conduce por la banda y centra a la zona delante de la portería.","Débordement et centre","Conduis le long de l'aile et centre dans la zone devant le but."],
["cr","long","c","r",2,10,"weak","far","Far-post cross","From a standing ball on the wing, cross into a cone zone at the far post.","Flanke an den zweiten Pfosten","Flanke einen ruhenden Ball vom Flügel in eine Hütchenzone am zweiten Pfosten.","Centro al segundo palo","Con el balón parado en la banda, centra a una zona de conos en el segundo palo.","Centre au second poteau","Ballon arrêté sur l'aile, centre dans une zone de plots au second poteau."],
["cr","cross","c","r",2,8,"weak","speed","Cut-back","Dribble to the byline and pull the ball back to the zone at the penalty spot.","Rückpass von der Grundlinie","Dribble zur Grundlinie und leg den Ball zurück in die Zone am Elfmeterpunkt.","Pase atrás","Conduce hasta la línea de fondo y da el pase atrás a la zona del punto de penalti.","Centre en retrait","Conduis jusqu'à la ligne de but et remets en retrait dans la zone du point de penalty."],
["cr","wall","w","r",3,8,"weak","far","Whipped delivery","Strike across the ball with the inside of your foot and hit a head-high mark on the wall.","Scharfe Hereingabe","Triff den Ball mit der Innenseite angeschnitten und ziel auf eine kopfhohe Markierung an der Wand.","Centro con rosca","Golpea el balón con rosca con el interior y apunta a una marca a la altura de la cabeza.","Centre brossé","Brosse le ballon de l'intérieur du pied et vise une marque à hauteur de tête sur le mur."],
["cr","cross","cp","r",2,8,"one","speed","Cross for a runner","Cross for your partner, who runs into the box and finishes.","Flanke auf den Läufer","Flanke auf deinen Partner, der in den Strafraum läuft und abschließt.","Centro al rematador","Centra para tu compañero, que entra al área y remata.","Centre pour un coureur","Centre pour ton partenaire qui entre dans la surface et conclut."],
["cr","slalom","c","r",2,6,"weak","tired","Beat the cone, then cross","Dribble at the cones, go past the last one and cross straight away.","Am Hütchen vorbei und flanken","Dribble auf die Hütchen zu, geh am letzten vorbei und flanke sofort.","Superar el cono y centrar","Encara los conos, supera el último y centra de inmediato.","Passer le plot puis centrer","Conduis vers les plots, dépasse le dernier et centre aussitôt."],
["cr","long","","r",3,8,"weak","far","Chip technique","Lean back slightly, get your foot under the ball and drop it on a spot 15 metres away.","Chip-Technik","Lehn dich leicht zurück, komm mit dem Fuß unter den Ball und lass ihn auf einem Punkt in 15 Metern landen.","Técnica de pase picado","Inclínate un poco atrás, mete el pie bajo el balón y hazlo caer en un punto a 15 metros.","Technique du ballon piqué","Penche-toi légèrement en arrière, glisse le pied sous le ballon et fais-le retomber sur un point à 15 mètres."],
["cr","cross","c","r",2,8,"weak","one","Early cross","Cross from deep before you reach the box, with your first or second touch.","Frühe Flanke","Flanke aus dem Halbfeld, bevor du den Strafraum erreichst, mit dem ersten oder zweiten Kontakt.","Centro temprano","Centra desde lejos antes de llegar al área, al primer o segundo toque.","Centre précoce","Centre de loin avant d'atteindre la surface, en une ou deux touches."],
["cr","cross","c","r",2,8,"weak","speed","Low driven cross","Hit the ball hard and low across the face of goal.","Flache scharfe Hereingabe","Spiel den Ball hart und flach vor das Tor.","Centro raso y tenso","Golpea el balón fuerte y raso por delante de la portería.","Centre tendu à ras de terre","Frappe le ballon fort et à ras de terre devant le but."],

["st","spot","","r",3,12,"load","hold","Squats","Feet shoulder-width apart, sit back and down, then drive up.","Kniebeugen","Füße schulterbreit, Gesäß nach hinten und unten, dann kraftvoll hoch.","Sentadillas","Pies a la anchura de los hombros, baja llevando la cadera atrás y sube con fuerza.","Squats","Pieds à la largeur des épaules, descends les fesses en arrière, puis remonte avec force."],
["st","spot","","r",3,10,"load","hold","Lunges","Take a big step forward and lower your back knee almost to the ground. Count reps per leg.","Ausfallschritte","Mach einen großen Schritt nach vorn und senk das hintere Knie fast zum Boden. Wiederholungen pro Bein.","Zancadas","Da un paso largo y baja la rodilla de atrás casi hasta el suelo. Repeticiones por pierna.","Fentes","Fais un grand pas en avant et descends le genou arrière presque au sol. Répétitions par jambe."],
["st","spot","","r",3,10,"load","hold","Push-ups","Hands slightly wider than your shoulders, body in one line, chest to the ground.","Liegestütze","Hände etwas breiter als die Schultern, Körper in einer Linie, Brust zum Boden.","Flexiones","Manos algo más abiertas que los hombros, cuerpo en línea, pecho al suelo.","Pompes","Mains un peu plus écartées que les épaules, corps aligné, poitrine au sol."],
["st","spot","","t",3,30,"short","more","Plank","Forearms under your shoulders, body in one line, stomach tight.","Unterarmstütz","Unterarme unter den Schultern, Körper in einer Linie, Bauch fest.","Plancha","Antebrazos bajo los hombros, cuerpo en línea, abdomen firme.","Gainage","Avant-bras sous les épaules, corps aligné, ventre serré."],
["st","spot","","r",3,10,"load","hold","Single-leg glute bridge","Lie on your back, one foot planted, and lift your hips until knee, hip and shoulder line up. Reps per leg.","Einbeinige Hüftbrücke","Rückenlage, ein Fuß aufgestellt, Hüfte heben, bis Knie, Hüfte und Schulter eine Linie bilden. Pro Bein.","Puente de glúteo a una pierna","Boca arriba, un pie apoyado, sube la cadera hasta alinear rodilla, cadera y hombro. Por pierna.","Pont fessier sur une jambe","Sur le dos, un pied au sol, monte le bassin jusqu'à aligner genou, hanche et épaule. Par jambe."],
["st","spot","","t",3,20,"short","more","Side plank","Lie on your side, elbow under your shoulder, and lift your hips. Time per side.","Seitstütz","Seitlage, Ellbogen unter der Schulter, Hüfte anheben. Zeit pro Seite.","Plancha lateral","De lado, codo bajo el hombro, eleva la cadera. Tiempo por lado.","Gainage latéral","Sur le côté, coude sous l'épaule, soulève le bassin. Temps par côté."],
["st","spot","","r",3,8,"hold","more","Squat jumps","Squat down, jump as high as you can and land softly and quietly.","Strecksprünge","Geh in die Hocke, spring so hoch du kannst und lande weich und leise.","Saltos desde sentadilla","Baja a sentadilla, salta lo más alto posible y cae suave y sin ruido.","Squats sautés","Descends en squat, saute le plus haut possible et atterris en douceur, sans bruit."],
["st","spot","","r",3,6,"load","more","Hamstring walkouts","From a glute bridge, walk your heels out step by step and back in.","Hamstring-Walkouts","Wandere aus der Hüftbrücke mit den Fersen Schritt für Schritt nach vorn und wieder zurück.","Caminata de isquios","Desde el puente de glúteo, aleja los talones paso a paso y vuelve.","Marche des ischios","En pont fessier, éloigne les talons pas à pas puis reviens."],
["st","spot","","r",3,12,"load","hold","Single-leg calf raises","Stand on one leg, rise onto your toes and lower slowly. Reps per leg.","Einbeiniges Wadenheben","Steh auf einem Bein, drück dich auf die Zehen hoch und senk langsam ab. Pro Bein.","Elevaciones de gemelo a una pierna","De pie sobre una pierna, sube de puntillas y baja despacio. Por pierna.","Mollets sur une jambe","Debout sur une jambe, monte sur la pointe et redescends lentement. Par jambe."],
