["v1","duel","cp","r",3,6,"","","Feint and change of direction against a reactive opponent","Fake one gate and go through the other as soon as the opponent reacts.","Täuschung und Richtungswechsel gegen reaktiven Gegner","Täusche ein Tor an und geh durch das andere, sobald der Gegner reagiert.","Finta y cambio de dirección contra un rival reactivo","Amaga una puerta y sal por la otra en cuanto el rival reaccione.","Feinte et changement de direction face à un adversaire réactif","Simule une porte et sors par l'autre dès que l'adversaire réagit."],
["v1","duel","p","t",4,30,"","","Shield, turn and explosive burst","Shield, turn and five metres away at full speed.","Ballabschirmung, Drehung und explosiver Antritt","Abschirmen, aufdrehen und fünf Meter mit vollem Tempo weg.","Protección, giro y arrancada explosiva","Proteger, girar y cinco metros a toda velocidad.","Protection, demi-tour et démarrage explosif","Protéger, se retourner, puis cinq mètres à pleine vitesse."],
["v1","duel","cp","r",3,6,"","","One v one after a fast pass","Hard pass, one touch to control, then straight into the duel.","Eins gegen eins nach hoher Passgeschwindigkeit","Scharfer Pass, ein Kontakt zur Kontrolle, dann sofort ins Duell.","Uno contra uno tras un pase rápido","Pase fuerte, un toque de control y directo al duelo.","Un contre un après une passe rapide","Passe appuyée, une touche de contrôle, puis duel immédiat."],
["v1","duel","cp","r",3,5,"","","One v two with gaining ground as the aim","Two active defenders. Your target is the zone behind them.","Eins gegen zwei mit Raumgewinn als Ziel","Zwei aktive Verteidiger. Dein Ziel ist die Zone hinter ihnen.","Uno contra dos con el objetivo de ganar espacio","Dos defensores activos. Tu objetivo es la zona a su espalda.","Un contre deux pour gagner du terrain","Deux défenseurs actifs. Ton objectif est la zone derrière eux."],
["v1","duel","cp","r",3,6,"","","Dribbling against a defender with a changing start signal","The start comes on a shout, a hand signal or with the pass.","Dribbling gegen einen Verteidiger mit wechselndem Startsignal","Der Start kommt mal auf Zuruf, mal auf ein Handzeichen, mal mit dem Pass.","Regate contra un defensor con señal de salida cambiante","La salida llega a la voz, con un gesto o con el pase.","Dribble face à un défenseur avec signal de départ variable","Le départ se donne tantôt à la voix, tantôt d'un geste, tantôt avec la passe."],
["v1","shot","c","r",3,6,"","","Feint and finish against an active opponent","If a partner is there he defends actively in place of the cone.","Finte und Abschluss gegen einen aktiven Gegner","Ist ein Partner da, verteidigt er aktiv statt des Hütchens.","Finta y remate contra un rival activo","Si hay un compañero, defiende de forma activa en lugar del cono.","Feinte et frappe face à un adversaire actif","Si un partenaire est là, il défend activement à la place du plot."],
["v1","duel","cp","r",3,6,"","","One v one with a time limit","You have six seconds to get over the line.","Eins gegen eins mit Zeitbegrenzung","Du hast sechs Sekunden, um über die Linie zu kommen.","Uno contra uno con límite de tiempo","Tienes seis segundos para cruzar la línea.","Un contre un avec limite de temps","Tu as six secondes pour franchir la ligne."],
["v1","duel","p","t",4,30,"","","Keeping the ball, then a vertical pass","Hold it for five seconds, then pass forward through a cone gate.","Ballbehauptung und anschließender Vertikalpass","Fünf Sekunden behaupten, dann der Pass nach vorn durch ein Hütchentor.","Conservar el balón y después pase vertical","Aguanta cinco segundos y después pasa hacia delante por una puerta de conos.","Conservation du ballon puis passe verticale","Tiens cinq secondes, puis passe vers l'avant dans une porte de plots."],
["v1","duel","p","t",4,30,"","","Change of direction against a physical opponent","The opponent uses his body. Stay low and stable.","Richtungswechsel gegen einen körperlich aktiven Gegner","Der Gegner arbeitet mit dem Körper. Bleib tief und stabil.","Cambio de dirección contra un rival físico","El rival usa el cuerpo. Mantente bajo y estable.","Changement de direction face à un adversaire physique","L'adversaire joue avec son corps. Reste bas et stable."],
["v1","duel","cp","r",3,6,"","","One v one with two passing options","The gates are team-mates: dribble or release the ball at the right moment.","Eins gegen eins mit zwei möglichen Passoptionen","Die Tore sind Mitspieler: dribbeln oder im richtigen Moment abspielen.","Uno contra uno con dos opciones de pase","Las puertas son compañeros: regatea o suelta el balón en el momento justo.","Un contre un avec deux options de passe","Les portes sont des coéquipiers : dribble ou lâche le ballon au bon moment."],
["v1","duel","cp","r",3,6,"","","Dribbling after a quick transition","After winning the ball you have three seconds before the opponent is set.","Dribbling nach schnellem Umschalten","Nach dem Ballgewinn hast du drei Sekunden, bevor der Gegner sortiert ist.","Regate tras una transición rápida","Tras la recuperación tienes tres segundos antes de que el rival se ordene.","Dribble après une transition rapide","Après la récupération, tu as trois secondes avant que l'adversaire ne soit en place."],
["v1","duel","p","t",4,30,"","","Shielding and turning under pressure","Full body contact in your back and you still turn.","Ballabschirmung und Aufdrehen unter Druck","Voller Körperkontakt im Rücken, du drehst trotzdem auf.","Protección y giro bajo presión","Contacto total en la espalda y aun así giras.","Protection et demi-tour sous pression","Contact total dans le dos, et tu te retournes quand même."],
["v1","duel","cp","r",3,6,"","","One v one after a reactive reception","The ball arrives awkwardly or in the air. Control first, then attack.","Eins gegen eins nach reaktiver Ballannahme","Der Ball kommt unsauber oder hoch. Erst kontrollieren, dann angreifen.","Uno contra uno tras un control reactivo","El balón llega sucio o por alto. Primero controla y luego ataca.","Un contre un après un contrôle réactif","Le ballon arrive mal ou en hauteur. Contrôle d'abord, attaque ensuite."],
["fi","givego","cp","r",3,6,"","","Finish after a wall pass and run in behind","Wall pass, 15-metre run in behind, first-touch finish.","Abschluss nach Wandpass und Tiefenlauf","Wandpass, 15 Meter Tiefenlauf, Abschluss mit dem ersten Kontakt.","Remate tras pared y desmarque en profundidad","Pared, 15 metros al espacio y remate al primer toque.","Frappe après un appui et un appel en profondeur","Appui, 15 mètres en profondeur, frappe en une touche."],
["fi","cross","cp","r",3,6,"","","First-time shot from a hard pass","Hard pass, no control touch, low into the corner.","Direktschuss nach scharfem Zuspiel","Hartes Zuspiel, kein Kontakt zur Kontrolle, flach ins Eck.","Tiro de primeras tras un pase fuerte","Pase fuerte, sin toque de control, raso a la esquina.","Tir en une touche sur une passe appuyée","Passe appuyée, aucun contrôle, à ras de terre dans le coin."],
["fi","shot","c","r",3,6,"","","Finish after a short sprint with a change of direction","Sprint with a cut round a cone, then the finish.","Abschluss nach kurzem Sprint mit Richtungswechsel","Sprint mit einem Haken um ein Hütchen, dann der Abschluss.","Remate tras un esprint corto con cambio de dirección","Esprint con un recorte alrededor de un cono y después el remate.","Frappe après un sprint court avec changement de direction","Sprint avec un crochet autour d'un plot, puis la frappe."],
["fi","cross","cp","r",3,6,"","","Finish from a cross with a changing target","The cross comes to the near post one time and the far post the next.","Abschluss nach Flanke mit wechselnder Zielposition","Die Flanke kommt mal an den ersten, mal an den zweiten Pfosten.","Remate tras un centro con zona cambiante","El centro llega unas veces al primer palo y otras al segundo.","Reprise sur un centre à zone variable","Le centre arrive tantôt au premier poteau, tantôt au second."],
["fi","shot","cp","r",3,6,"","","Finish after winning the ball and transition","Win the ball, switch, finish: all within five seconds.","Abschluss nach Ballgewinn und Umschalten","Ballgewinn, umschalten, Abschluss: alles in fünf Sekunden.","Remate tras recuperación y transición","Recuperación, transición y remate: todo en cinco segundos.","Frappe après récupération et transition","Récupération, transition, frappe : le tout en cinq secondes."],
["fi","givego","cp","r",3,6,"","","Finish under time pressure after a passing combination","Three passes and the shot have to be done in six seconds.","Abschluss unter Zeitdruck nach Passkombination","Drei Pässe und der Schuss müssen in sechs Sekunden fertig sein.","Remate contra el reloj tras una combinación","Tres pases y el tiro deben completarse en seis segundos.","Frappe sous pression du temps après une combinaison","Trois passes et la frappe doivent être bouclées en six secondes."],
["fi","shot","cp","r",3,6,"","","Weaker-foot finish under pressure","The chaser is on your heels and you finish with your weaker foot.","Abschluss mit schwächerem Fuß unter Druck","Der Verfolger ist dir im Nacken und du schließt mit dem schwächeren Fuß ab.","Remate con la pierna menos hábil bajo presión","El perseguidor te pisa los talones y defines con la pierna menos hábil.","Frappe du mauvais pied sous pression","Le poursuivant est sur tes talons et tu conclus du mauvais pied."],
["fi","cross","cp","r",3,6,"","","First-time finish from the edge of the box","The ball is laid back to the edge of the box and you shoot first time.","Direkter Abschluss aus dem Rückraum","Der Ball wird an die Strafraumgrenze zurückgelegt, du schießt direkt.","Remate de primeras desde la frontal","El balón se deja atrás en la frontal del área y tiras de primeras.","Frappe en une touche depuis l'entrée de la surface","Le ballon est remis à l'entrée de la surface, tu frappes en une touche."],
["fi","shot","c","r",3,6,"","","Finish after a turn against a defender","The defender is tight on your back. Turn away from his pressure.","Abschluss nach Drehung gegen einen Verteidiger","Der Verteidiger steht eng in deinem Rücken. Dreh dich von seinem Druck weg.","Remate tras un giro contra un defensor","El defensor está pegado a tu espalda. Gira alejándote de su presión.","Frappe après un demi-tour face à un défenseur","Le défenseur est collé dans ton dos. Tourne à l'opposé de sa pression."],
["fi","shot","c","r",3,6,"","","Finish after a pass into the box","The pass comes into the box, you run in and finish with one touch.","Abschluss nach Pass in den Strafraum","Der Pass kommt in den Strafraum, du läufst ein und schließt mit einem Kontakt ab.","Remate tras un pase al área","El pase llega al área, entras y defines con un toque.","Frappe après une passe dans la surface","La passe arrive dans la surface, tu t'engages et tu conclus en une touche."],
["fi","shot","c","r",3,6,"","","Finish after a dribble with a change of direction","Two cuts on the dribble, then the shot on the move.","Abschluss nach Dribbling mit Richtungswechsel","Zwei Haken im Dribbling, dann der Schuss aus der Bewegung.","Remate tras un regate con cambio de dirección","Dos recortes en conducción y después el tiro en movimiento.","Frappe après un dribble avec changement de direction","Deux crochets en dribble, puis la frappe dans le mouvement."],
["fi","givego","cp","r",3,6,"","","Finish after a one-two under pressure","A defender disrupts both the one-two and the finish.","Abschluss nach Doppelpass unter Gegnerdruck","Ein Verteidiger stört den Doppelpass und den Abschluss.","Remate tras una pared bajo presión","Un defensor molesta la pared y el remate.","Frappe après un une-deux sous pression","Un défenseur gêne le une-deux et la frappe."],
["fi","shot","c","r",3,8,"","","Finishing into changing corners","The corner is only called during your run-up.","Abschluss auf wechselnde Torecken","Das Eck wird erst im Anlauf angesagt.","Remates a esquinas cambiantes","La esquina se anuncia durante la carrera.","Frappes dans des coins variables","Le coin n'est annoncé que pendant ta course d'élan."],
["fi","cross","cp","r",3,6,"","","First-time shot from a ball in from the side","Driven ball in from the side, one-touch finish.","Direktschuss nach Hereingabe von der Seite","Scharfe Hereingabe von der Seite, Abschluss mit einem Kontakt.","Tiro de primeras tras un centro lateral","Centro tenso desde el costado y remate a un toque.","Tir en une touche sur un centre venu du côté","Centre tendu depuis le côté, reprise en une touche."],
["fi","shot","cp","r",3,6,"","","Finish after a fast counter-attack","Start at the halfway line, full sprint with the ball, finish without slowing down.","Abschluss nach schnellem Gegenangriff","Start an der Mittellinie, voller Sprint mit Ball, Abschluss ohne abzubremsen.","Remate tras un contraataque rápido","Salida en el centro del campo, esprint a tope con balón y remate sin frenar.","Frappe après une contre-attaque rapide","Départ au milieu de terrain, sprint à fond avec ballon, frappe sans ralentir."],
["en","shuttle","c","t",6,45,"","","Repeated sprints with the ball and a follow-up action","Every sprint with the ball ends with an action: pass, feint or shot.","Wiederholte Sprints mit Ball und Anschlussaktion","Nach jedem Sprint mit Ball folgt eine Aktion: Pass, Finte oder Schuss.","Esprints repetidos con balón y acción posterior","Cada esprint con balón termina con una acción: pase, finta o tiro.","Sprints répétés avec ballon et action enchaînée","Chaque sprint avec ballon se termine par une action : passe, feinte ou tir."],
["en","lap","","t",8,40,"","","Interval runs over changing distances","The distance changes: 100, 200, 300 metres and back down.","Intervallläufe mit wechselnden Distanzen","Die Strecke wechselt: 100, 200, 300 Meter und wieder zurück.","Intervalos con distancias cambiantes","La distancia cambia: 100, 200, 300 metros y vuelta a bajar.","Intervalles sur distances variables","La distance change : 100, 200, 300 mètres, puis on redescend."],
["en","shuttle","wc","t",6,45,"","","Intense passing series after repeated bursts","Three ten-metre bursts, then 20 passes at full tempo.","Intensive Passserie nach wiederholten Antritten","Drei Antritte über zehn Meter, dann 20 Pässe mit vollem Tempo.","Serie intensa de pases tras arrancadas repetidas","Tres arrancadas de diez metros y después 20 pases a ritmo máximo.","Série de passes intense après des démarrages répétés","Trois démarrages de dix mètres, puis 20 passes à plein rythme."],
["en","shuttle","c","t",6,45,"","","Transition course with short running intervals","Win the ball, dribble, sprint back: every station is a transition moment.","Umschaltparcours mit kurzen Laufintervallen","Ballgewinn, Dribbling, Rückweg im Sprint: jede Station ist ein Umschaltmoment.","Circuito de transiciones con intervalos cortos de carrera","Recuperar, conducir y volver esprintando: cada estación es una transición.","Parcours de transition avec intervalles de course courts","Récupération, dribble, retour en sprint : chaque atelier est une transition."],
["en","square","cp","t",6,60,"","","Small-sided game with intense phases","Four minutes of play at maximum intensity, two minutes' rest.","Spielform mit intensiven Belastungsphasen","Vier Minuten Spiel mit maximaler Intensität, zwei Minuten Pause.","Juego reducido con fases intensas","Cuatro minutos de juego a máxima intensidad, dos minutos de pausa.","Jeu réduit avec phases intenses","Quatre minutes de jeu à intensité maximale, deux minutes de pause."],
["en","shuttle","wc","t",6,45,"","","Technical combinations after work blocks","Every work block is followed by a combination that has to be error-free.","Technische Kombinationen nach Belastungsblöcken","Nach jedem Belastungsblock folgt eine Kombination, die fehlerfrei sein muss.","Combinaciones técnicas tras bloques de esfuerzo","Tras cada bloque de esfuerzo viene una combinación que debe salir sin fallo.","Combinaisons techniques après des blocs d'effort","Chaque bloc d'effort est suivi d'une combinaison qui doit être sans faute."],
["en","shuttle","c","t",6,45,"","","Repeated bursts with a complete technical action","Every burst ends with control, feint and finish.","Wiederholte Antritte mit vollständiger technischer Aktion","Jeder Antritt endet mit Annahme, Finte und Abschluss.","Arrancadas repetidas con una acción técnica completa","Cada arrancada termina con control, finta y remate.","Démarrages répétés avec action technique complète","Chaque démarrage se termine par contrôle, feinte et frappe."],
["en","shuttle","wc","t",6,45,"","","Dribbling and passing under growing fatigue","The rest gets shorter every round while the technique stays just as clean.","Dribbling und Pass unter zunehmender Ermüdung","Mit jeder Runde wird die Pause kürzer, die Technik bleibt gleich sauber.","Conducción y pase con fatiga creciente","La pausa se acorta en cada vuelta y la técnica sigue igual de limpia.","Dribble et passe sous fatigue croissante","La pause raccourcit à chaque tour, la technique reste aussi propre."],
["en","shuttle","wc","t",6,45,"","","Shuttle runs with changing technical tasks","A different task from last time waits at every turning point.","Shuttle-Runs mit wechselnden technischen Aufgaben","An jedem Wendepunkt wartet eine andere Aufgabe als beim letzten Mal.","Carreras de ida y vuelta con tareas técnicas cambiantes","En cada giro te espera una tarea distinta a la anterior.","Navettes avec tâches techniques variables","À chaque demi-tour, une tâche différente de la précédente t'attend."],
["en","shuttle","wc","t",6,45,"","","Running interval followed by a game decision","After the run a signal decides whether you pass, dribble or shoot.","Laufintervall mit anschließender Spielentscheidung","Nach dem Lauf entscheidet ein Signal, ob du passt, dribbelst oder schießt.","Intervalo de carrera seguido de una decisión de juego","Tras la carrera una señal decide si pasas, conduces o tiras.","Intervalle de course suivi d'une décision de jeu","Après la course, un signal décide si tu passes, dribbles ou tires."],
["pc","sprint","c","r",2,4,"","","30-metre sprint with clean acceleration","The first ten metres low and powerful, then rise and let it run.","Sprint über 30 Meter mit sauberer Beschleunigung","Die ersten zehn Meter tief und kraftvoll, dann aufrichten und laufen lassen.","Esprint de 30 metros con aceleración limpia","Los primeros diez metros bajo y potente; después te enderezas y dejas correr.","Sprint de 30 mètres avec accélération propre","Les dix premiers mètres bas et puissants, puis redresse-toi et laisse filer."],
["pc","sprint","cp","r",2,6,"","","Reactive burst on an opponent's movement","Your opponent starts whenever he likes. You have to beat him to the finish.","Reaktiver Antritt auf die Bewegung eines Gegners","Dein Gegner startet, wann er will. Du musst vor ihm am Ziel sein.","Arrancada reactiva al movimiento de un rival","Tu rival sale cuando quiere. Tienes que llegar antes que él.","Démarrage réactif sur le mouvement d'un adversaire","Ton adversaire part quand il veut. Tu dois arriver avant lui."],
["pc","shot","wc","r",2,5,"","","Sprint after receiving and changing direction","Receive off the wall, one cut, then 15 metres with the ball.","Sprint nach Ballannahme und Richtungswechsel","Annahme von der Wand, ein Haken, dann 15 Meter mit Ball.","Esprint tras control y cambio de dirección","Control desde la pared, un recorte y 15 metros con balón.","Sprint après contrôle et changement de direction","Contrôle sur le mur, un crochet, puis 15 mètres avec ballon."],
["pc","sprint","c","r",2,5,"","","Acceleration followed by braking","20 metres flat out, brake, two steps back and start again at once.","Beschleunigung mit anschließendem Abbremsen","20 Meter voll, abbremsen, zwei Schritte zurück und sofort wieder starten.","Aceleración seguida de frenada","20 metros a tope, frenar, dos pasos atrás y salir de nuevo.","Accélération suivie d'un freinage","20 mètres à fond, freinage, deux pas en arrière et nouveau départ immédiat."],
["pc","sprint","c","r",2,5,"","","Sprint from different football positions","Start from backpedalling, from a side shuffle and after a jump.","Sprint aus verschiedenen Fußballpositionen","Starte aus dem Rückwärtslauf, aus dem Seitwärtsschritt und nach einem Sprung.","Esprint desde distintas posiciones de fútbol","Sal desde carrera de espaldas, desde paso lateral y tras un salto.","Sprint depuis différentes positions de football","Pars en course arrière, en pas chassés et après un saut."],
["pc","shot","c","r",2,5,"","","Reactive sprint with the ball and a finish","Start on a signal, sprint with the ball, finish on goal.","Reaktiver Sprint mit Ball und Torabschluss","Start auf ein Signal, Sprint mit Ball, Abschluss aufs Tor.","Esprint reactivo con balón y remate","Salida a la señal, esprint con balón y remate a portería.","Sprint réactif avec ballon et frappe","Départ au signal, sprint avec ballon, frappe au but."],
["pc","sprint","c","r",2,5,"","","Sprint after a 180-degree turn","Face backwards, turn and be at full speed within two steps.","Sprint nach einer 180-Grad-Drehung","Rückwärts stehen, drehen und in zwei Schritten auf vollem Tempo sein.","Esprint tras un giro de 180 grados","De espaldas, giro y a toda velocidad en dos pasos.","Sprint après un demi-tour","Dos à la course, demi-tour, et à pleine vitesse en deux appuis."],
["pc","ypath","cp","r",2,6,"","","Sprint and change of direction on a visual signal","A colour or hand signal decides the side.","Sprint und Richtungswechsel auf visuelles Signal","Eine Farbe oder ein Handzeichen bestimmt die Seite.","Esprint y cambio de dirección a una señal visual","Un color o un gesto de la mano decide el lado.","Sprint et changement de direction sur signal visuel","Une couleur ou un geste de la main décide du côté."],
["pc","sprint","cp","r",2,6,"","","Burst on an opponent's movement","You are defending: your opponent feints and you follow his real start.","Antritt nach Gegnerbewegung","Du verteidigst: Dein Gegner täuscht an und du folgst seinem echten Start.","Arrancada según el movimiento del rival","Tú defiendes: el rival amaga y sigues su salida real.","Démarrage sur le mouvement de l'adversaire","Tu défends : l'adversaire feinte et tu suis son vrai départ."],
["pc","sprint","cp","r",2,5,"","","Sprint duel followed by a pass","Whoever reaches the ball first plays an accurate pass through a cone gate at once.","Sprintduell mit anschließendem Pass","Wer zuerst am Ball ist, spielt sofort einen genauen Pass durch ein Hütchentor.","Duelo de velocidad seguido de un pase","Quien llegue primero al balón da enseguida un pase preciso por una puerta de conos.","Duel de sprint suivi d'une passe","Le premier sur le ballon donne aussitôt une passe précise dans une porte de plots."],
["cr","overlap","cp","r",3,5,"","","Cross after an overlap and return-pass combination","Overlap, pass back, offer again and then cross.","Flanke nach Überlaufen und Rückpasskombination","Überlaufen, Rückpass, erneut anbieten und dann flanken.","Centro tras desdoblamiento y combinación con devolución","Desdoblar, devolver, ofrecerte de nuevo y centrar.","Centre après un dédoublement et une remise","Dédoublement, remise, nouvelle proposition, puis centre."],
["cr","cross","c","r",3,6,"","","Driven ball in at high speed","Full speed over 20 metres and the ball in stays low and hard.","Scharfe Hereingabe nach hohem Tempo","Volles Tempo über 20 Meter, die Hereingabe bleibt flach und scharf.","Centro tenso a alta velocidad","A toda velocidad durante 20 metros y el centro sigue raso y fuerte.","Centre tendu à pleine vitesse","Pleine vitesse sur 20 mètres, le centre reste à ras de terre et tendu."],
["cr","cross","cp","r",3,5,"","","Cross after dribbling past a defender","Win the duel on the wing first, then cross.","Flanke nach Dribbling gegen einen Verteidiger","Erst das Duell am Flügel gewinnen, dann flanken.","Centro tras regatear a un defensor","Primero gana el duelo en la banda y después centra.","Centre après avoir dribblé un défenseur","Gagne d'abord le duel sur l'aile, puis centre."],
["cr","overlap","cp","r",3,5,"","","Cutback after a double passing combination","Two one-twos to the byline, then low into the space behind.","Rückraumflanke nach doppelter Passkombination","Zwei Doppelpässe bis zur Grundlinie, dann flach in den Rückraum.","Pase atrás tras una doble combinación","Dos paredes hasta la línea de fondo y pase atrás raso.","Centre en retrait après une double combinaison","Deux une-deux jusqu'à la ligne de but, puis remise en retrait à ras de terre."],
["cr","cross","cp","r",3,5,"","","Cross to a target player's changing runs","The target player varies his run and you adjust height and zone.","Flanke auf wechselnde Laufwege eines Zielspielers","Der Zielspieler wechselt seinen Laufweg, du passt Höhe und Zone an.","Centro a las carreras cambiantes de un rematador","El rematador cambia su carrera y tú ajustas la altura y la zona.","Centre sur les courses variables d'un joueur cible","Le joueur cible varie sa course, tu adaptes la hauteur et la zone."],
["cr","cross","c","r",3,6,"","","Cross after a quick transition down the wing","Start in your own half, 30 metres of speed dribbling, cross.","Flanke nach schnellem Umschalten über den Flügel","Start in der eigenen Hälfte, 30 Meter Tempodribbling, Flanke.","Centro tras una transición rápida por la banda","Salida en campo propio, 30 metros de conducción a velocidad y centro.","Centre après une transition rapide sur l'aile","Départ dans ta moitié, 30 mètres de conduite rapide, centre."],

["st","spot","g","r",3,12,"","","Goblet squat with controlled load progression","Only add weight when every rep was clean.","Goblet Squat mit kontrollierter Laststeigerung","Steigere das Gewicht nur, wenn alle Wiederholungen sauber waren.","Sentadilla goblet con progresión de carga controlada","Sube el peso solo si todas las repeticiones fueron limpias.","Goblet squat avec progression de charge contrôlée","N'augmente la charge que si toutes les répétitions étaient propres."],

["st","spot","g","r",3,8,"","","Romanian deadlift with a moderate load under supervision","Moderate weight, flat back and someone experienced watching.","Romanian Deadlift mit moderater Last unter Aufsicht","Mittleres Gewicht, gerader Rücken und jemand Erfahrenes, der zuschaut.","Peso muerto rumano con carga moderada y supervisión","Carga moderada, espalda recta y alguien con experiencia observando.","Soulevé de terre roumain avec charge modérée, sous supervision","Charge modérée, dos plat et une personne expérimentée qui observe."],

["st","spot","x","r",3,6,"","","Single-leg squat to a stable box","Down to the box under control without dropping.","Einbeinige Kniebeuge zur stabilen Box","Kontrolliert bis zur Box, ohne dich fallen zu lassen.","Sentadilla a una pierna hasta un cajón estable","Baja con control hasta el cajón sin dejarte caer.","Squat sur une jambe jusqu'à une box stable","Descends en contrôle jusqu'à la box, sans te laisser tomber."],
["st","spot","","r",3,10,"","","Explosive push-ups at a safe difficulty","Push up so fast your hands briefly leave the floor, or do it raised with hands on a bench.","Explosive Liegestütze in sicherer Schwierigkeit","Drück dich so schnell hoch, dass die Hände kurz abheben, oder erhöht mit den Händen auf einer Bank.","Flexiones explosivas con dificultad segura","Empuja tan rápido que las manos se despeguen un instante, o hazlo con las manos en un banco.","Pompes explosives à difficulté adaptée","Repousse si vite que les mains décollent un instant, ou surélève les mains sur un banc."],
["st","spot","u","r",3,5,"","","Assisted pull-ups or pull-up progression","With a band for help or just the slow lowering until full pull-ups work.","Unterstützte Klimmzüge oder Klimmzugprogression","Mit Band als Hilfe oder nur das langsame Ablassen, bis ganze Klimmzüge gehen.","Dominadas asistidas o progresión de dominadas","Con una banda de ayuda o solo la bajada lenta hasta que salgan dominadas completas.","Tractions assistées ou progression vers la traction","Avec une bande d'aide ou seulement la descente lente, jusqu'à réussir des tractions complètes."],
["st","spot","g","r",3,10,"","","Dumbbell rows with a stable core","Bent over with a flat back, torso not rotating.","Rudern mit Kurzhanteln und stabilem Rumpf","Vorgebeugt mit geradem Rücken, der Rumpf dreht nicht mit.","Remo con mancuernas y tronco estable","Inclinado con la espalda recta, el tronco no gira.","Rowing avec haltères, tronc stable","Penché, dos plat, le buste ne tourne pas."],
["st","spot","p","r",3,5,"","","Nordic hamstring with a controlled lowering","Lower yourself for at least four seconds.","Nordic Hamstring mit kontrollierter Absenkung","Senk dich mindestens vier Sekunden lang ab.","Nórdicos con bajada controlada","Baja durante al menos cuatro segundos.","Nordic hamstring avec descente contrôlée","Descends pendant au moins quatre secondes."],
["st","spot","x","t",3,15,"","","Copenhagen plank with a longer lever","The foot rests on the bench, not the knee.","Copenhagen-Plank mit längerer Hebelwirkung","Der Fuß liegt auf der Bank, nicht das Knie.","Plancha Copenhague con palanca más larga","Se apoya el pie en el banco, no la rodilla.","Planche Copenhague avec bras de levier plus long","C'est le pied qui repose sur le banc, pas le genou."],
["st","spot","y","r",3,8,"","","Gym-ball hamstring curl with hip extension","Extend the hips fully first, then curl the ball in.","Hamstring-Curl mit Gymnastikball und Hüftstreckung","Erst die Hüfte ganz strecken, dann den Ball heranziehen.","Curl de isquiotibiales con fitball y extensión de cadera","Primero extiende del todo la cadera y después acerca el balón.","Leg curl avec ballon de gym et extension de hanche","Tends d'abord complètement les hanches, puis ramène le ballon."],
["st","spot","r","r",3,10,"","","Pallof press with a step","Take a step to the side with every press.","Pallof Press mit Schrittbewegung","Mit jedem Ausstrecken machst du einen Schritt zur Seite.","Press Pallof con paso","Con cada extensión das un paso hacia un lado.","Pallof press avec déplacement","À chaque extension, fais un pas sur le côté."],
["st","sprint","g","t",3,30,"","","Farmer's carry with moderate weights","Carry for 20 metres, shoulders down, no swaying.","Farmer's Carry mit moderaten Gewichten","20 Meter tragen, Schultern tief, kein Schwanken.","Paseo del granjero con pesos moderados","Transporta 20 metros, hombros bajos y sin balanceo.","Marche du fermier avec charges modérées","Porte sur 20 mètres, épaules basses, sans tanguer."],
["st","spot","","r",3,6,"","","Vertical jumps with a controlled landing","Maximum height, quiet landing, reset before every jump.","Vertikalsprünge mit kontrollierter Landung","Maximale Höhe, leise Landung, vor jedem Sprung neu aufstellen.","Saltos verticales con caída controlada","Altura máxima, caída silenciosa y recolócate antes de cada salto.","Sauts verticaux avec réception contrôlée","Hauteur maximale, réception silencieuse, replace-toi avant chaque saut."],
["st","spot","","r",3,8,"","","Multiple jumps with short ground contacts","Five jumps in a row as if the ground were hot.","Mehrfachsprünge mit kurzen Bodenkontakten","Fünf Sprünge hintereinander, der Boden ist heiß.","Saltos múltiples con contactos cortos","Cinco saltos seguidos, como si el suelo quemara.","Sauts enchaînés à contacts brefs","Cinq sauts de suite, comme si le sol brûlait."],
["st","sprint","hc","r",3,4,"","","Hurdle jumps followed by a 10-metre sprint","Three hurdles, then ten metres at full speed.","Hürdensprünge mit anschließendem 10-Meter-Sprint","Drei Hürden, dann zehn Meter mit vollem Tempo.","Saltos de vallas seguidos de un esprint de 10 metros","Tres vallas y después diez metros a toda velocidad.","Sauts de haies suivis d'un sprint de 10 mètres","Trois haies, puis dix mètres à pleine vitesse."],
["st","ypath","cp","r",2,6,"","","Reactive changes of direction on random signals","The signals come at random, so you never know where you go next.","Reaktive Richtungswechsel auf zufällige Signale","Die Signale kommen zufällig, du weißt nie, wohin es als Nächstes geht.","Cambios de dirección reactivos a señales aleatorias","Las señales llegan al azar; nunca sabes hacia dónde toca después.","Changements de direction réactifs sur signaux aléatoires","Les signaux arrivent au hasard, tu ne sais jamais où aller ensuite."],
["st","square","c","t",3,180,"","","Full-body athletic circuit with strength, jump, sprint and stability stations","Four stations with no rest in between, three rounds.","Ganzkörper-Athletikzirkel mit Kraft-, Sprung-, Sprint- und Stabilitätsstationen","Vier Stationen ohne Pause dazwischen, drei Runden.","Circuito atlético de cuerpo completo con estaciones de fuerza, salto, esprint y estabilidad","Cuatro estaciones sin pausa entre ellas, tres vueltas.","Circuit athlétique complet avec ateliers de force, de saut, de sprint et de gainage","Quatre ateliers sans pause entre eux, trois tours."],
["iq","turn","wc","r",3,8,"","","Shoulder check before receiving","Look over your shoulder once before the ball reaches you.","Schulterblick vor der Annahme","Schau einmal über die Schulter, bevor der Ball bei dir ist.","Mirar por encima del hombro antes de recibir","Mira una vez por encima del hombro antes de que te llegue el balón.","Prise d'information avant le contrôle","Regarde une fois par-dessus l'épaule avant que le ballon n'arrive."],
["iq","slalom","c","r",3,4,"","","Dribbling with your head up","Between the cones look ahead instead of at the ball.","Dribbling mit erhobenem Kopf","Schau zwischen den Hütchen nach vorn statt auf den Ball.","Conducción con la cabeza levantada","Entre los conos mira al frente en vez de al balón.","Dribble tête levée","Entre les plots, regarde devant toi plutôt que le ballon."],
["iq","star","c","r",3,8,"","","Spot the colour and run to it","Without a ball: on the signal run to the matching cone and back.","Farbe erkennen und hinlaufen","Ohne Ball: Auf das Signal läufst du zum passenden Hütchen und zurück.","Reconocer el color y correr hacia él","Sin balón: a la señal corres al cono correspondiente y vuelves.","Repérer la couleur et y courir","Sans ballon : au signal, cours au plot correspondant et reviens."],
["iq","slalom","c","r",3,4,"","","Calling numbers while dribbling","In the slalom count down from 20 out loud without slowing.","Zahlen ansagen beim Dribbling","Zähle im Slalom laut von 20 rückwärts, ohne langsamer zu werden.","Decir números mientras conduces","En el eslalon cuenta en voz alta de 20 hacia atrás sin perder ritmo.","Annoncer des nombres en dribblant","Dans le slalom, compte à rebours depuis 20 à voix haute sans ralentir."],
["iq","turn","wc","r",3,8,"","","Find the free cone","Before each pass put a bib on one of the two cones. The other one is free.","Das freie Hütchen finden","Leg vor jedem Pass ein Leibchen auf eines der beiden Hütchen. Das andere ist frei.","Encontrar el cono libre","Antes de cada pase pon un peto en uno de los dos conos. El otro está libre.","Trouver le plot libre","Avant chaque passe, pose un chasuble sur l'un des deux plots. L'autre est libre."],
["iq","gate","cp","r",3,10,"","","Pass into the called gate","Left or right: the target is called before you pass.","Pass ins angesagte Tor","Links oder rechts: Das Ziel wird vor deinem Pass angesagt.","Pase a la puerta anunciada","Izquierda o derecha: el objetivo se anuncia antes de tu pase.","Passe dans la porte annoncée","Gauche ou droite : la cible est annoncée avant ta passe."],
["iq","star","c","r",3,8,"","","Star dribble on a call","With a ball: dribble to the called cone and back to the middle.","Stern-Dribbling auf Zuruf","Mit Ball: Dribble zum angesagten Hütchen und zurück in die Mitte.","Estrella con balón a la voz","Con balón: conduce al cono anunciado y vuelve al centro.","Étoile balle au pied à l'appel","Avec ballon : dribble jusqu'au plot annoncé et reviens au centre."],
["iq","duel","cp","r",3,6,"","","Decide left or right","Go through the gate the opponent or the signal leaves open.","Links oder rechts entscheiden","Geh durch das Tor, das der Gegner oder das Signal frei lässt.","Decidir izquierda o derecha","Sal por la puerta que el rival o la señal deje libre.","Décider gauche ou droite","Passe par la porte que l'adversaire ou le signal laisse libre."],
["iq","turn","wc","r",3,8,"","","Double shoulder check","Look over both shoulders before you receive the ball.","Doppelter Schulterblick","Schau über beide Schultern, bevor du den Ball annimmst.","Doble mirada por encima del hombro","Mira por encima de ambos hombros antes de recibir el balón.","Double prise d'information","Regarde par-dessus les deux épaules avant de contrôler le ballon."],
["iq","star","wcp","r",3,8,"","","First touch to the called colour","Your first touch goes to the cone whose colour is called.","Annahme zur angesagten Farbe","Der erste Kontakt geht zu dem Hütchen, dessen Farbe gerufen wird.","Control hacia el color anunciado","El primer toque va al cono cuyo color se anuncia.","Contrôle vers la couleur annoncée","La première touche part vers le plot dont la couleur est annoncée."],
["iq","square","cp","t",4,45,"","","Getting free in the square","After every pass find a new free corner.","Freilaufen im Quadrat","Nach jedem Pass suchst du eine neue freie Ecke.","Desmarque en el cuadrado","Tras cada pase buscas una nueva esquina libre.","Se démarquer dans le carré","Après chaque passe, cherche un nouveau coin libre."],
["iq","slalom","c","r",3,4,"","","Dribbling with look-points and changes of pace","Speed up at the left look-point, slow down at the right.","Dribbling mit Blickpunkten und Tempowechsel","Am linken Blickpunkt wirst du schnell, am rechten langsam.","Conducción con puntos de mirada y cambios de ritmo","En el punto izquierdo aceleras y en el derecho frenas.","Dribble avec repères visuels et changements de rythme","Accélère au repère gauche, ralentis au repère droit."],
["iq","gate","cp","r",3,10,"","","Passing decision at the last moment","The free gate is only shown once you are already swinging.","Passentscheidung im letzten Moment","Das freie Tor wird erst gezeigt, wenn du schon ausholst.","Decisión de pase en el último momento","La puerta libre se muestra cuando ya estás armando el pase.","Choix de passe au dernier moment","La porte libre n'est montrée que lorsque tu armes déjà ta passe."],
["iq","star","c","r",3,8,"","","Star with the opposite rule","If left is called you go right, if forward you go back.","Stern mit Gegenteil-Regel","Wird links gerufen, läufst du nach rechts, bei vorne nach hinten.","Estrella con la regla del contrario","Si se dice izquierda vas a la derecha; si delante, atrás.","Étoile avec la règle du contraire","Si on annonce gauche, tu vas à droite ; si c'est devant, tu vas derrière."],
["iq","gate","wc","r",3,10,"","","Open body shape with a view of the pitch","Before receiving say out loud what lies or stands behind you.","Offene Stellung mit Blick ins Feld","Sag vor der Annahme laut, was hinter dir liegt oder steht.","Perfil abierto con visión del campo","Antes de recibir di en voz alta lo que hay detrás de ti.","Corps ouvert avec vue sur le terrain","Avant le contrôle, dis à voix haute ce qui se trouve derrière toi."],
["iq","duel","cp","t",4,60,"","","Small game with four goals","Two gates per side: always attack the one that is defended worse.","Kleines Spiel auf vier Tore","Zwei Tore pro Seite: Greif immer das an, das schlechter verteidigt ist.","Juego reducido a cuatro porterías","Dos puertas por lado: ataca siempre la peor defendida.","Petit jeu sur quatre buts","Deux portes par côté : attaque toujours la moins bien défendue."],
