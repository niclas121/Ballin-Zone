["iq","turn","wc","r",3,10,"","","First-time play after a shoulder check","You choose the target before the ball is back and play first time.","Direktspiel nach Schulterblick","Du entscheidest das Ziel, bevor der Ball zurück ist, und spielst direkt.","Juego de primeras tras mirar por encima del hombro","Decides el objetivo antes de que vuelva el balón y juegas de primeras.","Jeu en une touche après prise d'information","Tu choisis la cible avant le retour du ballon et tu joues en une touche."],
["iq","tri","cp","r",3,8,"","","Spotting the third man","Don't play back to the nearest player but to the one coming free.","Den dritten Mann erkennen","Spiel nicht zum Nächststehenden zurück, sondern zum Spieler, der frei wird.","Reconocer al tercer hombre","No devuelvas al más cercano, sino al jugador que queda libre.","Repérer le troisième homme","Ne rejoue pas sur le plus proche, mais sur celui qui se libère."],
["iq","square","cp","t",4,45,"","","Finding space behind the opponent","A cone is the opponent. Always offer yourself so it is not in the passing line.","Raum hinter dem Gegner finden","Ein Hütchen ist der Gegner. Biete dich immer so an, dass es nicht in der Passlinie steht.","Encontrar el espacio detrás del rival","Un cono es el rival. Ofrécete siempre de modo que no esté en la línea de pase.","Trouver l'espace derrière l'adversaire","Un plot est l'adversaire. Propose-toi toujours hors de sa ligne de passe."],
["iq","turn","wcp","r",3,8,"","","Decision under pressure","There are two gates to choose from and the opponent is closing you down.","Entscheidung unter Druck","Zwei Tore stehen zur Wahl und der Gegner läuft dich an.","Decisión bajo presión","Hay dos puertas para elegir y el rival viene a presionarte.","Décision sous pression","Deux portes au choix et l'adversaire te presse."],
["iq","star","c","r",3,8,"","","Two signals, one solution","The colour decides the cone, the number the action there.","Zwei Signale, eine Lösung","Die Farbe bestimmt das Hütchen, die Zahl die Aktion dort.","Dos señales, una solución","El color decide el cono y el número la acción allí.","Deux signaux, une solution","La couleur désigne le plot, le chiffre l'action à y faire."],
["iq","duel","cp","r",3,6,"","","Reading the opponent in a one v one","Watch his standing leg. You go to the side it is planted on.","Den Gegner im Eins gegen Eins lesen","Achte auf sein Standbein. Du gehst zu der Seite, auf der es steht.","Leer al rival en el uno contra uno","Fíjate en su pierna de apoyo. Sal por el lado donde la tiene clavada.","Lire l'adversaire en un contre un","Observe sa jambe d'appui. Tu pars du côté où elle est posée."],
["iq","square","cp","t",4,60,"","","Rondo with touches on a call","Before every pass it is called whether one or two touches are allowed.","Rondo mit Kontaktzahl auf Zuruf","Vor jedem Pass wird gerufen, ob ein oder zwei Kontakte erlaubt sind.","Rondo con toques a la voz","Antes de cada pase se anuncia si se permite uno o dos toques.","Toro avec nombre de touches annoncé","Avant chaque passe, on annonce si une ou deux touches sont permises."],
["iq","turn","wp","r",3,8,"","","Receiving away from pressure","Spot the opponent's side and take the ball the other way.","Annahme weg vom Druck","Erkenne die Seite des Gegners und nimm den Ball in die andere mit.","Control alejándose de la presión","Detecta el lado del rival y llévate el balón al contrario.","Contrôle à l'opposé de la pression","Repère le côté de l'adversaire et emmène le ballon de l'autre."],
["iq","long","cp","r",3,8,"","","Reading the run","Your partner goes short or long. You read it from his first step.","Den Laufweg lesen","Dein Partner startet kurz oder lang. Du erkennst es an seinem ersten Schritt.","Leer el desmarque","Tu compañero viene en corto o se va en largo. Lo lees en su primer paso.","Lire la course","Ton partenaire vient court ou part long. Tu le lis à son premier appui."],
["iq","duel","cp","t",4,60,"","","Reacting after losing the ball","Whoever loses the ball hunts it flat out for five seconds.","Umschalten nach Ballverlust","Wer den Ball verliert, jagt ihn fünf Sekunden lang mit vollem Einsatz.","Transición tras pérdida","Quien pierde el balón lo persigue a tope durante cinco segundos.","Réaction à la perte du ballon","Celui qui perd le ballon le chasse à fond pendant cinq secondes."],
["iq","slalom","c","r",3,4,"","","Mental arithmetic while dribbling","Solve small sums out loud while you dribble through the slalom.","Rechenaufgabe beim Dribbling","Löse laut kleine Rechenaufgaben, während du durch den Slalom dribbelst.","Cálculo mental mientras conduces","Resuelve pequeñas cuentas en voz alta mientras haces el eslalon.","Calcul mental en dribblant","Résous de petits calculs à voix haute pendant ton slalom."],
["iq","turn","wc","t",4,40,"","","Triple shoulder check under time pressure","Three looks before every reception, as many clean runs as possible in 40 seconds.","Dreifacher Schulterblick unter Zeitdruck","Drei Blicke vor jeder Annahme, so viele saubere Durchgänge wie möglich in 40 Sekunden.","Triple mirada contra el reloj","Tres miradas antes de cada control, tantas repeticiones limpias como puedas en 40 segundos.","Triple prise d'information sous pression du temps","Trois regards avant chaque contrôle, un maximum de passages propres en 40 secondes."],
["iq","star","wcp","r",3,8,"","","Colour code with two rules","One colour means towards, the other means away. The rule changes every round.","Farbcode mit zwei Regeln","Eine Farbe heißt hin, die andere heißt weg. Die Regel wechselt nach jeder Runde.","Código de colores con dos reglas","Un color significa ir hacia él y el otro alejarte. La regla cambia en cada ronda.","Code couleur à deux règles","Une couleur veut dire y aller, l'autre s'en éloigner. La règle change à chaque tour."],
["iq","turn","wc","r",3,10,"","","Pre-scanning and vertical pass","You know the free gate before your first touch and play forward with the second.","Vororientierung und Vertikalpass","Du kennst das freie Tor vor dem ersten Kontakt und spielst mit dem zweiten steil.","Orientación previa y pase vertical","Conoces la puerta libre antes del primer toque y juegas en vertical con el segundo.","Prise d'information et passe verticale","Tu connais la porte libre avant ta première touche et tu joues vers l'avant à la deuxième."],
["iq","square","cp","t",4,60,"","","Rondo with a switch signal","On a signal the ball has to go to the opposite side at once.","Rondo mit Seitenwechsel-Signal","Auf ein Signal muss der Ball sofort auf die gegenüberliegende Seite.","Rondo con señal de cambio de orientación","A una señal el balón debe ir enseguida al lado opuesto.","Toro avec signal de renversement","Sur un signal, le ballon doit aller aussitôt du côté opposé."],
["iq","square","cp","t",4,45,"","","Getting free between the lines","Two rows of cones are the lines. You ask for the ball only in the space between.","Freilaufen zwischen den Linien","Zwei Hütchenreihen sind die Ketten. Du forderst den Ball nur im Raum dazwischen.","Desmarque entre líneas","Dos filas de conos son las líneas. Solo pides el balón en el espacio entre ellas.","Se démarquer entre les lignes","Deux rangées de plots sont les lignes. Tu ne demandes le ballon qu'entre elles."],
["iq","duel","cp","t",4,60,"","","Four-goal game with shifting overloads","A neutral player always helps the team in possession.","Vier-Tore-Spiel mit Überzahlwechsel","Ein neutraler Spieler hilft immer der Mannschaft in Ballbesitz.","Juego a cuatro porterías con superioridad cambiante","Un comodín ayuda siempre al equipo que tiene el balón.","Jeu sur quatre buts avec supériorité variable","Un joueur neutre aide toujours l'équipe en possession."],
["iq","gate","cp","r",3,10,"","","Pass against the opponent's movement","The opponent shifts to one side and you play in behind him.","Pass gegen die Laufrichtung des Gegners","Der Gegner verschiebt zu einer Seite, du spielst in seinen Rücken.","Pase a contrapié del rival","El rival bascula hacia un lado y tú juegas a su espalda.","Passe à contre-pied de l'adversaire","L'adversaire coulisse d'un côté, tu joues dans son dos."],
["iq","long","cp","r",3,8,"","","Run behind the opponent's back","The runner goes on the side the defender can't see. Your pass arrives right there.","Laufweg im Rücken des Gegners","Der Läufer startet auf der Seite, die der Verteidiger nicht sieht. Dein Pass kommt genau dorthin.","Desmarque a la espalda del rival","El compañero arranca por el lado que el defensor no ve. Tu pase llega justo ahí.","Appel dans le dos de l'adversaire","Le coureur part du côté que le défenseur ne voit pas. Ta passe arrive pile là."],
["iq","duel","cp","r",3,6,"","","Dribble or pass","If the opponent commits you play through the gate. If he holds you dribble past.","Dribbeln oder passen","Greift der Gegner an, spielst du durchs Tor. Bleibt er stehen, dribbelst du vorbei.","Regatear o pasar","Si el rival entra, pasas por la puerta. Si aguanta, lo regateas.","Dribbler ou passer","Si l'adversaire sort, tu joues dans la porte. S'il temporise, tu le dribbles."],
["iq","tri","cp","t",4,45,"","","Third man under time pressure","In 45 seconds count only the runs where the third man plays first time.","Dritter Mann unter Zeitdruck","Zählt in 45 Sekunden nur die Durchgänge, in denen der dritte Mann direkt spielt.","Tercer hombre contra el reloj","En 45 segundos contad solo las secuencias en las que el tercer hombre juega de primeras.","Troisième homme sous pression du temps","En 45 secondes, ne comptez que les enchaînements où le troisième homme joue en une touche."],
["iq","star","c","r",3,8,"","","Reaction star with the ball and a final action","A task waits at the called cone: pass, feint or shot.","Reaktions-Stern mit Ball und Abschlussaktion","Am angesagten Hütchen wartet eine Aufgabe: Pass, Finte oder Schuss.","Estrella de reacción con balón y acción final","En el cono anunciado te espera una tarea: pase, finta o tiro.","Étoile de réaction avec ballon et action finale","Une tâche t'attend au plot annoncé : passe, feinte ou tir."],
["iq","turn","wcp","r",3,8,"","","Call the situation and solve it","Before receiving say out loud what you will do, then carry it out.","Spielsituation ansagen und lösen","Sag vor der Annahme laut, was du tun wirst, und zieh es dann durch.","Anunciar la situación y resolverla","Antes de recibir di en voz alta lo que vas a hacer y después hazlo.","Annoncer la situation et la résoudre","Avant le contrôle, dis à voix haute ce que tu vas faire, puis fais-le."]];
window.BZ_TS={"recv_wall":["Play the ball low and firm against the wall.|Step towards the ball and cushion it softly.|Set it with your first touch so you can play straight away.","Spiel den Ball flach und fest gegen die Wand.|Geh dem Ball einen Schritt entgegen und nimm ihn weich an.|Leg ihn dir mit dem ersten Kontakt spielbereit vor den Fuß.","Juega el balón raso y fuerte contra la pared.|Da un paso hacia el balón y amortígualo con suavidad.|Déjalo con el primer toque listo para jugar.","Joue le ballon à ras de terre et fort contre le mur.|Fais un pas vers le ballon et amortis-le en douceur.|Place-le dès la première touche pour pouvoir jouer tout de suite."],"recv_go":["Play against the wall and stay on your toes.|Take the ball in the new direction with your first touch.|Follow it with three quick steps.","Spiel gegen die Wand und bleib auf den Fußballen.|Nimm den Ball mit dem ersten Kontakt in die neue Richtung mit.|Geh mit drei schnellen Schritten hinterher.","Juega contra la pared y mantente de puntillas.|Llévate el balón con el primer toque en la nueva dirección.|Síguelo con tres pasos rápidos.","Joue contre le mur et reste sur la pointe des pieds.|Emmène le ballon dans la nouvelle direction dès la première touche.|Suis-le avec trois pas rapides."],"recv_open":["Stand side-on so you can see both ball and pitch.|Let the ball run across your body onto the back foot.|Take it through the cone gate with one touch.","Stell dich seitlich, sodass du Ball und Spielfeld siehst.|Lass den Ball am Körper vorbei auf den hinteren Fuß laufen.|Nimm ihn mit einem Kontakt durch das Hütchentor mit.","Colócate de lado para ver el balón y el campo.|Deja que el balón cruce tu cuerpo hasta el pie más alejado.|Llévatelo con un toque por la puerta de conos.","Place-toi de profil pour voir le ballon et le terrain.|Laisse le ballon passer devant toi jusqu'au pied arrière.|Emmène-le en une touche à travers la porte de plots."],"recv_turn":["Play against the wall and glance over your shoulder.|Receive side-on and turn in one movement.|Dribble at speed to the cone behind you.","Spiel gegen die Wand und schau kurz über die Schulter.|Nimm den Ball seitlich an und dreh dich in einer Bewegung.|Dribble mit Tempo bis zum Hütchen hinter dir.","Juega contra la pared y mira un instante por encima del hombro.|Recibe de lado y gira en un solo movimiento.|Conduce con velocidad hasta el cono que tienes detrás.","Joue contre le mur et jette un œil par-dessus l'épaule.|Contrôle de profil et tourne-toi dans le même mouvement.|Conduis vite jusqu'au plot derrière toi."],"recv_back":["Put a cone or pole right behind you as the opponent.|Ask for the ball, get low and keep an arm back for distance.|Receive away from the opponent and turn around it.","Stell ein Hütchen oder eine Stange als Gegner direkt hinter dich.|Fordere den Ball, geh tief und halte den Arm als Abstand nach hinten.|Nimm den Ball vom Gegner weg an und dreh dich um ihn herum.","Coloca un cono o una pica justo detrás de ti como rival.|Pide el balón, baja el centro de gravedad y usa el brazo para marcar distancia.|Recibe lejos del rival y gira rodeándolo.","Place un plot ou un piquet juste derrière toi comme adversaire.|Demande le ballon, fléchis et garde un bras en arrière pour la distance.|Contrôle loin de l'adversaire et tourne autour de lui."],"recv_scan":["Play against the wall.|Look over your shoulder while the ball travels and note the free cone.|Take your first touch exactly towards it.","Spiel gegen die Wand.|Schau über die Schulter, solange der Ball unterwegs ist, und merke dir das freie Hütchen.|Nimm den Ball mit dem ersten Kontakt genau dorthin mit.","Juega contra la pared.|Mira por encima del hombro mientras viaja el balón y fíjate en el cono libre.|Orienta el primer toque justo hacia allí.","Joue contre le mur.|Regarde par-dessus l'épaule pendant que le ballon voyage et repère le plot libre.|Oriente ta première touche exactement vers lui."],"recv_gate":["Build a one-metre cone gate diagonally in front of you.|Play against the wall and open your body.|Push your first touch right through the gate and follow it.","Bau schräg vor dir ein Hütchentor von einem Meter Breite.|Spiel gegen die Wand und stell dich offen.|Spiel den ersten Kontakt genau durch das Tor und lauf hinterher.","Monta una puerta de conos de un metro en diagonal delante de ti.|Juega contra la pared y perfílate.|Orienta el primer toque justo por la puerta y ve tras él.","Installe une porte de plots d'un mètre en diagonale devant toi.|Joue contre le mur et ouvre ton corps.|Pousse ta première touche pile dans la porte et suis-la."],"recv_pass":["Play against the wall and open up towards the target.|Receive with the back foot towards the target.|Pass low through the cone gate with your second touch.","Spiel gegen die Wand und stell dich offen zum Ziel.|Nimm den Ball mit dem hinteren Fuß in Richtung Ziel an.|Spiel mit dem zweiten Kontakt flach durch das Hütchentor.","Juega contra la pared y perfílate hacia el objetivo.|Recibe con el pie más alejado en dirección al objetivo.|Pasa raso por la puerta de conos con el segundo toque.","Joue contre le mur et ouvre-toi vers la cible.|Contrôle du pied arrière en direction de la cible.|Passe à ras de terre dans la porte de plots à la deuxième touche."],"recv_press":["Your partner starts from behind as the opponent as soon as you play against the wall.|Look over your shoulder and see which side he comes from.|Take your first touch away to the other side.","Dein Partner startet als Gegner von hinten, sobald du gegen die Wand spielst.|Schau über die Schulter und erkenne, von welcher Seite er kommt.|Nimm den Ball mit dem ersten Kontakt auf die andere Seite weg.","Tu compañero sale desde atrás como rival en cuanto juegas contra la pared.|Mira por encima del hombro y detecta por qué lado llega.|Sal con el primer toque hacia el lado contrario.","Ton partenaire part de derrière comme adversaire dès que tu joues contre le mur.|Regarde par-dessus l'épaule et repère de quel côté il arrive.|Pars de l'autre côté dès la première touche."],"recv_code":["Place three cones of different colours around you.|Your partner calls a colour while the ball is on its way.|Take your first touch towards that colour.","Stell drei verschiedenfarbige Hütchen um dich herum auf.|Dein Partner ruft eine Farbe, während der Ball zu dir unterwegs ist.|Nimm den Ball mit dem ersten Kontakt zur genannten Farbe mit.","Coloca tres conos de colores distintos a tu alrededor.|Tu compañero dice un color mientras el balón viene hacia ti.|Orienta el primer toque hacia ese color.","Place trois plots de couleurs différentes autour de toi.|Ton partenaire annonce une couleur pendant que le ballon arrive.|Oriente ta première touche vers cette couleur."],"pass_wall":["Stand four metres from the wall, standing foot next to the ball.|Pass low with the inside and lock your ankle.|Keep moving and hold a steady rhythm.","Stell dich vier Meter vor die Wand, Standfuß neben den Ball.|Spiel flach mit der Innenseite und fixiere das Fußgelenk.|Bleib in Bewegung und halte einen gleichmäßigen Rhythmus.","Colócate a cuatro metros de la pared, pie de apoyo junto al balón.|Pasa raso con el interior y bloquea el tobillo.|Mantente en movimiento y lleva un ritmo constante.","Place-toi à quatre mètres du mur, pied d'appui à côté du ballon.|Passe à ras de terre de l'intérieur, cheville verrouillée.|Reste en mouvement et garde un rythme régulier."],"pass_gate":["Build a cone gate and stand eight metres away.|Look at the gate first, then at the ball.|Pass low and firm right through the middle.","Bau ein Hütchentor und stell dich acht Meter davor.|Schau erst auf das Tor, dann auf den Ball.|Spiel flach und fest genau durch die Mitte.","Monta una puerta de conos y colócate a ocho metros.|Mira primero la puerta y luego el balón.|Pasa raso y fuerte justo por el centro.","Installe une porte de plots et place-toi à huit mètres.|Regarde d'abord la porte, puis le ballon.|Passe à ras de terre et fort, pile au milieu."],"pass_move":["Play the ball firmly against the wall.|Sprint to the next cone as soon as you have passed.|Deal with the rebound there and pass again.","Spiel den Ball fest gegen die Wand.|Sprinte sofort nach dem Pass zum nächsten Hütchen.|Verarbeite dort den Abpraller und spiel wieder.","Juega el balón fuerte contra la pared.|Esprinta al siguiente cono nada más pasar.|Controla allí el rebote y vuelve a pasar.","Joue le ballon fort contre le mur.|Sprinte vers le plot suivant dès la passe faite.|Gère le rebond là-bas et repasse."],"pass_diag":["Carry the ball sideways past the cone with two touches.|Lift your head and find the cone gate.|Play the pass low and firm through the gate.","Nimm den Ball mit zwei Kontakten seitlich am Hütchen vorbei mit.|Heb den Kopf und suche das Hütchentor.|Spiel den Pass flach und fest durch das Tor.","Lleva el balón de lado con dos toques superando el cono.|Levanta la cabeza y busca la puerta de conos.|Da el pase raso y fuerte por la puerta.","Emmène le ballon sur le côté en deux touches en passant le plot.|Lève la tête et cherche la porte de plots.|Donne la passe à ras de terre et fort dans la porte."],"pass_third":["Play the first pass and offer yourself again at once.|Let the ball be laid off onwards instead of straight back to you.|Run in behind and take the third pass in your stride.","Spiel den ersten Pass und biete dich sofort neu an.|Lass den Ball direkt weiterleiten, statt ihn zurückzubekommen.|Lauf in die Tiefe und nimm den dritten Pass im Lauf mit.","Da el primer pase y vuelve a ofrecerte enseguida.|Deja que el balón siga hacia otro en lugar de volver a ti.|Corre al espacio y recibe el tercer pase en carrera.","Donne la première passe et propose-toi aussitôt.|Laisse le ballon être remisé plus loin au lieu de te revenir.|Pars en profondeur et prends la troisième passe dans ta course."],"pass_onetwo":["Pass low to your partner.|Burst past the cone straight away.|Take the return pass at full stride.","Spiel deinen Partner flach an.|Starte sofort mit Tempo am Hütchen vorbei.|Nimm den Rückpass im vollen Lauf mit.","Pasa raso a tu compañero.|Arranca enseguida con velocidad superando el cono.|Recibe la devolución en plena carrera.","Passe à ras de terre à ton partenaire.|Démarre aussitôt à pleine vitesse en passant le plot.|Prends la remise en pleine course."],"pass_choice":["Set up two cone gates as targets.|Your partner shows or calls the target just before you pass.|Pass low into the right gate without hesitating.","Bau zwei Hütchentore als Ziele auf.|Dein Partner zeigt oder ruft das Ziel erst kurz vor deinem Pass.|Spiel flach und ohne Zögern ins richtige Tor.","Monta dos puertas de conos como objetivos.|Tu compañero señala o dice el objetivo justo antes de tu pase.|Pasa raso a la puerta correcta sin dudar.","Installe deux portes de plots comme cibles.|Ton partenaire montre ou annonce la cible juste avant ta passe.|Passe à ras de terre dans la bonne porte sans hésiter."],"pass_rondo":["Mark out a square, outside players stand on the sides.|Offer a new angle after every pass.|Play past the defender with few touches.","Markiert ein Quadrat, die Außenspieler stehen an den Seiten.|Biete dich nach jedem Pass seitlich neu an.|Spiel mit wenigen Kontakten am Verteidiger vorbei.","Marcad un cuadrado, los de fuera se colocan en los lados.|Ofrece una nueva línea de pase tras cada pase.|Supera al defensor con pocos toques.","Tracez un carré, les joueurs extérieurs se placent sur les côtés.|Propose un nouvel angle après chaque passe.|Joue en peu de touches pour éliminer le défenseur."],"pass_run":["Your partner sets off into the marked zone.|Watch his run, not his feet.|Play the ball into the space ahead of him so he doesn't have to slow down.","Dein Partner startet in die markierte Zone.|Schau auf seinen Laufweg, nicht auf seine Füße.|Spiel den Ball vor ihn in den Raum, sodass er nicht abbremsen muss.","Tu compañero arranca hacia la zona marcada.|Fíjate en su carrera, no en sus pies.|Pon el balón al espacio por delante para que no tenga que frenar.","Ton partenaire part vers la zone marquée.|Regarde sa course, pas ses pieds.|Mets le ballon dans l'espace devant lui pour qu'il n'ait pas à freiner."],"pass_press":["Your partner closes you down as soon as the ball is on its way.|Check before receiving where the cone gate is open.|Play the pass before the opponent reaches you.","Dein Partner läuft dich als Gegner an, sobald der Ball unterwegs ist.|Schau vor der Annahme, wo das Hütchentor frei ist.|Spiel den Pass, bevor der Gegner bei dir ist.","Tu compañero te presiona en cuanto el balón está en camino.|Mira antes de recibir dónde está libre la puerta de conos.|Da el pase antes de que el rival llegue.","Ton partenaire te presse dès que le ballon est en route.|Regarde avant le contrôle où la porte de plots est libre.|Donne la passe avant que l'adversaire n'arrive."],"pass_finish":["Play the one-two with your partner.|Run onto the return pass at speed.|Finish low with your first or second touch.","Spiel den Doppelpass mit deinem Partner.|Lauf mit Tempo in den Rückpass.|Schließ mit dem ersten oder zweiten Kontakt flach ab.","Haz la pared con tu compañero.|Ataca la devolución con velocidad.|Define raso con el primer o segundo toque.","Fais le une-deux avec ton partenaire.|Attaque la remise à pleine vitesse.|Conclus à ras de terre à la première ou deuxième touche."],"drib_slalom":["Put five cones in a line.|Guide the ball tightly round each cone with small touches.|Lift your head briefly between the cones.","Stell fünf Hütchen in eine Linie.|Führe den Ball mit kleinen Kontakten eng um jedes Hütchen.|Heb zwischen den Hütchen kurz den Kopf.","Coloca cinco conos en línea.|Conduce el balón pegado a cada cono con toques cortos.|Levanta un instante la cabeza entre los conos.","Aligne cinq plots.|Conduis le ballon serré autour de chaque plot par petites touches.|Lève brièvement la tête entre les plots."],"move_spot":["Approach the cone slowly with the ball.|Do the move clearly one metre before the cone.|Then explode past it with a big first touch.","Lauf mit Ball langsam auf das Hütchen zu.|Führe die Finte einen Meter vor dem Hütchen deutlich aus.|Geh danach mit einem großen ersten Kontakt explosiv vorbei.","Acércate despacio al cono con el balón.|Haz el regate con claridad un metro antes del cono.|Después sal explosivo con un primer toque largo.","Approche lentement du plot avec le ballon.|Fais la feinte nettement un mètre avant le plot.|Puis passe en explosant avec une grande première touche."],"move_cone":["Dribble at speed towards the cone.|Make the turn tight to the cone and shield the ball with your body.|Accelerate straight back to the start.","Dribble mit Tempo auf das Hütchen zu.|Führe die Drehung eng am Hütchen aus und schirme den Ball mit dem Körper ab.|Beschleunige sofort zurück zum Start.","Conduce con velocidad hacia el cono.|Haz el giro pegado al cono y protege el balón con el cuerpo.|Acelera enseguida de vuelta a la salida.","Conduis vite vers le plot.|Fais le demi-tour au ras du plot en protégeant le ballon avec ton corps.|Accélère aussitôt vers le départ."],"duel_live":["Run at your opponent with the ball inside the corridor.|Unbalance him with a feint.|Go past at speed and over the line.","Lauf mit Ball im Korridor auf deinen Gegner zu.|Bring ihn mit einer Finte aus dem Gleichgewicht.|Geh mit Tempo an ihm vorbei und über die Linie.","Encara a tu rival con el balón dentro del pasillo.|Desequilíbralo con una finta.|Supéralo con velocidad y cruza la línea.","Fonce balle au pied sur ton adversaire dans le couloir.|Déséquilibre-le avec une feinte.|Passe-le en vitesse et franchis la ligne."],"duel_gates":["Set up two exit gates left and right behind the opponent.|Attack one gate and make the opponent shift.|Change direction and dribble through the other gate.","Bau zwei Ausgangstore links und rechts hinter dem Gegner auf.|Greif ein Tor an und zwing den Gegner zum Verschieben.|Wechsle die Richtung und dribble durch das andere Tor.","Monta dos puertas de salida a izquierda y derecha detrás del rival.|Ataca una puerta y obliga al rival a bascular.|Cambia de dirección y sal conduciendo por la otra.","Installe deux portes de sortie à gauche et à droite derrière l'adversaire.|Attaque une porte et force l'adversaire à coulisser.|Change de direction et sors en dribble par l'autre."],"shield":["Stand side-on between opponent and ball.|Get low, feel the opponent with your arm and keep the ball on the far foot.|Turn away from his pressure and go at speed.","Stell dich seitlich zwischen Gegner und Ball.|Geh tief, spür den Gegner mit dem Arm und führ den Ball am ballfernen Fuß.|Dreh dich von seinem Druck weg und geh mit Tempo.","Colócate de lado entre el rival y el balón.|Baja el centro de gravedad, siente al rival con el brazo y lleva el balón con el pie alejado.|Gira hacia el lado contrario a su presión y sal con velocidad.","Place-toi de profil entre l'adversaire et le ballon.|Fléchis, sens l'adversaire avec ton bras et garde le ballon sur le pied éloigné.|Tourne à l'opposé de sa pression et pars en vitesse."],"duel_goal":["Run with the ball at the cone in front of goal.|Do the feint and push the ball to the side.|Finish low into the corner with your next touch.","Lauf mit Ball auf das Hütchen vor dem Tor zu.|Führe die Finte aus und leg dir den Ball seitlich vor.|Schließ mit dem nächsten Kontakt flach ins Eck ab.","Encara con el balón el cono situado delante de la portería.|Haz la finta y adelántate el balón hacia un lado.|Define raso a la esquina con el siguiente toque.","Fonce balle au pied sur le plot devant le but.|Fais la feinte et pousse le ballon sur le côté.|Conclus à ras de terre dans le coin à la touche suivante."],"duel_two":["Two opponents stand staggered ahead of you, the target zone lies behind.|Attack the first and drag him away from the second.|Go through the gap and carry the ball into the target zone.","Zwei Gegner stehen versetzt vor dir, dahinter liegt die Zielzone.|Greif den ersten an und zieh ihn vom zweiten weg.|Geh durch die Lücke und bring den Ball in die Zielzone.","Dos rivales se colocan escalonados delante de ti, detrás está la zona objetivo.|Ataca al primero y aléjalo del segundo.|Pasa por el hueco y lleva el balón a la zona objetivo.","Deux adversaires sont décalés devant toi, la zone cible est derrière.|Attaque le premier et éloigne-le du second.|Passe dans l'intervalle et amène le ballon dans la zone cible."],"shot_place":["Put the ball twelve metres from goal.|Plant your standing foot beside the ball, toes pointing at the target.|Pass the ball low inside the post with the inside of your foot.","Leg den Ball zwölf Meter vor das Tor.|Setz den Standfuß neben den Ball und zeig mit der Fußspitze zum Ziel.|Schieb den Ball mit der Innenseite flach neben den Pfosten.","Coloca el balón a doce metros de la portería.|Apoya el pie junto al balón con la punta hacia el objetivo.|Empuja el balón raso junto al poste con el interior.","Pose le ballon à douze mètres du but.|Pose le pied d'appui à côté du ballon, pointe vers la cible.|Place le ballon à ras de terre près du poteau de l'intérieur du pied."],"shot_touch":["Start with the ball to the side of the cone.|Push the ball past the cone into your stride with one touch.|Shoot with the next touch, chest over the ball.","Starte mit Ball seitlich vom Hütchen.|Leg dir den Ball mit einem Kontakt am Hütchen vorbei in den Lauf.|Schieß mit dem nächsten Kontakt, Oberkörper über dem Ball.","Sal con el balón a un lado del cono.|Adelántate el balón con un toque superando el cono.|Dispara con el siguiente toque, el pecho sobre el balón.","Pars avec le ballon à côté du plot.|Pousse le ballon dans ta course en une touche en passant le plot.|Tire à la touche suivante, buste au-dessus du ballon."],"shot_turn":["Stand with your back to goal and feed yourself the ball.|Receive side-on and turn towards goal in one movement.|Shoot low into the corner straight after the turn.","Stell dich mit dem Rücken zum Tor und spiel dir den Ball an.|Nimm ihn seitlich an und dreh dich in einer Bewegung zum Tor.|Schieß sofort nach der Drehung flach ins Eck.","Colócate de espaldas a la portería y juégate el balón.|Recibe de lado y gira hacia la portería en un solo movimiento.|Dispara raso a la esquina nada más girar.","Place-toi dos au but et sers-toi le ballon.|Contrôle de profil et tourne-toi vers le but dans le même mouvement.|Tire à ras de terre dans le coin juste après le demi-tour."],"shot_sprint":["Put the ball in front of goal and go to the start cone.|Sprint to the ball at full speed.|Shorten your last steps and shoot under control into the corner.","Leg den Ball vor das Tor und geh zum Starthütchen.|Sprinte mit voller Geschwindigkeit zum Ball.|Mach die letzten Schritte kurz und schieß kontrolliert ins Eck.","Coloca el balón delante de la portería y ve al cono de salida.|Esprinta hacia el balón a toda velocidad.|Acorta los últimos pasos y dispara con control a la esquina.","Pose le ballon devant le but et va au plot de départ.|Sprinte vers le ballon à pleine vitesse.|Raccourcis les derniers appuis et tire en contrôle dans le coin."],"shot_first":["Your partner drives the ball in front of goal.|Run towards the ball and keep your eyes on it.|Finish first time with one touch, ankle locked.","Dein Partner spielt den Ball scharf vor das Tor.|Lauf dem Ball entgegen und fixiere ihn mit den Augen.|Schließ direkt mit einem Kontakt ab, Fußgelenk fest.","Tu compañero mete el balón fuerte delante de la portería.|Ataca el balón sin perderlo de vista.|Remata de primeras con un toque, tobillo firme.","Ton partenaire envoie le ballon fort devant le but.|Va vers le ballon sans le quitter des yeux.|Conclus en une touche, cheville verrouillée."],"shot_press":["Your partner starts two metres behind you as the chaser.|Drive the ball towards goal at speed, body between ball and opponent.|Finish before he catches you.","Dein Partner startet zwei Meter hinter dir als Verfolger.|Führe den Ball mit Tempo Richtung Tor und halte den Körper zwischen Ball und Gegner.|Schließ ab, bevor er dich erreicht.","Tu compañero sale dos metros detrás de ti como perseguidor.|Conduce con velocidad hacia la portería, el cuerpo entre el balón y el rival.|Define antes de que te alcance.","Ton partenaire part deux mètres derrière toi comme poursuivant.|Conduis vite vers le but, le corps entre le ballon et l'adversaire.|Conclus avant qu'il ne te rattrape."],"shot_mini":["Place two mini goals apart from each other.|Glance at the goal you want to hit before shooting.|Pass the ball low and precisely into it.","Stell zwei Minitore mit Abstand nebeneinander auf.|Schau vor dem Schuss kurz auf das Tor, das du treffen willst.|Schieb den Ball flach und genau hinein.","Coloca dos miniporterías separadas entre sí.|Mira un instante la portería que quieres acertar antes de disparar.|Empuja el balón raso y preciso dentro.","Place deux mini-buts espacés.|Jette un œil au but que tu vises avant de tirer.|Place le ballon à ras de terre, avec précision."],"run_easy":["Set off easily, at a pace where you can still speak full sentences.|Keep the pace even and breathe calmly.|Walk the final minute.","Lauf locker los, so dass du noch ganze Sätze sprechen kannst.|Halte das Tempo gleichmäßig und atme ruhig.|Geh die letzte Minute locker aus.","Empieza suave, a un ritmo al que aún puedas decir frases completas.|Mantén el ritmo constante y respira tranquilo.|Camina el último minuto.","Pars tranquillement, à une allure où tu peux encore faire des phrases.|Garde une allure régulière et respire calmement.|Marche la dernière minute."],"run_int":["Run the work phase briskly but not at a sprint.|Use the break to walk or jog easily.|Keep the same pace from the first to the last rep.","Lauf die Belastung zügig, aber nicht im Sprint.|Nutze die Pause zum Gehen oder lockeren Traben.|Halte das Tempo vom ersten bis zum letzten Durchgang gleich.","Corre la fase de esfuerzo ágil, pero sin esprintar.|Usa la pausa para caminar o trotar suave.|Mantén el mismo ritmo de la primera a la última repetición.","Cours la phase d'effort à bon rythme, sans sprinter.|Utilise la pause pour marcher ou trottiner.|Garde la même allure de la première à la dernière répétition."],"run_rep":["Mark the distance with two cones.|Run the distance at high speed and walk back easily.|Start the next run as soon as you are back at the start.","Markiere die Strecke mit zwei Hütchen.|Lauf die Strecke mit hohem Tempo und geh locker zurück.|Starte den nächsten Lauf, sobald du wieder am Start bist.","Marca la distancia con dos conos.|Corre la distancia a ritmo alto y vuelve andando.|Empieza la siguiente carrera en cuanto llegues a la salida.","Marque la distance avec deux plots.|Cours la distance à haute vitesse et reviens en marchant.|Lance la course suivante dès ton retour au départ."],"run_ball":["Set out the cones for the course and take the ball.|In the work phase dribble at speed with tight touches.|In the break keep jogging easily with the ball at your feet.","Stell die Hütchen für die Strecke auf und nimm den Ball mit.|Dribble in der Belastung mit Tempo und engen Kontakten.|Trabe in der Pause mit Ball am Fuß locker weiter.","Coloca los conos del recorrido y lleva el balón.|En la fase de esfuerzo conduce con velocidad y toques cortos.|En la pausa sigue trotando suave con el balón.","Place les plots du parcours et prends le ballon.|Dans la phase d'effort, conduis vite avec des touches serrées.|Pendant la pause, continue à trottiner balle au pied."],"run_tech":["First run the distance at high speed.|Go straight to the ball and do the technical task cleanly.|Jog easily back to the start and repeat.","Lauf zuerst die Strecke mit hohem Tempo.|Geh direkt danach an den Ball und führe die Technikaufgabe sauber aus.|Trabe locker zum Start zurück und wiederhole.","Primero corre la distancia a ritmo alto.|Ve directo al balón y haz la tarea técnica con limpieza.|Vuelve trotando suave a la salida y repite.","Cours d'abord la distance à haute vitesse.|Va directement au ballon et réalise proprement la tâche technique.|Reviens en trottinant au départ et recommence."],"run_game":["Mark out a small pitch and play at full intensity.|Stay active in every phase: offer, chase, switch.|Recover by walking in the break, then the next phase.","Markiert ein kleines Feld und spielt mit voller Intensität.|Bleib in jeder Phase aktiv: anbieten, nachsetzen, umschalten.|Erholt euch in der Pause im Gehen, dann die nächste Phase.","Marcad un campo pequeño y jugad a máxima intensidad.|Mantente activo en cada fase: ofrécete, presiona, transita.|Recuperad caminando en la pausa y a por la siguiente fase.","Tracez un petit terrain et jouez à pleine intensité.|Reste actif à chaque phase : propose-toi, presse, bascule.|Récupérez en marchant pendant la pause, puis phase suivante."],"sprint_lin":["Mark the start and finish.|Start from a split stance and drive off with short, powerful steps.|Sprint through the finish and walk back easily.","Markiere Start und Ziel.|Starte aus der Schrittstellung und drück dich mit kurzen, kräftigen Schritten ab.|Sprinte durch das Ziel hindurch und geh locker zurück.","Marca la salida y la meta.|Sal con un pie adelantado y empuja con pasos cortos y potentes.|Esprinta más allá de la meta y vuelve andando.","Marque le départ et l'arrivée.|Pars en fente et pousse avec des appuis courts et puissants.|Sprinte au-delà de l'arrivée et reviens en marchant."],"sprint_react":["Stand ready at the start line.|Wait for the signal and react as fast as you can.|Sprint at full speed through the finish.","Stell dich sprungbereit an die Startlinie.|Warte auf das Signal und reagiere so schnell wie möglich.|Sprinte mit vollem Tempo durch das Ziel.","Colócate listo en la línea de salida.|Espera la señal y reacciona lo más rápido posible.|Esprinta a toda velocidad más allá de la meta.","Tiens-toi prêt sur la ligne de départ.|Attends le signal et réagis le plus vite possible.|Sprinte à pleine vitesse au-delà de l'arrivée."],"sprint_turn":["Take up the starting position the drill asks for.|Turn into the running direction with a low first step.|Accelerate fully through the finish.","Nimm die Startposition ein, die der Drill vorgibt.|Dreh dich mit einem tiefen ersten Schritt in Laufrichtung.|Beschleunige voll bis durch das Ziel.","Adopta la posición de salida que pide el ejercicio.|Gira hacia la dirección de carrera con un primer paso bajo.|Acelera al máximo hasta superar la meta.","Prends la position de départ demandée.|Tourne-toi dans le sens de la course avec un premier appui bas.|Accélère à fond jusqu'au-delà de l'arrivée."],"sprint_brake":["Mark a two-metre braking zone at the end of the distance.|Accelerate fully up to the zone.|Brake with short steps and a low centre of gravity until you stand stable.","Markiere eine Bremszone von zwei Metern am Ende der Strecke.|Beschleunige voll bis zur Zone.|Brems mit kurzen Schritten und tiefem Schwerpunkt, bis du stabil stehst.","Marca una zona de frenada de dos metros al final de la distancia.|Acelera al máximo hasta la zona.|Frena con pasos cortos y el centro de gravedad bajo hasta quedar estable.","Marque une zone de freinage de deux mètres au bout de la distance.|Accélère à fond jusqu'à la zone.|Freine par petits appuis, centre de gravité bas, jusqu'à être stable."],"sprint_cod":["Build a Y with cones.|Sprint to the middle cone and watch for the signal.|Plant the outside foot and sprint to the side that is called.","Bau mit Hütchen ein Y auf.|Sprinte bis zum mittleren Hütchen und achte auf das Signal.|Setz den Außenfuß und sprinte zur angesagten Seite.","Monta una Y con conos.|Esprinta hasta el cono central y atiende a la señal.|Apoya el pie exterior y esprinta hacia el lado indicado.","Forme un Y avec des plots.|Sprinte jusqu'au plot central et guette le signal.|Pose le pied extérieur et sprinte du côté annoncé."],"sprint_duel":["Stand next to your partner on the start line.|Both start on a shared signal.|Whoever reaches the finish first takes the action on the ball.","Stell dich neben deinen Partner an die Startlinie.|Startet auf ein gemeinsames Signal.|Wer zuerst am Ziel ist, übernimmt die Aktion am Ball.","Colócate junto a tu compañero en la línea de salida.|Salid a la vez con una señal común.|Quien llegue primero realiza la acción con el balón.","Place-toi à côté de ton partenaire sur la ligne de départ.|Partez ensemble sur un signal commun.|Le premier arrivé réalise l'action avec le ballon."],"sprint_ball":["Start with or right after the ball action the drill asks for.|Accelerate fully and keep the ball ahead of you with long touches.|End the sprint with a clean action on the ball.","Starte mit oder direkt nach der Ballaktion, die der Drill vorgibt.|Beschleunige voll und halte den Ball mit langen Kontakten vor dir.|Beende den Sprint mit einer sauberen Aktion am Ball.","Sal con la acción de balón que pide el ejercicio o justo después.|Acelera al máximo y lleva el balón por delante con toques largos.|Termina el esprint con una acción limpia con el balón.","Pars avec l'action de balle demandée ou juste après.|Accélère à fond et garde le ballon devant toi par de longues touches.|Termine le sprint par une action propre avec le ballon."],"cross_stand":["Place the ball on the wing and mark the target zone in front of goal.|Glance at the zone, standing foot beside the ball.|Strike below the middle of the ball and follow through towards the zone.","Leg den Ball am Flügel ab und markiere die Zielzone vor dem Tor.|Schau kurz in die Zone, Standfuß neben den Ball.|Triff den Ball unterhalb der Mitte und schwing in Richtung Zone durch.","Coloca el balón en la banda y marca la zona objetivo delante de la portería.|Mira un instante la zona, pie de apoyo junto al balón.|Golpea por debajo del centro del balón y acompaña hacia la zona.","Pose le ballon sur l'aile et marque la zone cible devant le but.|Jette un œil à la zone, pied d'appui à côté du ballon.|Frappe sous le centre du ballon et accompagne vers la zone."],"cross_low":["Place the ball on the wing and mark the target zone.|Plant the standing foot beside the ball, chest over it.|Drive the ball low and hard into the zone with the inside of your foot.","Leg den Ball am Flügel ab und markiere die Zielzone.|Setz den Standfuß neben den Ball, Oberkörper über dem Ball.|Spiel den Ball mit der Innenseite flach und scharf in die Zone.","Coloca el balón en la banda y marca la zona objetivo.|Apoya el pie junto al balón, el pecho encima.|Mete el balón raso y fuerte en la zona con el interior.","Pose le ballon sur l'aile et marque la zone cible.|Pose le pied d'appui à côté du ballon, buste au-dessus.|Envoie le ballon à ras de terre et fort dans la zone, de l'intérieur du pied."],"cross_run":["Carry the ball down the wing at speed.|Push it slightly diagonally ahead with your last touch.|Cross on the run into the target zone without stopping.","Führe den Ball mit Tempo den Flügel entlang.|Leg ihn dir mit dem letzten Kontakt leicht schräg nach vorn.|Flanke aus dem Lauf in die Zielzone, ohne abzustoppen.","Conduce el balón por la banda con velocidad.|Adelántatelo ligeramente en diagonal con el último toque.|Centra en carrera a la zona objetivo sin frenar.","Conduis le ballon le long de l'aile à pleine vitesse.|Pousse-le légèrement en diagonale à la dernière touche.|Centre dans la course vers la zone cible, sans t'arrêter."],"cross_cut":["Dribble at speed to just short of the byline.|Lift your head and find the zone around the penalty spot.|Cut the ball back low into the space behind.","Dribble mit Tempo bis kurz vor die Grundlinie.|Heb den Kopf und suche die Zone am Elfmeterpunkt.|Spiel den Ball flach zurück in den Rückraum.","Conduce con velocidad hasta casi la línea de fondo.|Levanta la cabeza y busca la zona del punto de penalti.|Da el pase atrás raso.","Dribble à pleine vitesse jusqu'à la ligne de but.|Lève la tête et cherche la zone du point de penalty.|Remets le ballon en retrait, à ras de terre."],"cross_in":["Start with the ball on the touchline.|Cut inside with two touches or change direction briefly.|Whip the cross into the target zone in front of goal.","Starte mit Ball an der Seitenlinie.|Zieh mit zwei Kontakten nach innen oder wechsle kurz die Richtung.|Flanke mit Schnitt in die Zielzone vor dem Tor.","Sal con el balón en la línea de banda.|Recorta hacia dentro con dos toques o cambia brevemente de dirección.|Centra con rosca a la zona objetivo delante de la portería.","Pars avec le ballon sur la ligne de touche.|Rentre intérieur en deux touches ou change brièvement de direction.|Centre brossé dans la zone cible devant le but."],"cross_combo":["Play the ball inside to your partner.|Run round the outside of him at speed.|Take the pass in your stride and cross into the target zone.","Spiel deinen Partner innen an.|Lauf außen mit Tempo an ihm vorbei.|Nimm den Pass in den Lauf mit und flanke in die Zielzone.","Juega el balón por dentro a tu compañero.|Dóblalo por fuera con velocidad.|Recibe el pase en carrera y centra a la zona objetivo.","Joue le ballon à l'intérieur vers ton partenaire.|Dédouble-le par l'extérieur à pleine vitesse.|Prends la passe dans ta course et centre dans la zone cible."],"cross_target":["Your partner runs into the box as the target player.|Glance at his run before you cross.|Cross into his path, not to where he is standing now.","Dein Partner läuft als Zielspieler in den Strafraum ein.|Schau vor der Flanke kurz auf seinen Laufweg.|Flanke vor ihn in den Lauf, nicht dorthin, wo er gerade steht.","Tu compañero entra al área como rematador.|Mira un instante su carrera antes de centrar.|Centra a su trayectoria, no adonde está ahora.","Ton partenaire entre dans la surface comme joueur cible.|Jette un œil à sa course avant de centrer.|Centre dans sa course, pas là où il se trouve."],"cross_duel":["Your partner defends you on the wing.|Create half a metre of space with a feint or change of pace.|Cross at once, before he can block the ball.","Dein Partner stellt dich als Verteidiger am Flügel.|Schaff dir mit einer Finte oder einem Tempowechsel einen halben Meter Platz.|Flanke sofort, bevor er den Ball blocken kann.","Tu compañero te defiende en la banda.|Gánate medio metro con una finta o un cambio de ritmo.|Centra enseguida, antes de que pueda bloquear el balón.","Ton partenaire te défend sur l'aile.|Crée-toi un demi-mètre avec une feinte ou un changement de rythme.|Centre aussitôt, avant qu'il ne puisse contrer."],"s_squat":["Stand shoulder-width apart, toes slightly out.|Push your hips back and go down, knees tracking over your toes.|Drive back up through the whole foot.","Stell dich schulterbreit hin, Fußspitzen leicht nach außen.|Schieb die Hüfte nach hinten und geh tief, die Knie zeigen über die Fußspitzen.|Drück dich über den ganzen Fuß wieder nach oben.","Colócate con los pies a la anchura de los hombros, puntas algo hacia fuera.|Lleva la cadera atrás y baja, las rodillas en línea con las puntas.|Sube empujando con todo el pie.","Pieds écartés à la largeur des épaules, pointes légèrement ouvertes.|Recule les hanches et descends, genoux dans l'axe des pointes.|Remonte en poussant sur tout le pied."],"s_lunge":["Stand tall, core tight.|Take a big step and lower the back knee to just above the floor.|Push back to standing under control and switch sides.","Steh aufrecht, Rumpf fest.|Mach einen großen Schritt und senk das hintere Knie bis knapp über den Boden.|Drück dich kontrolliert zurück in den Stand und wechsle die Seite.","De pie y erguido, abdomen firme.|Da un paso amplio y baja la rodilla trasera hasta casi tocar el suelo.|Vuelve con control a la posición inicial y cambia de lado.","Debout, bien droit, tronc gainé.|Fais un grand pas et descends le genou arrière juste au-dessus du sol.|Reviens debout en contrôle et change de côté."],"s_split":["Rest the back foot on a bench or stay in a split stance.|Lower straight down, weight on the front foot.|Push back up without swinging your upper body.","Leg den hinteren Fuß auf eine Bank oder bleib in der Schrittstellung.|Senk dich gerade nach unten, das Gewicht bleibt auf dem vorderen Fuß.|Drück dich nach oben, ohne mit dem Oberkörper zu schwingen.","Apoya el pie trasero en un banco o quédate en posición de zancada.|Baja recto, con el peso en el pie delantero.|Sube sin balancear el tronco.","Pose le pied arrière sur un banc ou reste en position de fente.|Descends à la verticale, le poids sur le pied avant.|Remonte sans balancer le buste."],"s_single":["Stand on one leg in front of a bench or box.|Sit back slowly until you lightly touch the surface.|Stand up on the same leg, knee staying over the foot.","Stell dich auf ein Bein vor eine Bank oder Box.|Setz dich langsam zurück, bis du die Fläche leicht berührst.|Steh auf demselben Bein wieder auf, das Knie bleibt über dem Fuß.","Colócate sobre una pierna delante de un banco o cajón.|Siéntate despacio hacia atrás hasta rozar la superficie.|Levántate con la misma pierna, la rodilla sobre el pie.","Tiens-toi sur une jambe devant un banc ou une box.|Assieds-toi lentement jusqu'à effleurer la surface.|Relève-toi sur la même jambe, genou au-dessus du pied."],"s_stepup":["Place one whole foot on the bench or box.|Push up through that leg only until you stand tall.|Lower slowly and set the other foot down quietly.","Stell einen Fuß ganz auf die Bank oder Box.|Drück dich nur über dieses Bein nach oben, bis du gestreckt stehst.|Senk dich langsam wieder ab und setz den anderen Fuß leise auf.","Apoya un pie completo en el banco o cajón.|Sube empujando solo con esa pierna hasta quedar estirado.|Baja despacio y apoya el otro pie sin ruido.","Pose un pied entier sur le banc ou la box.|Monte en poussant uniquement sur cette jambe jusqu'à être tendu.|Redescends lentement et pose l'autre pied sans bruit."],"s_calf":["Stand tall, one hand on a wall if needed.|Push up onto the balls of your feet and hold briefly at the top.|Lower your heels slowly.","Stell dich aufrecht hin, bei Bedarf mit einer Hand an der Wand.|Drück dich hoch auf die Fußballen und halte kurz oben.|Senk die Fersen langsam wieder ab.","De pie y erguido, con una mano en la pared si hace falta.|Sube sobre las puntas de los pies y aguanta un instante arriba.|Baja los talones despacio.","Tiens-toi droit, une main au mur si besoin.|Monte sur la pointe des pieds et tiens un instant en haut.|Redescends lentement les talons."],"s_plank":["Support yourself on your forearms, elbows under shoulders.|Tighten abs and glutes so your body forms a line.|Keep breathing calmly and don't let your hips sag.","Stütz dich auf die Unterarme, Ellbogen unter den Schultern.|Spann Bauch und Gesäß an, der Körper bildet eine Linie.|Atme ruhig weiter und lass die Hüfte nicht durchhängen.","Apóyate en los antebrazos, codos bajo los hombros.|Aprieta abdomen y glúteos, el cuerpo forma una línea.|Respira tranquilo y no dejes caer la cadera.","Appuie-toi sur les avant-bras, coudes sous les épaules.|Contracte abdos et fessiers, le corps forme une ligne.|Respire calmement et ne laisse pas le bassin s'affaisser."],"s_side":["Lie on your side, elbow under the shoulder.|Lift your hips until head, hips and feet form a line.|Hold steady, then switch sides.","Leg dich auf die Seite, Ellbogen unter der Schulter.|Heb die Hüfte, bis Kopf, Hüfte und Füße eine Linie bilden.|Halte die Position ruhig und wechsle danach die Seite.","Túmbate de lado, el codo bajo el hombro.|Eleva la cadera hasta alinear cabeza, cadera y pies.|Mantén la posición estable y luego cambia de lado.","Allonge-toi sur le côté, coude sous l'épaule.|Soulève le bassin jusqu'à aligner tête, bassin et pieds.|Tiens la position sans bouger, puis change de côté."],"s_cope":["Lie on your side and rest the top leg on a bench.|Lift your hips and bring the bottom leg up to the bench.|Hold the line and lower slowly.","Leg dich seitlich hin und leg das obere Bein auf eine Bank.|Heb die Hüfte und zieh das untere Bein an die Bank heran.|Halte die Linie und senk dich langsam wieder ab.","Túmbate de lado y apoya la pierna de arriba en un banco.|Eleva la cadera y sube la pierna de abajo hacia el banco.|Mantén la línea y baja despacio.","Allonge-toi sur le côté et pose la jambe du dessus sur un banc.|Soulève le bassin et ramène la jambe du dessous vers le banc.|Garde l'alignement et redescends lentement."],"s_bird":["Get on all fours, hands under shoulders, knees under hips.|Reach one arm and the opposite leg out long.|Hold for two seconds without arching your back, then switch sides.","Geh in den Vierfüßlerstand, Hände unter den Schultern, Knie unter der Hüfte.|Streck einen Arm und das gegenüberliegende Bein lang aus.|Halte zwei Sekunden ohne Hohlkreuz und wechsle die Seite.","Ponte a cuatro patas, manos bajo los hombros y rodillas bajo la cadera.|Estira un brazo y la pierna contraria.|Aguanta dos segundos sin arquear la espalda y cambia de lado.","Mets-toi à quatre pattes, mains sous les épaules, genoux sous les hanches.|Tends un bras et la jambe opposée.|Tiens deux secondes sans creuser le dos, puis change de côté."],"s_balance":["Stand on one leg, knee slightly bent.|Keep hips and shoulders level and fix your eyes on a point ahead.|Stand still, then switch legs.","Stell dich auf ein Bein, das Knie leicht gebeugt.|Halte Hüfte und Schultern gerade und fixiere einen Punkt vor dir.|Bleib ruhig stehen und wechsle danach das Bein.","Colócate sobre una pierna, la rodilla algo flexionada.|Mantén cadera y hombros rectos y fija la vista en un punto.|Quédate quieto y después cambia de pierna.","Tiens-toi sur une jambe, genou légèrement fléchi.|Garde hanches et épaules droites et fixe un point devant toi.|Reste immobile, puis change de jambe."],"s_push":["Support yourself on your hands, slightly wider than shoulders, body in a line.|Lower your chest to just above the floor, elbows about 45 degrees from the body.|Push up powerfully without letting your hips drop.","Stütz dich auf die Hände, etwas weiter als schulterbreit, Körper in einer Linie.|Senk die Brust bis knapp über den Boden, Ellbogen etwa 45 Grad vom Körper.|Drück dich kraftvoll nach oben, ohne die Hüfte hängen zu lassen.","Apóyate en las manos, algo más abiertas que los hombros, cuerpo en línea.|Baja el pecho hasta casi tocar el suelo, codos a unos 45 grados del cuerpo.|Empuja con fuerza hacia arriba sin dejar caer la cadera.","Appuie-toi sur les mains, un peu plus larges que les épaules, corps aligné.|Descends la poitrine juste au-dessus du sol, coudes à environ 45 degrés du corps.|Repousse avec force sans laisser tomber le bassin."],"s_tap":["Get into a push-up position, feet a little wider than hips.|Do a push-up and at the top tap the opposite shoulder with one hand.|Keep your hips still and alternate hands.","Geh in den Liegestütz, Füße etwas breiter als die Hüfte.|Mach einen Liegestütz und tippe oben mit einer Hand an die andere Schulter.|Halte die Hüfte dabei ruhig und wechsle die Hand.","Colócate en posición de flexión, pies algo más abiertos que la cadera.|Haz una flexión y arriba toca el hombro contrario con una mano.|Mantén la cadera quieta y alterna las manos.","Mets-toi en position de pompe, pieds un peu plus larges que le bassin.|Fais une pompe et, en haut, touche l'épaule opposée d'une main.|Garde le bassin immobile et alterne les mains."],"s_row":["Fix the band at chest height and hold both ends.|Pull your elbows back close to the body and squeeze your shoulder blades.|Let your arms return forward slowly.","Befestige das Band auf Brusthöhe und nimm beide Enden.|Zieh die Ellbogen eng am Körper nach hinten und die Schulterblätter zusammen.|Führ die Arme langsam wieder nach vorn.","Fija la banda a la altura del pecho y coge ambos extremos.|Lleva los codos atrás pegados al cuerpo y junta los omóplatos.|Vuelve con los brazos despacio hacia delante.","Fixe la bande à hauteur de poitrine et saisis les deux extrémités.|Tire les coudes en arrière, près du corps, en serrant les omoplates.|Ramène lentement les bras vers l'avant."],"s_rowdb":["Hinge forward at the hips with a flat back, dumbbells hanging under your shoulders.|Pull the dumbbells to your hips, elbows close to the body.|Lower them slowly, core tight.","Beug dich mit geradem Rücken aus der Hüfte vor, Hanteln hängen unter den Schultern.|Zieh die Hanteln zur Hüfte, die Ellbogen bleiben nah am Körper.|Senk sie langsam ab, der Rumpf bleibt fest.","Inclínate desde la cadera con la espalda recta, mancuernas colgando bajo los hombros.|Lleva las mancuernas a la cadera, codos pegados al cuerpo.|Bájalas despacio, con el tronco firme.","Penche-toi depuis les hanches, dos plat, haltères sous les épaules.|Tire les haltères vers les hanches, coudes près du corps.|Redescends lentement, tronc gainé."],"s_bridge":["Lie on your back, feet hip-width apart on the floor.|Drive your hips up through the heels until knees, hips and shoulders form a line.|Hold briefly at the top and lower slowly.","Leg dich auf den Rücken, Füße hüftbreit aufgestellt.|Drück die Hüfte über die Fersen nach oben, bis Knie, Hüfte und Schultern eine Linie bilden.|Halte kurz oben und senk langsam ab.","Túmbate boca arriba, pies apoyados a la anchura de la cadera.|Eleva la cadera empujando con los talones hasta alinear rodillas, cadera y hombros.|Aguanta un instante arriba y baja despacio.","Allonge-toi sur le dos, pieds à plat à la largeur du bassin.|Monte le bassin en poussant sur les talons jusqu'à aligner genoux, bassin et épaules.|Tiens un instant en haut et redescends lentement."],"s_deadbug":["Lie on your back, arms to the ceiling, knees over hips.|Slowly extend one arm and the opposite leg.|Keep your lower back on the floor, then switch sides.","Leg dich auf den Rücken, Arme zur Decke, Knie über der Hüfte.|Streck einen Arm und das gegenüberliegende Bein langsam aus.|Der untere Rücken bleibt am Boden, dann Seitenwechsel.","Túmbate boca arriba, brazos hacia el techo y rodillas sobre la cadera.|Estira despacio un brazo y la pierna contraria.|La zona lumbar sigue pegada al suelo, luego cambia de lado.","Allonge-toi sur le dos, bras vers le plafond, genoux au-dessus des hanches.|Tends lentement un bras et la jambe opposée.|Le bas du dos reste au sol, puis change de côté."],"s_pallof":["Fix the band to your side at chest height and hold it with both hands at your chest.|Press your hands straight out without letting your torso rotate.|Hold for two seconds and bring your hands back slowly.","Befestige das Band seitlich auf Brusthöhe und halte es mit beiden Händen vor der Brust.|Drück die Hände gerade nach vorn, ohne dass der Oberkörper mitdreht.|Halte zwei Sekunden und hol die Hände langsam zurück.","Fija la banda a un lado a la altura del pecho y sujétala con ambas manos delante.|Empuja las manos rectas hacia delante sin que gire el tronco.|Aguanta dos segundos y vuelve despacio.","Fixe la bande sur le côté à hauteur de poitrine et tiens-la à deux mains devant toi.|Pousse les mains droit devant sans laisser tourner le buste.|Tiens deux secondes et ramène lentement les mains."],"s_band":["Put the mini band round your knees or ankles and sink into a slight squat.|Take small steps against the resistance, knees pushed out.|Keep tension in the band the whole time.","Leg das Miniband um die Knie oder Knöchel und geh leicht in die Hocke.|Mach kleine Schritte gegen den Widerstand, die Knie bleiben außen.|Halte die Spannung im Band die ganze Zeit.","Coloca la minibanda en rodillas o tobillos y baja a una media sentadilla.|Da pasos cortos contra la resistencia, las rodillas hacia fuera.|Mantén la tensión en la banda todo el tiempo.","Place le mini-élastique autour des genoux ou des chevilles et fléchis légèrement.|Fais de petits pas contre la résistance, genoux vers l'extérieur.|Garde l'élastique tendu en permanence."],"s_rdl1":["Stand on one leg, knee slightly bent.|Tip your torso forward with a flat back while the free leg goes back.|Come back up using your glutes.","Stell dich auf ein Bein, das Knie leicht gebeugt.|Kipp den Oberkörper mit geradem Rücken nach vorn, das freie Bein geht nach hinten.|Richte dich über das Gesäß wieder auf.","Colócate sobre una pierna, la rodilla algo flexionada.|Inclina el tronco con la espalda recta mientras la pierna libre va hacia atrás.|Vuelve a subir usando el glúteo.","Tiens-toi sur une jambe, genou légèrement fléchi.|Bascule le buste vers l'avant, dos plat, la jambe libre part en arrière.|Redresse-toi grâce aux fessiers."],"s_rdl":["Hold the weight in front of your thighs, knees slightly bent.|Push your hips back and lower the weight close to your legs.|Stand up using glutes and hamstrings, back flat.","Halte das Gewicht vor den Oberschenkeln, Knie leicht gebeugt.|Schieb die Hüfte nach hinten und führ das Gewicht eng an den Beinen nach unten.|Richte dich über Gesäß und Beinrückseite auf, der Rücken bleibt gerade.","Sujeta el peso delante de los muslos, rodillas algo flexionadas.|Lleva la cadera atrás y baja el peso pegado a las piernas.|Sube usando glúteos e isquiotibiales, la espalda recta.","Tiens la charge devant les cuisses, genoux légèrement fléchis.|Recule les hanches et descends la charge le long des jambes.|Redresse-toi grâce aux fessiers et aux ischios, dos plat."],"s_jump":["Sink into a half squat and swing your arms back.|Jump up explosively.|Land quietly on the whole foot, knees over toes, and hold briefly.","Geh in die halbe Hocke und schwing die Arme nach hinten.|Spring explosiv nach oben.|Lande leise auf dem ganzen Fuß, Knie über den Fußspitzen, und halte kurz.","Baja a media sentadilla y lleva los brazos atrás.|Salta hacia arriba de forma explosiva.|Aterriza sin ruido con todo el pie, rodillas sobre las puntas, y aguanta un instante.","Descends en demi-squat et lance les bras en arrière.|Saute vers le haut de façon explosive.|Atterris sans bruit sur tout le pied, genoux au-dessus des pointes, et tiens un instant."],"s_skater":["Stand on one leg, slightly bent.|Jump sideways and land on the other leg.|Absorb the landing softly, hold for a second and jump back.","Stell dich auf ein Bein, leicht gebeugt.|Spring seitlich ab und lande auf dem anderen Bein.|Fang die Landung weich ab, halte eine Sekunde und spring zurück.","Colócate sobre una pierna, algo flexionada.|Salta hacia un lado y aterriza sobre la otra pierna.|Amortigua la caída, aguanta un segundo y vuelve a saltar.","Tiens-toi sur une jambe, légèrement fléchie.|Saute sur le côté et atterris sur l'autre jambe.|Amortis la réception, tiens une seconde et resaute."],"s_ham":["Lie on your back, heels on the gym ball, hips lifted.|Curl the ball towards your glutes with your heels, hips staying up.|Roll the ball away again slowly.","Leg dich auf den Rücken, Fersen auf dem Gymnastikball, Hüfte angehoben.|Zieh den Ball mit den Fersen zum Gesäß, die Hüfte bleibt oben.|Roll den Ball langsam wieder weg.","Túmbate boca arriba, talones sobre el fitball y cadera elevada.|Acerca el balón a los glúteos con los talones, la cadera sigue arriba.|Aleja el balón de nuevo despacio.","Allonge-toi sur le dos, talons sur le ballon de gym, bassin levé.|Ramène le ballon vers les fessiers avec les talons, bassin toujours haut.|Fais repartir lentement le ballon."],"s_nordic":["Kneel on a soft surface while your partner holds your heels.|Lower yourself forward as slowly as you can with your hips extended.|Catch yourself with your hands and push back up.","Knie dich auf eine weiche Unterlage, dein Partner hält deine Fersen fest.|Lass dich mit gestreckter Hüfte so langsam wie möglich nach vorn sinken.|Fang dich mit den Händen ab und drück dich zurück.","Arrodíllate sobre una superficie blanda; tu compañero te sujeta los talones.|Déjate caer hacia delante lo más despacio posible con la cadera extendida.|Frena con las manos y empuja para volver.","Mets-toi à genoux sur une surface souple, ton partenaire tient tes talons.|Laisse-toi descendre vers l'avant le plus lentement possible, hanches tendues.|Rattrape-toi avec les mains et repousse-toi."],"s_pull":["Grip the bar slightly wider than shoulders and hang with a tight core.|Pull your shoulder blades down, then your chin over the bar.|Lower slowly to a full hang.","Greif die Stange etwas weiter als schulterbreit und häng dich mit festem Rumpf aus.|Zieh die Schulterblätter nach unten und dann das Kinn über die Stange.|Lass dich langsam bis in den gestreckten Hang ab.","Agarra la barra algo más ancho que los hombros y cuélgate con el tronco firme.|Baja los omóplatos y después lleva la barbilla por encima de la barra.|Desciende despacio hasta quedar colgado y estirado.","Saisis la barre un peu plus large que les épaules et suspends-toi, tronc gainé.|Abaisse les omoplates, puis amène le menton au-dessus de la barre.|Redescends lentement jusqu'à la suspension complète."],"s_carry":["Take a weight in each hand and stand tall.|Walk with short, calm steps, shoulders down, core tight.|Put the weights down at the end with a flat back.","Nimm in jede Hand ein Gewicht und richte dich auf.|Geh mit kurzen, ruhigen Schritten, Schultern tief, Rumpf fest.|Stell die Gewichte am Ende mit geradem Rücken ab.","Coge un peso en cada mano y ponte erguido.|Camina con pasos cortos y tranquilos, hombros bajos, tronco firme.|Deja los pesos al final con la espalda recta.","Prends une charge dans chaque main et redresse-toi.|Marche à petits pas calmes, épaules basses, tronc gainé.|Pose les charges à la fin, dos plat."],"s_pogo":["Stand tall, arms bent.|Jump several times in a row with your knees almost straight.|Keep ground contacts as short as possible.","Steh aufrecht, Arme angewinkelt.|Spring mehrmals hintereinander, die Knie bleiben fast gestreckt.|Halte die Bodenkontakte so kurz wie möglich.","De pie y erguido, brazos flexionados.|Salta varias veces seguidas con las rodillas casi estiradas.|Haz los contactos con el suelo lo más cortos posible.","Debout, bien droit, bras fléchis.|Enchaîne plusieurs sauts, genoux presque tendus.|Garde des contacts au sol les plus brefs possible."],"s_ladder":["Lay out the ladder and put a cone ten metres beyond it.|Run through every square with quick, short steps.|After the last square accelerate fully to the cone.","Leg die Leiter aus und stell ein Hütchen zehn Meter dahinter.|Lauf mit schnellen, kurzen Schritten durch jedes Feld.|Beschleunige nach dem letzten Feld voll bis zum Hütchen.","Extiende la escalera y coloca un cono diez metros más allá.|Pasa por cada cuadro con pasos rápidos y cortos.|Tras el último cuadro acelera al máximo hasta el cono.","Déroule l'échelle et place un plot dix mètres plus loin.|Traverse chaque case à petits pas rapides.|Après la dernière case, accélère à fond jusqu'au plot."],"s_hurdle":["Set up three low hurdles one metre apart.|Jump over each hurdle off both feet and land quietly.|Sprint ten metres straight after the last landing.","Stell drei niedrige Hürden mit je einem Meter Abstand auf.|Spring beidbeinig über jede Hürde und lande leise.|Sprinte nach der letzten Landung sofort zehn Meter.","Coloca tres vallas bajas a un metro entre sí.|Salta cada valla con los dos pies y aterriza sin ruido.|Esprinta diez metros nada más aterrizar del último salto.","Installe trois petites haies espacées d'un mètre.|Saute chaque haie à pieds joints et atterris sans bruit.|Sprinte dix mètres juste après la dernière réception."],"s_circuit":["Set up four stations: squats, jumps, 10-metre sprints and forearm plank.|Work for 40 seconds at each station and move on within 20 seconds.|Rest two minutes after every round.","Bau vier Stationen auf: Kniebeugen, Sprünge, 10-Meter-Sprints und Unterarmstütz.|Arbeite an jeder Station 40 Sekunden und wechsle in 20 Sekunden zur nächsten.|Mach nach jeder Runde zwei Minuten Pause.","Monta cuatro estaciones: sentadillas, saltos, esprints de 10 metros y plancha.|Trabaja 40 segundos en cada estación y cambia en 20 segundos.|Descansa dos minutos tras cada vuelta.","Installe quatre ateliers : squats, sauts, sprints de 10 mètres et gainage.|Travaille 40 secondes par atelier et change en 20 secondes.|Repose-toi deux minutes après chaque tour."],"iq_drib":["Put four cones in a line and two more as look-points left and right.|Dribble through the cones and look at the look-points between touches.|Say out loud what you see without losing the ball.","Stell vier Hütchen in eine Linie und zwei weitere als Blickpunkte links und rechts.|Dribble durch die Hütchen und schau zwischen den Kontakten zu den Blickpunkten.|Sag laut, was du siehst, ohne den Ball zu verlieren.","Coloca cuatro conos en línea y dos más como puntos de mirada a izquierda y derecha.|Conduce entre los conos y mira a esos puntos entre toque y toque.|Di en voz alta lo que ves sin perder el balón.","Aligne quatre plots et places-en deux autres comme repères visuels à gauche et à droite.|Dribble entre les plots et regarde les repères entre les touches.|Dis à voix haute ce que tu vois sans perdre le ballon."],"iq_star":["Put one cone in the middle and four around it.|Start in the middle and react to the signal.|Run or dribble to the right cone and straight back to the middle.","Stell ein Hütchen in die Mitte und vier außen herum.|Starte in der Mitte und reagiere auf das Signal.|Lauf oder dribble zum richtigen Hütchen und sofort zurück zur Mitte.","Coloca un cono en el centro y cuatro alrededor.|Sal desde el centro y reacciona a la señal.|Corre o conduce hasta el cono correcto y vuelve enseguida al centro.","Place un plot au centre et quatre autour.|Pars du centre et réagis au signal.|Cours ou dribble jusqu'au bon plot et reviens aussitôt au centre."],"iq_space":["Mark out a square, your partner has the ball outside it.|Keep moving to where you can be reached and have space.|Show with your hand where you want the ball.","Markiert ein Quadrat, dein Partner hat den Ball außerhalb.|Beweg dich immer dorthin, wo du anspielbar bist und Platz hast.|Zeig mit der Hand, wohin du den Ball haben willst.","Marcad un cuadrado; tu compañero tiene el balón fuera.|Muévete siempre hacia donde puedas recibir y tengas espacio.|Señala con la mano dónde quieres el balón.","Tracez un carré, ton partenaire a le ballon à l'extérieur.|Déplace-toi toujours là où tu es jouable et où tu as de l'espace.|Montre de la main où tu veux le ballon."],"iq_game":["Mark out a small pitch with two cone gates on each side.|Check before every action which gate is open.|Decide early: dribble, pass or switch sides.","Markiert ein kleines Feld mit zwei Hütchentoren pro Seite.|Schau vor jeder Aktion, welches Tor frei ist.|Entscheide früh: dribbeln, passen oder Seite wechseln.","Marcad un campo pequeño con dos puertas de conos por lado.|Mira antes de cada acción qué puerta está libre.|Decide pronto: conducir, pasar o cambiar de lado.","Tracez un petit terrain avec deux portes de plots par côté.|Regarde avant chaque action quelle porte est libre.|Décide tôt : dribbler, passer ou changer de côté."],"pass_direct":["Play against the wall and stand side-on to the cone gate.|Glance at the gate while the ball comes back.|Play the rebound first time through the gate.","Spiel gegen die Wand und stell dich seitlich zum Hütchentor.|Schau kurz zum Tor, während der Ball zurückkommt.|Spiel den Abpraller direkt mit einem Kontakt durch das Tor.","Juega contra la pared y colócate de lado respecto a la puerta de conos.|Mira un instante la puerta mientras vuelve el balón.|Pasa el rebote de primeras por la puerta.","Joue contre le mur et place-toi de profil par rapport à la porte de plots.|Jette un œil à la porte pendant que le ballon revient.|Joue le rebond en une touche dans la porte."]};
