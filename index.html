["v1","circuit","c","r",2,6,"weak","tired","Beat the cones and finish","Dribble through the cones at speed and finish on goal without slowing down.","Hütchen ausspielen und abschließen","Dribble im Tempo durch die Hütchen und schließ ab, ohne langsamer zu werden.","Superar conos y definir","Conduce a velocidad entre los conos y define a portería sin frenar.","Éliminer les plots et conclure","Conduis vite entre les plots et conclus au but sans ralentir."],
["v1","square","cpb","t",5,30,"tight","tired","King of the box","You and your partner each dribble a ball in the box. Protect yours and kick theirs out.","König im Quadrat","Du und dein Partner dribbelt jeder einen Ball im Quadrat. Schütze deinen und schieß seinen raus.","Rey del cuadrado","Tú y tu compañero conducís cada uno un balón en el cuadrado. Protege el tuyo y saca el suyo.","Roi du carré","Toi et ton partenaire conduisez chacun un ballon dans le carré. Protège le tien et sors le sien."],
["v1","duel","cp","r",1,8,"speed","tired","Lose your marker","Your partner mirrors you along a line. Shake them off with feints and dribble over the line.","Gegenspieler abschütteln","Dein Partner spiegelt dich entlang einer Linie. Schüttle ihn mit Finten ab und dribble über die Linie.","Desmarcarte del defensor","Tu compañero te sigue como un espejo en una línea. Quítatelo con fintas y cruza la línea conduciendo.","Se défaire du marquage","Ton partenaire te suit en miroir le long d'une ligne. Débarrasse-toi de lui par des feintes et franchis la ligne."],
["v1","touch","","r",3,12,"speed","head","Double touch","Shift the ball quickly from one foot to the other past an imaginary leg and push it forward.","Doppelkontakt","Leg den Ball schnell von einem Fuß auf den anderen an einem gedachten Bein vorbei und nimm ihn nach vorn mit.","Doble toque","Pasa el balón rápido de un pie al otro superando una pierna imaginaria y llévalo hacia delante.","Double contact","Fais passer vite le ballon d'un pied à l'autre devant une jambe imaginaire et pousse-le vers l'avant."],

["fi","givego","cp","r",2,8,"weak","one","One-two and finish","Pass to your partner, run past the cone, take the return and shoot.","Doppelpass und Abschluss","Passe zu deinem Partner, lauf am Hütchen vorbei, nimm den Rückpass und schieß.","Pared y definición","Pasa a tu compañero, supera el cono, recibe la devolución y tira.","Une-deux et frappe","Passe à ton partenaire, dépasse le plot, reçois la remise et tire."],
["fi","circuit","c","r",2,8,"weak","speed","Slalom and finish","Dribble through the three cones and shoot as soon as you are past the last one.","Slalom und Abschluss","Dribble durch die drei Hütchen und schieß, sobald du am letzten vorbei bist.","Eslalon y tiro","Conduce entre los tres conos y tira en cuanto superes el último.","Slalom et frappe","Conduis entre les trois plots et tire dès que tu as dépassé le dernier."],
["fi","mini","cm","r",3,8,"weak","far","Precision into mini goals","From ten metres, finish along the ground into the mini goal you choose before your touch.","Präzision auf Minitore","Schließ aus zehn Metern flach in das Minitor ab, das du vor deinem Kontakt auswählst.","Precisión a miniporterías","Desde diez metros, define raso a la miniportería que elijas antes de tocar.","Précision dans les mini-buts","À dix mètres, conclus à ras de terre dans le mini-but que tu choisis avant ta touche."],
["fi","circuit","sc","r",2,6,"weak","tired","Pole weave and shot","Weave through the poles at full speed and shoot before you have recovered.","Stangen und Schuss","Dribble im vollen Tempo durch die Stangen und schieß, bevor du dich erholt hast.","Picas y tiro","Zigzaguea entre las picas a tope y tira antes de recuperarte.","Piquets et frappe","Slalome à fond entre les piquets et tire avant d'avoir récupéré."],
["fi","shot","cb","r",3,5,"weak","clock","Five in a row","Line up five balls at the edge of the box. Shoot one after another with a single touch each.","Fünf am Stück","Leg fünf Bälle an die Strafraumgrenze. Schieß einen nach dem anderen mit je einem Kontakt.","Cinco seguidos","Coloca cinco balones en el borde del área. Tira uno tras otro con un solo toque cada uno.","Cinq à la suite","Aligne cinq ballons à l'entrée de la surface. Tire-les l'un après l'autre, une touche chacun."],
["fi","shot","c","r",2,8,"weak","speed","Cut inside and curl","Start wide, cut inside round the cone and curl the ball to the far post.","Nach innen ziehen und schlenzen","Starte außen, zieh um das Hütchen nach innen und schlenze den Ball an den zweiten Pfosten.","Recortar y rosca","Sal desde la banda, recorta hacia dentro rodeando el cono y pon el balón con rosca al segundo palo.","Repiquer et enrouler","Pars de l'aile, repique vers l'intérieur autour du plot et enroule le ballon au second poteau."],
["fi","cross","cp","r",2,8,"one","air","Near-post finish","Your partner crosses low. Sprint to the near post and finish with one touch.","Abschluss am ersten Pfosten","Dein Partner flankt flach. Sprinte an den ersten Pfosten und schließ mit einem Kontakt ab.","Remate al primer palo","Tu compañero centra raso. Esprinta al primer palo y remata a un toque.","Finition au premier poteau","Ton partenaire centre à ras de terre. Sprinte au premier poteau et conclus en une touche."],
["fi","shot","c","r",2,8,"weak","far","Chip finish","Put a line of cones six metres from goal. Lift the ball over it and under the bar.","Heber","Leg eine Hütchenlinie sechs Meter vor das Tor. Heb den Ball darüber und unter die Latte.","Vaselina","Pon una línea de conos a seis metros de la portería. Eleva el balón por encima y bajo el larguero.","Ballon piqué","Place une ligne de plots à six mètres du but. Fais passer le ballon par-dessus et sous la barre."],
["fi","shot","cp","r",2,6,"weak","tired","Back to goal against a defender","Your partner leans on your back. Receive, roll them and shoot.","Mit dem Rücken zum Tor gegen einen Verteidiger","Dein Partner lehnt sich an deinen Rücken. Nimm an, dreh dich um ihn und schieß.","De espaldas con defensor","Tu compañero se apoya en tu espalda. Recibe, gírate sobre él y tira.","Dos au but face à un défenseur","Ton partenaire s'appuie dans ton dos. Reçois, enroule-le et tire."],
["fi","star","cb","r",2,4,"weak","clock","Shooting star","Put a ball on each of four cones around the box. Sprint from the centre to each ball and shoot.","Schuss-Stern","Leg je einen Ball an vier Hütchen rund um den Strafraum. Sprinte von der Mitte zu jedem Ball und schieß.","Estrella de tiro","Coloca un balón en cada uno de cuatro conos alrededor del área. Esprinta del centro a cada balón y tira.","Étoile de frappes","Pose un ballon sur chacun des quatre plots autour de la surface. Sprinte du centre vers chaque ballon et tire."],

["de","star","c","t",4,40,"speed","tired","Defensive star","From the centre, move to each cone in a defensive stance: forwards, sideways and backwards, always facing the same way.","Defensiv-Stern","Beweg dich aus der Mitte in Abwehrhaltung zu jedem Hütchen: vorwärts, seitwärts und rückwärts, Blick immer in dieselbe Richtung.","Estrella defensiva","Desde el centro, ve a cada cono en posición defensiva: hacia delante, de lado y de espaldas, mirando siempre al mismo sitio.","Étoile défensive","Depuis le centre, va vers chaque plot en position défensive : en avant, de côté et en arrière, toujours orienté dans le même sens."],
["de","ladder","lc","r",3,6,"speed","tired","Ladder, then close down","Run through the ladder, sprint to the cone and arrive low and side-on with small steps.","Leiter, dann anlaufen","Lauf durch die Leiter, sprinte zum Hütchen und komm tief und seitlich gestellt mit kleinen Schritten an.","Escalera y salir a presionar","Cruza la escalera, esprinta al cono y llega bajo y de perfil con pasos cortos.","Échelle puis sortie sur le porteur","Traverse l'échelle, sprinte vers le plot et arrive bas et de profil, à petits pas."],
["de","duel","mp","r",1,8,"tight","tired","Defend two mini goals","Your partner attacks two mini goals behind you. Show them to one side and win the ball.","Zwei Minitore verteidigen","Dein Partner greift zwei Minitore hinter dir an. Lenk ihn auf eine Seite und hol den Ball.","Defender dos miniporterías","Tu compañero ataca dos miniporterías detrás de ti. Oriéntalo a un lado y roba el balón.","Défendre deux mini-buts","Ton partenaire attaque deux mini-buts derrière toi. Oriente-le d'un côté et récupère le ballon."],
["de","jockey","cp","r",1,8,"speed","tired","Show them outside","Force your partner towards the outer cone, away from the middle, without diving in.","Nach außen lenken","Dränge deinen Partner zum äußeren Hütchen, weg von der Mitte, ohne zu früh zu attackieren.","Orientar hacia fuera","Lleva a tu compañero hacia el cono exterior, lejos del centro, sin entrar antes de tiempo.","Orienter vers l'extérieur","Pousse ton partenaire vers le plot extérieur, loin de l'axe, sans te jeter."],
["de","zig","c","t",4,30,"speed","tired","Backwards zigzag","Move backwards in a defensive stance from cone to cone and open your hips at every change of direction.","Zickzack rückwärts","Beweg dich in Abwehrhaltung rückwärts von Hütchen zu Hütchen und öffne bei jedem Richtungswechsel die Hüfte.","Zigzag de espaldas","Retrocede en posición defensiva de cono a cono y abre la cadera en cada cambio de dirección.","Zigzag en reculant","Recule en position défensive de plot en plot et ouvre les hanches à chaque changement de direction."],
["de","pair","p","r",3,8,"speed","weak","Second-ball reaction","Your partner drops or bounces a ball between you. Get there first and clear it to the side.","Reaktion auf den zweiten Ball","Dein Partner lässt einen Ball zwischen euch fallen oder aufspringen. Sei zuerst da und klär ihn zur Seite.","Reacción al segundo balón","Tu compañero deja caer o botar un balón entre los dos. Llega primero y despéjalo a un lado.","Réaction au deuxième ballon","Ton partenaire lâche ou fait rebondir un ballon entre vous. Arrive le premier et dégage sur le côté."],
["de","poles","s","t",4,30,"speed","tired","Pole shuffles","Side-step round the staggered poles, always facing forwards and never crossing your feet.","Stangen-Shuffles","Umlauf die versetzten Stangen mit Seitschritten, Blick immer nach vorn, Füße nie kreuzen.","Desplazamientos entre picas","Rodea las picas alternadas con pasos laterales, siempre de frente y sin cruzar los pies.","Pas chassés entre piquets","Contourne les piquets décalés en pas chassés, toujours de face et sans croiser les pieds."],
["de","long","p","r",3,8,"weak","far","High-ball clearance","Your partner lofts a ball towards you. Clear it first time, high and far, with your foot.","Hohen Ball klären","Dein Partner spielt einen hohen Ball auf dich. Klär ihn direkt mit dem Fuß, hoch und weit.","Despeje de balón alto","Tu compañero te envía un balón alto. Despéjalo de primera con el pie, alto y lejos.","Dégagement sur ballon haut","Ton partenaire t'envoie un ballon haut. Dégage-le en une touche du pied, haut et loin."],
["de","tee","c","r",3,6,"speed","tired","Press and drop","Sprint up to the top cone as if pressing, then drop back diagonally to a side cone to cover.","Anlaufen und fallen lassen","Sprinte wie beim Anlaufen zum vorderen Hütchen und lass dich dann diagonal zu einem Seitenhütchen fallen, um abzusichern.","Presionar y replegar","Esprinta al cono de arriba como si presionaras y repliega en diagonal a un cono lateral para cubrir.","Presser et décrocher","Sprinte vers le plot du haut comme pour presser, puis décroche en diagonale vers un plot latéral pour couvrir."],
["de","square","cp","t",5,20,"tight","tired","Guard the box","Your partner tries to dribble across the box. Keep them out for 20 seconds without fouling.","Quadrat verteidigen","Dein Partner versucht, durch das Quadrat zu dribbeln. Halt ihn 20 Sekunden ohne Foul draußen.","Proteger el cuadrado","Tu compañero intenta cruzar el cuadrado conduciendo. Impídeselo 20 segundos sin hacer falta.","Garder le carré","Ton partenaire essaie de traverser le carré en dribble. Empêche-le pendant 20 secondes sans faute."],

["pc","ladder","l","r",1,8,"clock","far","Ladder into sprint","One foot in every square as fast as you can, then sprint ten metres out of the ladder.","Leiter in den Sprint","Ein Fuß in jedes Feld, so schnell du kannst, dann aus der Leiter zehn Meter sprinten.","Escalera y esprint","Un pie en cada cuadro lo más rápido posible y sal esprintando diez metros.","Échelle puis sprint","Un pied par case le plus vite possible, puis sprinte dix mètres en sortie d'échelle."],
["pc","ladder","l","r",1,6,"clock","far","Lateral in-out","Move sideways along the ladder: both feet in, both feet out. Then turn and sprint ten metres.","Seitlich rein-raus","Beweg dich seitlich an der Leiter entlang: beide Füße rein, beide raus. Dann dreh dich und sprinte zehn Meter.","Lateral dentro-fuera","Desplázate de lado por la escalera: dos pies dentro, dos fuera. Luego gira y esprinta diez metros.","Latéral dedans-dehors","Déplace-toi latéralement le long de l'échelle : deux pieds dedans, deux dehors. Puis tourne et sprinte dix mètres."],
["pc","poles","s","r",1,6,"clock","speed","Pole weave sprint","Sprint through the staggered poles, leaning into each turn.","Stangen-Sprint","Sprinte durch die versetzten Stangen und leg dich in jede Kurve.","Esprint entre picas","Esprinta entre las picas alternadas inclinándote en cada giro.","Sprint entre piquets","Sprinte entre les piquets décalés en te penchant dans chaque virage."],
["pc","star","c","r",1,6,"clock","short","Star sprints","Sprint from the centre to a corner and back. One rep is all four corners.","Stern-Sprints","Sprinte von der Mitte zu einer Ecke und zurück. Eine Wiederholung sind alle vier Ecken.","Esprints en estrella","Esprinta del centro a una esquina y vuelve. Una repetición son las cuatro esquinas.","Sprints en étoile","Sprinte du centre vers un coin et reviens. Une répétition, c'est les quatre coins."],
["pc","ypath","c","r",1,8,"clock","short","Y-agility","Sprint to the middle cone and cut to the left or right end cone. Decide only at the last step.","Y-Agility","Sprinte zum mittleren Hütchen und schneide zum linken oder rechten Endhütchen. Entscheide erst beim letzten Schritt.","Agilidad en Y","Esprinta al cono central y corta al cono final izquierdo o derecho. Decide en el último paso.","Agilité en Y","Sprinte jusqu'au plot central et coupe vers le plot final gauche ou droit. Décide au dernier appui."],
["pc","zig","c","r",1,6,"clock","short","Zigzag sprints","Sprint from cone to cone and push off the outside foot at every turn.","Zickzack-Sprints","Sprinte von Hütchen zu Hütchen und drück dich bei jeder Wendung mit dem Außenfuß ab.","Esprints en zigzag","Esprinta de cono a cono e impúlsate con el pie exterior en cada giro.","Sprints en zigzag","Sprinte de plot en plot et pousse sur le pied extérieur à chaque virage."],
["pc","spot","","r",3,5,"hold","more","Broad jumps","Jump forwards as far as you can from both feet, land softly and jump again straight away.","Weitsprünge aus dem Stand","Spring beidbeinig so weit wie möglich nach vorn, lande weich und spring sofort wieder.","Saltos de longitud","Salta hacia delante lo más lejos posible con los dos pies, cae suave y vuelve a saltar enseguida.","Sauts en longueur","Saute vers l'avant le plus loin possible à deux pieds, atterris en douceur et repars aussitôt."],
["pc","spot","","r",3,8,"hold","more","Bounding","Run with long, powerful leaps from one leg to the other and drive your knee up each time.","Sprungläufe","Lauf mit langen, kräftigen Sprüngen von einem Bein aufs andere und zieh das Knie jedes Mal hoch.","Zancadas saltadas","Corre con saltos largos y potentes de una pierna a otra subiendo la rodilla cada vez.","Foulées bondissantes","Cours en longs bonds puissants d'une jambe à l'autre en montant le genou à chaque fois."],
["pc","sprint","","r",1,8,"clock","far","Falling starts","Stand tall and lean forwards until you have to run, then sprint ten metres.","Fallstarts","Steh aufrecht und lehn dich nach vorn, bis du loslaufen musst, dann sprinte zehn Meter.","Salidas en caída","De pie, inclínate hacia delante hasta que tengas que correr y esprinta diez metros.","Départs en chute","Debout, penche-toi vers l'avant jusqu'à devoir courir, puis sprinte dix mètres."],
["pc","sprint","c","r",1,6,"clock","short","Sprint and brake","Sprint 15 metres and come to a complete stop inside a three-metre zone.","Sprinten und abbremsen","Sprinte 15 Meter und komm in einer Drei-Meter-Zone komplett zum Stehen.","Esprintar y frenar","Esprinta 15 metros y detente por completo dentro de una zona de tres metros.","Sprinter et freiner","Sprinte 15 mètres et arrête-toi complètement dans une zone de trois mètres."],

["cr","overlap","cp","r",2,8,"weak","speed","Overlap and cross","Pass inside to your partner, run round the outside, take the return and cross.","Hinterlaufen und flanken","Passe nach innen zu deinem Partner, hinterlauf ihn außen, nimm den Rückpass und flanke.","Doblar y centrar","Pasa hacia dentro a tu compañero, dóblalo por fuera, recibe la devolución y centra.","Dédoublement et centre","Passe à l'intérieur à ton partenaire, dédouble par l'extérieur, reçois la remise et centre."],
["cr","poles","sc","r",2,6,"weak","tired","Poles, then cross","Dribble through the poles down the wing and cross as soon as you are past the last one.","Stangen, dann Flanke","Dribble am Flügel durch die Stangen und flanke, sobald du an der letzten vorbei bist.","Picas y centro","Conduce entre las picas por la banda y centra en cuanto superes la última.","Piquets puis centre","Conduis entre les piquets le long de l'aile et centre dès le dernier franchi."],
["cr","cross","cm","r",2,8,"weak","far","Cross to the mini goals","Put a mini goal at the near and far post. Cross so the ball lands in the one you name first.","Flanke auf Minitore","Stell je ein Minitor an den ersten und zweiten Pfosten. Flanke so, dass der Ball in dem landet, das du vorher ansagst.","Centro a las miniporterías","Pon una miniportería en el primer palo y otra en el segundo. Centra para que el balón caiga en la que anuncies.","Centre vers les mini-buts","Place un mini-but au premier et au second poteau. Centre pour que le ballon tombe dans celui que tu annonces."],
["cr","cross","cb","r",3,5,"weak","clock","Serial crossing","Line up five balls along the wing and cross them one after another without a break.","Serienflanken","Leg fünf Bälle am Flügel entlang und flanke sie ohne Pause nacheinander.","Centros en serie","Coloca cinco balones en la banda y céntralos uno tras otro sin pausa.","Centres en série","Aligne cinq ballons le long de l'aile et centre-les l'un après l'autre sans pause."],
["cr","cross","c","r",2,8,"both","speed","Outside or inside","At the cone, either go down the outside and cross with your near foot, or cut inside and cross with the other.","Außen oder innen","Geh am Hütchen entweder außen vorbei und flanke mit dem nahen Fuß oder zieh nach innen und flanke mit dem anderen.","Por fuera o por dentro","En el cono, o sigues por fuera y centras con la pierna cercana, o recortas hacia dentro y centras con la otra.","Extérieur ou intérieur","Au plot, soit tu passes à l'extérieur et centres du pied proche, soit tu repiques et centres de l'autre."],
["cr","long","c","r",2,8,"weak","far","Corner delivery","From the corner flag, deliver the ball into a cone zone at the six-yard line.","Eckball in die Zone","Bring den Ball von der Eckfahne in eine Hütchenzone am Fünfmeterraum.","Saque de esquina a la zona","Desde el córner, pon el balón en una zona de conos en el área pequeña.","Corner dans la zone","Du poteau de corner, dépose le ballon dans une zone de plots aux six mètres."],
["cr","overlap","cp","r",2,8,"one","speed","One-two down the line","Play a one-two with your partner along the touchline and cross first time.","Doppelpass an der Linie","Spiel an der Seitenlinie einen Doppelpass mit deinem Partner und flanke direkt.","Pared por la banda","Haz una pared con tu compañero por la línea de banda y centra de primera.","Une-deux le long de la ligne","Fais un une-deux avec ton partenaire le long de la touche et centre en une touche."],
["cr","cross","lc","r",2,6,"weak","tired","Ladder, then cross","Run through the ladder, pick up the ball and cross while your legs are heavy.","Leiter, dann Flanke","Lauf durch die Leiter, nimm den Ball auf und flanke mit schweren Beinen.","Escalera y centro","Cruza la escalera, toma el balón y centra con las piernas cargadas.","Échelle puis centre","Traverse l'échelle, prends le ballon et centre avec les jambes lourdes."],
["cr","wall","wc","r",3,8,"weak","far","Curl round the cone","Put a cone halfway to the wall. Bend the ball round it and hit your mark.","Um das Hütchen schlenzen","Stell ein Hütchen auf halbem Weg zur Wand. Schlenze den Ball darum herum auf deine Markierung.","Rosca rodeando el cono","Pon un cono a mitad de camino hacia la pared. Dale rosca al balón para rodearlo y acertar en tu marca.","Enrouler autour du plot","Place un plot à mi-distance du mur. Enroule le ballon autour et touche ta marque."],
["cr","cross","c","r",2,8,"weak","speed","First-time cross","Push the ball ahead at speed and cross it without another touch.","Direkte Flanke","Leg dir den Ball im Tempo vor und flanke ohne weiteren Kontakt.","Centro de primera","Adelántate el balón a velocidad y centra sin más toques.","Centre en une touche","Pousse le ballon devant toi en pleine course et centre sans autre touche."],

["st","spot","","r",3,10,"load","hold","Reverse lunge with knee drive","Step back into a lunge, then drive the same knee up to hip height as you stand. Reps per leg.","Ausfallschritt rückwärts mit Kniehub","Mach einen Ausfallschritt nach hinten und zieh dasselbe Knie beim Aufrichten auf Hüfthöhe. Pro Bein.","Zancada atrás con rodilla arriba","Da una zancada atrás y, al subir, lleva esa rodilla a la altura de la cadera. Por pierna.","Fente arrière avec montée de genou","Fais une fente arrière puis monte ce genou à hauteur de hanche en te redressant. Par jambe."],
["st","spot","","t",3,15,"short","more","Side plank with raised leg","In a side plank, rest your top leg on a chair and lift your lower leg to meet it. Time per side.","Seitstütz mit erhöhtem Bein","Leg im Seitstütz das obere Bein auf einen Stuhl und heb das untere Bein dazu an. Zeit pro Seite.","Plancha lateral con pierna elevada","En plancha lateral, apoya la pierna de arriba en una silla y sube la de abajo hasta juntarla. Tiempo por lado.","Gainage latéral jambe surélevée","En gainage latéral, pose la jambe du dessus sur une chaise et monte celle du dessous jusqu'à elle. Temps par côté."],
["st","spot","p","r",3,5,"load","more","Partner hamstring lowers","Kneel while your partner holds your ankles. Lower your body forwards as slowly as you can and push back up with your hands.","Beinbeuger-Absenken mit Partner","Knie dich hin, dein Partner hält deine Knöchel. Senk den Körper so langsam wie möglich nach vorn und drück dich mit den Händen zurück.","Bajadas de isquios con compañero","De rodillas, tu compañero te sujeta los tobillos. Baja el cuerpo hacia delante lo más lento posible y vuelve empujando con las manos.","Descentes ischios avec partenaire","À genoux, ton partenaire tient tes chevilles. Descends le buste vers l'avant le plus lentement possible et repousse-toi avec les mains."],
["st","spot","","r",3,10,"load","hold","Dead bug","Lie on your back with arms and legs up. Lower the opposite arm and leg slowly while your lower back stays on the floor.","Dead Bug","Rückenlage, Arme und Beine oben. Senk langsam den gegenüberliegenden Arm und das Bein, der untere Rücken bleibt am Boden.","Dead bug","Boca arriba con brazos y piernas arriba. Baja despacio el brazo y la pierna contrarios sin despegar la zona lumbar.","Dead bug","Sur le dos, bras et jambes en l'air. Descends lentement le bras et la jambe opposés, le bas du dos collé au sol."],
["st","spot","","r",3,8,"load","hold","Split squat with rear foot raised","Put your back foot on a chair and bend your front knee until your thigh is level. Reps per leg.","Split Squat mit erhöhtem Fuß","Leg den hinteren Fuß auf einen Stuhl und beug das vordere Knie, bis der Oberschenkel waagerecht ist. Pro Bein.","Sentadilla búlgara","Apoya el pie de atrás en una silla y flexiona la rodilla delantera hasta que el muslo quede horizontal. Por pierna.","Squat bulgare","Pose le pied arrière sur une chaise et fléchis le genou avant jusqu'à la cuisse horizontale. Par jambe."],
["st","spot","","r",3,12,"hold","more","Plank shoulder taps","In a push-up position, tap the opposite shoulder with each hand without letting your hips rock.","Schultertippen im Stütz","Tipp im Liegestütz abwechselnd mit einer Hand an die gegenüberliegende Schulter, ohne dass die Hüfte wackelt.","Toques de hombro en plancha","En posición de flexión, toca el hombro contrario con cada mano sin balancear la cadera.","Touches d'épaule en planche","En position de pompe, touche l'épaule opposée de chaque main sans balancer le bassin."],
["st","star","c","t",4,90,"short","more","Strength star","Do five reps at each corner cone (squats, push-ups, lunges, jumps) and jog through the centre between them.","Kraft-Stern","Mach an jedem Eckhütchen fünf Wiederholungen (Kniebeugen, Liegestütze, Ausfallschritte, Sprünge) und trabe dazwischen durch die Mitte.","Estrella de fuerza","Haz cinco repeticiones en cada cono de esquina (sentadillas, flexiones, zancadas, saltos) y pasa trotando por el centro.","Étoile de force","Fais cinq répétitions à chaque plot de coin (squats, pompes, fentes, sauts) en passant par le centre en trottinant."],
["st","ladder","l","r",3,4,"hold","more","Ladder hops","Hop through the ladder on two feet, then on your left leg, then on your right. One rep is all three.","Leiter-Sprünge","Spring beidbeinig durch die Leiter, dann auf dem linken, dann auf dem rechten Bein. Eine Wiederholung sind alle drei.","Saltos en escalera","Cruza la escalera saltando con los dos pies, luego con la izquierda y luego con la derecha. Una repetición son las tres.","Sauts dans l'échelle","Traverse l'échelle à pieds joints, puis sur la jambe gauche, puis la droite. Une répétition, ce sont les trois."],
["st","spot","w","t",3,30,"short","more","Wall sit","Sit against a wall with your knees at 90 degrees and hold.","Wandsitzen","Setz dich mit 90 Grad im Knie an eine Wand und halte.","Sentadilla en pared","Siéntate contra una pared con las rodillas a 90 grados y aguanta.","Chaise contre le mur","Assieds-toi contre un mur, genoux à 90 degrés, et tiens."],
["st","spot","","r",3,8,"short","more","Burpees","Drop into a push-up position, bring your feet back under you and jump up with your arms overhead.","Burpees","Geh in den Liegestütz, zieh die Füße wieder unter den Körper und spring mit den Armen nach oben ab.","Burpees","Baja a posición de flexión, recoge los pies bajo el cuerpo y salta con los brazos arriba.","Burpees","Descends en position de pompe, ramène les pieds sous toi et saute bras au-dessus de la tête."],

["iq","star","c","t",4,45,"head","speed","Numbered corners","Number the four corners. Call a number out loud, dribble there and back, and never go to the same corner twice in a row.","Nummerierte Ecken","Nummeriere die vier Ecken. Ruf eine Zahl, dribble hin und zurück, und geh nie zweimal hintereinander zur selben Ecke.","Esquinas numeradas","Numera las cuatro esquinas. Di un número en voz alta, conduce hasta allí y vuelve, sin repetir esquina dos veces seguidas.","Coins numérotés","Numérote les quatre coins. Annonce un numéro, conduis jusque-là et reviens, sans jamais reprendre le même coin deux fois de suite."],
["iq","mini","cmp","r",3,10,"one","speed","Find the open goal","Your partner stands between the mini goals and blocks one of them late. Pass into the other.","Das offene Tor finden","Dein Partner steht zwischen den Minitoren und stellt spät eines zu. Passe ins andere.","Encontrar la portería libre","Tu compañero se coloca entre las miniporterías y tapa una en el último momento. Pasa a la otra.","Trouver le but ouvert","Ton partenaire se place entre les mini-buts et en ferme un au dernier moment. Passe dans l'autre."],
["iq","ypath","cp","r",3,8,"speed","tight","Read the defender","Your partner waits at the middle cone and steps left or right. Go the other way to the end cone.","Den Verteidiger lesen","Dein Partner wartet am mittleren Hütchen und macht einen Schritt nach links oder rechts. Geh zur anderen Seite ans Endhütchen.","Leer al defensor","Tu compañero espera en el cono central y da un paso a la izquierda o la derecha. Sal por el otro lado hacia el cono final.","Lire le défenseur","Ton partenaire attend au plot central et fait un pas à gauche ou à droite. Pars de l'autre côté vers le plot final."],
["iq","givego","cp","r",3,8,"one","press","Man on or turn","Receive from your partner. If they shout that a defender is coming, play it back first time; if not, turn and go.","Hintermann oder aufdrehen","Nimm den Pass deines Partners. Ruft er Hintermann, spiel direkt zurück; wenn nicht, dreh auf und geh.","Solo o presionado","Recibe de tu compañero. Si te avisa de que llega un rival, devuelve de primera; si no, gira y avanza.","Seul ou ça vient","Reçois de ton partenaire. S'il annonce qu'un adversaire arrive, remets en une touche ; sinon, retourne-toi et avance."],
["iq","gate","c","t",4,45,"head","speed","Memory gates","Decide on an order of gates, dribble through them in that order and then in reverse without stopping to think.","Tore merken","Leg eine Reihenfolge der Tore fest, dribble sie in dieser Reihenfolge ab und dann rückwärts, ohne zu überlegen.","Puertas de memoria","Decide un orden de puertas, pásalas conduciendo en ese orden y luego al revés sin pararte a pensar.","Portes à mémoriser","Fixe un ordre de portes, franchis-les en conduite dans cet ordre puis à l'envers, sans t'arrêter pour réfléchir."],
["iq","pair","p","r",3,12,"weak","speed","Touch count","Before each pass your partner calls one, two or three. Use exactly that many touches before passing back.","Kontakte auf Ansage","Dein Partner ruft vor jedem Pass eins, zwei oder drei. Spiel mit genau so vielen Kontakten zurück.","Toques a la voz","Antes de cada pase tu compañero dice uno, dos o tres. Usa exactamente esos toques antes de devolver.","Nombre de touches annoncé","Avant chaque passe, ton partenaire annonce un, deux ou trois. Utilise exactement ce nombre de touches avant de rendre."],
["iq","star","c","t",4,60,"speed","press","Position map","The four corners stand for ball left, ball right, ball lost and ball won. Call one and jog to where you would stand in a match.","Positionskarte","Die vier Ecken stehen für Ball links, Ball rechts, Ball verloren und Ball gewonnen. Ruf eine Situation und lauf dorthin, wo du im Spiel stehen würdest.","Mapa de posición","Las cuatro esquinas son balón a la izquierda, a la derecha, perdido y recuperado. Di una y ve trotando a donde te colocarías en el partido.","Carte de placement","Les quatre coins représentent ballon à gauche, à droite, perdu et récupéré. Annonce une situation et va te placer comme en match."],
["iq","zig","c","t",4,40,"weak","speed","Say it, then do it","Dribble the zigzag. Before each cone, say out loud which turn you will use, then do exactly that.","Ansagen, dann machen","Dribble den Zickzack. Sag vor jedem Hütchen laut, welche Wendung du machst, und mach genau die.","Dilo y hazlo","Conduce el zigzag. Antes de cada cono di en voz alta qué giro harás y haz exactamente ese.","Annonce puis exécute","Conduis le zigzag. Avant chaque plot, annonce à voix haute ton geste, puis fais exactement celui-là."],
["iq","wall","w","r",3,12,"weak","speed","Wall sequence","Play against the wall in a fixed pattern of one touch, two touches, three touches, and start again if you lose count.","Wand-Sequenz","Spiel gegen die Wand im festen Muster ein Kontakt, zwei Kontakte, drei Kontakte und fang neu an, wenn du dich verzählst.","Secuencia en la pared","Juega contra la pared con un patrón fijo de un toque, dos toques, tres toques, y vuelve a empezar si te pierdes.","Séquence au mur","Joue contre le mur selon un schéma fixe une touche, deux touches, trois touches, et recommence si tu perds le compte."],
["iq","overlap","cp","r",3,8,"speed","one","Overlap or hold","If your partner dribbles inside, overlap on the outside. If they go outside, stay behind them as cover.","Hinterlaufen oder absichern","Dribbelt dein Partner nach innen, hinterlauf ihn außen. Geht er nach außen, bleib als Absicherung hinter ihm.","Doblar o cubrir","Si tu compañero conduce hacia dentro, dóblalo por fuera. Si va por fuera, quédate detrás como cobertura.","Dédoubler ou couvrir","Si ton partenaire rentre vers l'intérieur, dédouble à l'extérieur. S'il part à l'extérieur, reste derrière en couverture."]
]);

gate:{ph:[[0,["The ball comes towards you","Der Ball kommt auf dich zu","El balón viene hacia ti","Le ballon vient vers toi"]],[.3,["Choose a gate","Wähle ein Tor","Elige una puerta","Choisis une porte"]],[.45,["Go through it with the ball","Mit Ball hindurch","Pásala con el balón","Franchis-la avec le ballon"]]],setup:["Build 2 cone gates, each 2 metres wide, 6 metres apart, 5 metres in front of you.","Bau 2 Hütchentore, je 2 Meter breit, 6 Meter auseinander, 5 Meter vor dir.","Monta 2 puertas de conos de 2 metros de ancho, separadas 6 metros, 5 metros delante de ti.","Monte 2 portes de plots de 2 mètres de large, espacées de 6 mètres, à 5 mètres devant toi."]},

ladder:{ph:[[0,["Start in front of the ladder","Starte vor der Leiter","Sal delante de la escalera","Pars devant l'échelle"]],[.1,["Quick feet through every square","Schnelle Füße durch jedes Feld","Pies rápidos en cada cuadro","Appuis rapides dans chaque case"]],[.6,["Sprint out to the cone","Raus sprinten bis zum Hütchen","Sal esprintando hasta el cono","Sprinte en sortie jusqu'au plot"]]],setup:["Lay the ladder flat and put one cone 10 metres beyond its end.","Leg die Leiter flach aus und stell ein Hütchen 10 Meter hinter ihr Ende.","Extiende la escalera y pon un cono 10 metros más allá del final.","Pose l'échelle à plat et place un plot 10 mètres après la sortie."]},

circuit:{ph:[[0,["Dribble through the cones","Dribble durch die Hütchen","Conduce entre los conos","Conduis entre les plots"]],[.3,["Accelerate towards goal","Richtung Tor beschleunigen","Acelera hacia portería","Accélère vers le but"]],[.7,["Shoot","Abschließen","Tira","Tire"]]],setup:["Put 3 cones (or poles) about {s} m apart, the last one 14 metres from goal.","Stell 3 Hütchen (oder Stangen) mit etwa {s} m Abstand auf, das letzte 14 Meter vor dem Tor.","Coloca 3 conos (o picas) a unos {s} m, el último a 14 metros de la portería.","Place 3 plots (ou piquets) espacés d'environ {s} m, le dernier à 14 mètres du but."]},
ypath:{ph:[[0,["Start at the bottom of the Y","Starte am Fuß des Y","Sal de la base de la Y","Pars du pied du Y"]],[.1,["Go hard to the middle cone","Im Tempo zum mittleren Hütchen","Ve fuerte al cono central","Fonce vers le plot central"]],[.35,["Cut left or right to an end cone","Nach links oder rechts zum Endhütchen schneiden","Corta a izquierda o derecha hacia un cono final","Coupe à gauche ou à droite vers un plot final"]]],setup:["Build a Y with 4 cones: 10 metres to the middle cone, then 8 metres diagonally to each end cone.","Bau mit 4 Hütchen ein Y: 10 Meter bis zum mittleren Hütchen, dann je 8 Meter diagonal zu den Endhütchen.","Monta una Y con 4 conos: 10 metros hasta el cono central y 8 metros en diagonal a cada cono final.","Forme un Y avec 4 plots : 10 mètres jusqu'au plot central, puis 8 mètres en diagonale vers chaque plot final."]},
star:{ph:[[0,["Start at the centre cone","Starte am mittleren Hütchen","Sal del cono central","Pars du plot central"]],[.02,["Go out to a corner","Raus zu einer Ecke","Sal hacia una esquina","Va vers un coin"]],[.12,["Back to the centre, then the next corner","Zurück zur Mitte, dann die nächste Ecke","Vuelve al centro y ve a la siguiente esquina","Reviens au centre, puis le coin suivant"]]],setup:["Put one cone in the middle and 4 cones around it, each 5 metres away.","Stell ein Hütchen in die Mitte und 4 Hütchen drum herum, je 5 Meter entfernt.","Coloca un cono en el centro y 4 alrededor, cada uno a 5 metros.","Place un plot au centre et 4 autour, chacun à 5 mètres."]},
givego:{ph:[[0,["Pass to your partner","Passe zu deinem Partner","Pasa a tu compañero","Passe à ton partenaire"]],[.3,["Sprint into the space ahead","Sprinte in den freien Raum","Esprinta al espacio","Sprinte dans l'espace"]],[.6,["Take the return and finish","Rückpass nehmen und abschließen","Recibe la devolución y define","Reçois la remise et conclus"]]],setup:["Your partner stands 10 metres ahead and to the side; the goal is 15 metres beyond.","Dein Partner steht 10 Meter schräg vor dir, das Tor ist 15 Meter dahinter.","Tu compañero se sitúa 10 metros por delante y a un lado; la portería está 15 metros más allá.","Ton partenaire se place 10 mètres devant toi, décalé ; le but est 15 mètres plus loin."]},
zig:{ph:[[0,["Start in front of the first cone","Starte vor dem ersten Hütchen","Sal delante del primer cono","Pars devant le premier plot"]],[.2,["Go diagonally from cone to cone","Diagonal von Hütchen zu Hütchen","Ve en diagonal de cono a cono","Va en diagonale de plot en plot"]],[.45,["Change direction sharply at each one","An jedem scharf die Richtung wechseln","Cambia de dirección con decisión en cada uno","Change nettement de direction à chacun"]]],setup:["Set 4 cones in a zigzag, 4 metres apart and 5 metres wide.","Stell 4 Hütchen im Zickzack auf, 4 Meter Abstand, 5 Meter breit.","Coloca 4 conos en zigzag, a 4 metros y con 5 metros de ancho.","Place 4 plots en zigzag, espacés de 4 mètres sur 5 mètres de large."]},
overlap:{ph:[[0,["Pass inside to your partner","Passe nach innen zum Partner","Pasa hacia dentro a tu compañero","Passe à l'intérieur à ton partenaire"]],[.3,["Run round the outside","Außen herum laufen","Corre por fuera","Dédouble par l'extérieur"]],[.6,["Take the ball back and cross","Ball zurückbekommen und flanken","Recibe de nuevo y centra","Récupère le ballon et centre"]]],setup:["Start on the wing 35 metres from goal with your partner 10 metres inside you. Mark a target zone in front of goal.","Starte am Flügel 35 Meter vor dem Tor, dein Partner steht 10 Meter weiter innen. Markiere eine Zielzone vor dem Tor.","Sal en la banda a 35 metros de la portería con tu compañero 10 metros hacia dentro. Marca una zona objetivo delante de la portería.","Pars sur l'aile à 35 mètres du but, ton partenaire 10 mètres à l'intérieur. Trace une zone cible devant le but."]}

window.BZ_TAGS={
recv:{goal:["A clean first touch that takes you away from pressure.","Ein sauberer erster Kontakt, der dich vom Druck wegbringt.","Un primer toque limpio que te aleja de la presión.","Une première touche propre qui t'éloigne de la pression."],cp:[["Look over your shoulder before the ball arrives.","Schulterblick, bevor der Ball ankommt.","Mira por encima del hombro antes de que llegue el balón.","Regarde par-dessus ton épaule avant l'arrivée du ballon."],["Relax your foot at contact so the ball does not bounce off.","Fuß beim Kontakt locker lassen, damit der Ball nicht wegspringt.","Relaja el pie en el contacto para que el balón no rebote.","Relâche le pied au contact pour que le ballon ne rebondisse pas."],["Take the touch into space, a step away from your body.","Den Ball in den freien Raum mitnehmen, einen Schritt vom Körper weg.","Lleva el toque al espacio, a un paso del cuerpo.","Oriente la touche dans l'espace, à un pas du corps."]],err:[["Stopping the ball dead under your feet.","Den Ball direkt unter dem Körper totlegen.","Dejar el balón muerto bajo los pies.","Bloquer le ballon sous tes pieds."],["Standing flat-footed and waiting for the ball.","Flach auf den Fersen stehen und auf den Ball warten.","Esperar el balón parado sobre los talones.","Attendre le ballon à plat sur les talons."]]},
pass:{goal:["Firm, accurate passes with both feet.","Feste, genaue Pässe mit beiden Füßen.","Pases firmes y precisos con ambas piernas.","Des passes appuyées et précises des deux pieds."],cp:[["Standing foot beside the ball, pointing at the target.","Standfuß neben den Ball, Fußspitze zum Ziel.","Pie de apoyo junto al balón, apuntando al objetivo.","Pied d'appui à côté du ballon, pointé vers la cible."],["Lock your ankle and strike through the middle of the ball.","Sprunggelenk fixieren und durch die Ballmitte spielen.","Bloquea el tobillo y golpea el centro del balón.","Verrouille la cheville et traverse le centre du ballon."],["Follow through towards the target.","Zum Ziel durchschwingen.","Acompaña el golpeo hacia el objetivo.","Accompagne le geste vers la cible."]],err:[["Leaning back, so the ball lifts.","Zurücklehnen, dadurch steigt der Ball.","Echarse atrás, con lo que el balón se eleva.","Se pencher en arrière, ce qui lève le ballon."],["Passing too softly to be safe.","Zu weich passen, um sicherzugehen.","Pasar demasiado flojo por seguridad.","Passer trop mollement par prudence."]]},
drib:{goal:["Close control and sharp changes of direction at speed.","Enge Ballführung und scharfe Richtungswechsel im Tempo.","Control cercano y cambios de dirección secos a velocidad.","Conduite serrée et changements de direction secs à vitesse."],cp:[["Many small touches, the ball always within one step.","Viele kleine Kontakte, der Ball immer einen Schritt entfernt.","Muchos toques cortos, el balón siempre a un paso.","Beaucoup de petites touches, le ballon toujours à un pas."],["Drop your shoulder to sell the feint.","Schulter fallen lassen, um die Finte zu verkaufen.","Baja el hombro para vender la finta.","Baisse l'épaule pour vendre la feinte."],["Explode for three steps after every move.","Nach jeder Finte drei Schritte explodieren.","Arranca tres pasos tras cada regate.","Explose sur trois appuis après chaque geste."]],err:[["Looking at the ball the whole time.","Die ganze Zeit auf den Ball schauen.","Mirar el balón todo el tiempo.","Regarder le ballon en permanence."],["Doing the move without changing speed afterwards.","Die Finte machen, aber danach das Tempo nicht wechseln.","Hacer el regate sin cambiar de ritmo después.","Faire le geste sans changer de rythme ensuite."]]},
duel:{goal:["Winning one-on-one situations with body and timing.","Eins-gegen-eins-Situationen mit Körper und Timing gewinnen.","Ganar los uno contra uno con cuerpo y timing.","Gagner les un contre un grâce au corps et au timing."],cp:[["Attack the defender's front foot.","Greif den vorderen Fuß des Verteidigers an.","Ataca el pie adelantado del defensor.","Attaque le pied avant du défenseur."],["Keep your body between opponent and ball.","Körper zwischen Gegner und Ball halten.","Mantén el cuerpo entre el rival y el balón.","Garde ton corps entre l'adversaire et le ballon."],["Make your move one metre before contact, not on top of them.","Finte einen Meter vor dem Gegner, nicht erst direkt vor ihm.","Haz el regate un metro antes del contacto, no encima.","Déclenche ton geste un mètre avant le contact, pas sur lui."]],err:[["Slowing down before the defender.","Vor dem Verteidiger abbremsen.","Frenar antes del defensor.","Ralentir avant le défenseur."],["Turning your back when you could go forwards.","Sich wegdrehen, obwohl der Weg nach vorn frei ist.","Darte la vuelta cuando puedes avanzar.","Tourner le dos alors que tu peux avancer."]]},
shoot:{goal:["Clean, placed finishes under time pressure.","Saubere, platzierte Abschlüsse unter Zeitdruck.","Remates limpios y colocados bajo presión de tiempo.","Des frappes propres et placées sous pression."],cp:[["Glance at the goal, then eyes on the ball at contact.","Kurz zum Tor schauen, beim Kontakt auf den Ball.","Mira la portería y luego el balón en el contacto.","Un coup d'œil au but, puis les yeux sur le ballon au contact."],["Standing foot beside the ball, knee over it.","Standfuß neben den Ball, Knie über den Ball.","Pie de apoyo junto al balón, rodilla encima.","Pied d'appui à côté du ballon, genou au-dessus."],["Placement beats power: aim for the corners.","Platzierung vor Kraft: in die Ecken zielen.","Colocación antes que potencia: apunta a las esquinas.","Le placement avant la puissance : vise les coins."]],err:[["Leaning back and shooting over the bar.","Zurücklehnen und über das Tor schießen.","Echarse atrás y mandar el balón por encima.","Se pencher en arrière et tirer au-dessus."],["Taking one touch too many.","Einen Kontakt zu viel nehmen.","Dar un toque de más.","Prendre une touche de trop."]]},
defend:{goal:["Slowing the attacker down and winning the ball at the right moment.","Den Angreifer bremsen und im richtigen Moment den Ball gewinnen.","Frenar al atacante y robar en el momento justo.","Freiner l'attaquant et récupérer le ballon au bon moment."],cp:[["Low and side-on, weight on the balls of your feet.","Tief und seitlich stehen, Gewicht auf den Fußballen.","Bajo y de perfil, peso en las puntas.","Bas et de profil, poids sur l'avant des pieds."],["Watch the ball, not the feet or the body.","Auf den Ball schauen, nicht auf Füße oder Körper.","Mira el balón, no los pies ni el cuerpo.","Regarde le ballon, pas les pieds ni le corps."],["Stay an arm's length away and be patient.","Eine Armlänge Abstand halten und geduldig bleiben.","Mantente a un brazo de distancia y ten paciencia.","Reste à un bras de distance et sois patient."]],err:[["Diving in and getting beaten.","Zu früh reingehen und ausgespielt werden.","Entrar antes de tiempo y ser superado.","Se jeter et se faire éliminer."],["Standing square with both feet level.","Frontal stehen, beide Füße auf einer Höhe.","Quedarse de frente con los pies a la misma altura.","Rester de face, les deux pieds alignés."]]},
sprint:{goal:["A faster first step and higher top speed.","Ein schnellerer erster Schritt und mehr Endgeschwindigkeit.","Un primer paso más rápido y más velocidad punta.","Un premier appui plus rapide et une vitesse de pointe plus élevée."],cp:[["Lean forwards for the first steps and push the ground back.","In den ersten Schritten nach vorn lehnen und den Boden nach hinten wegdrücken.","Inclínate en los primeros pasos y empuja el suelo hacia atrás.","Penche-toi sur les premiers appuis et repousse le sol vers l'arrière."],["Drive your arms hard from hip to chin.","Arme kräftig von der Hüfte bis zum Kinn schwingen.","Mueve los brazos con fuerza de la cadera a la barbilla.","Balance fort les bras de la hanche au menton."],["Recover fully between reps: speed needs fresh legs.","Zwischen den Läufen voll erholen: Tempo braucht frische Beine.","Recupera del todo entre repeticiones: la velocidad necesita piernas frescas.","Récupère complètement entre les répétitions : la vitesse exige des jambes fraîches."]],err:[["Standing upright on the first step.","Beim ersten Schritt sofort aufrichten.","Erguirse en el primer paso.","Se redresser dès le premier appui."],["Cutting the rest short and running slower each rep.","Pausen abkürzen und jeden Lauf langsamer werden.","Acortar el descanso y correr más lento cada vez.","Écourter le repos et ralentir à chaque répétition."]]},
cod:{goal:["Braking and changing direction without losing speed.","Abbremsen und Richtung wechseln, ohne Tempo zu verlieren.","Frenar y cambiar de dirección sin perder velocidad.","Freiner et changer de direction sans perdre de vitesse."],cp:[["Lower your hips before the turn.","Vor der Wendung die Hüfte absenken.","Baja la cadera antes del giro.","Abaisse le bassin avant le virage."],["Plant the outside foot and push off it.","Außenfuß setzen und davon abdrücken.","Apoya el pie exterior e impúlsate.","Plante le pied extérieur et pousse dessus."],["Short steps into the turn, long steps out.","Kurze Schritte in die Wendung, lange heraus.","Pasos cortos al entrar en el giro, largos al salir.","Petits appuis à l'entrée, grandes foulées à la sortie."]],err:[["Running a wide curve instead of a sharp cut.","Einen weiten Bogen laufen statt scharf zu schneiden.","Hacer una curva amplia en vez de un corte seco.","Faire une large courbe au lieu d'une coupe nette."],["Letting the knee collapse inwards when planting.","Das Knie beim Abdruck nach innen knicken lassen.","Dejar que la rodilla se vaya hacia dentro al apoyar.","Laisser le genou partir vers l'intérieur à l'appui."]]},
cross:{goal:["Deliveries that land where the striker can attack them.","Hereingaben, die dort landen, wo der Stürmer sie angreifen kann.","Centros que caen donde el delantero puede atacarlos.","Des centres qui retombent là où l'attaquant peut les attaquer."],cp:[["Look up before your last touch and pick a zone.","Vor dem letzten Kontakt hochschauen und eine Zone wählen.","Levanta la cabeza antes del último toque y elige zona.","Lève la tête avant ta dernière touche et choisis une zone."],["Push the ball slightly outside your body before crossing.","Ball vor der Flanke leicht nach außen vorlegen.","Saca el balón un poco hacia fuera antes de centrar.","Pousse légèrement le ballon vers l'extérieur avant de centrer."],["Strike across the ball with your instep for whip.","Den Ball mit dem Innenspann anschneiden für Schärfe.","Golpea el balón con el empeine interior para darle rosca.","Brosse le ballon de l'intérieur du cou-de-pied pour le fouetter."]],err:[["Crossing blind without looking.","Blind flanken, ohne hochzuschauen.","Centrar a ciegas sin mirar.","Centrer à l'aveugle sans regarder."],["Hitting the first defender.","Den ersten Verteidiger anschießen.","Golpear al primer defensor.","Trouver le premier défenseur."]]},
str:{goal:["Stronger legs and core for duels, jumps and injury prevention.","Kräftigere Beine und Rumpf für Zweikämpfe, Sprünge und Verletzungsvorbeugung.","Piernas y core más fuertes para duelos, saltos y prevenir lesiones.","Des jambes et un tronc plus forts pour les duels, les sauts et la prévention des blessures."],cp:[["Technique before load: stop when your form breaks.","Technik vor Belastung: aufhören, wenn die Ausführung leidet.","Técnica antes que carga: para cuando pierdas la forma.","La technique avant la charge : arrête quand le geste se dégrade."],["Keep your knees in line with your toes.","Knie in einer Linie mit den Fußspitzen halten.","Mantén las rodillas en línea con las puntas de los pies.","Garde les genoux dans l'axe des pointes de pieds."],["Brace your stomach and breathe out on the effort.","Bauch anspannen und bei der Anstrengung ausatmen.","Aprieta el abdomen y suelta el aire en el esfuerzo.","Gaine le ventre et expire à l'effort."]],err:[["Rushing the reps and using momentum.","Wiederholungen hetzen und mit Schwung arbeiten.","Hacer las repeticiones deprisa y con impulso.","Bâcler les répétitions en utilisant l'élan."],["Letting the lower back sag or round.","Den unteren Rücken durchhängen oder rund werden lassen.","Dejar que la zona lumbar se hunda o se redondee.","Laisser le bas du dos se creuser ou s'arrondir."]]},
scan:{goal:["Seeing the picture earlier and deciding faster.","Das Spielbild früher sehen und schneller entscheiden.","Ver la jugada antes y decidir más rápido.","Voir le jeu plus tôt et décider plus vite."],cp:[["Look over both shoulders before every first touch.","Vor jedem ersten Kontakt über beide Schultern schauen.","Mira por encima de ambos hombros antes de cada primer toque.","Regarde par-dessus les deux épaules avant chaque première touche."],["Decide before the ball arrives, not after.","Entscheiden, bevor der Ball ankommt, nicht danach.","Decide antes de que llegue el balón, no después.","Décide avant l'arrivée du ballon, pas après."],["Open your body so you can see as much of the pitch as possible.","Körper öffnen, um möglichst viel vom Feld zu sehen.","Perfílate para ver la mayor parte posible del campo.","Ouvre ton corps pour voir le plus de terrain possible."]],err:[["Watching only the ball.","Nur auf den Ball schauen.","Mirar solo el balón.","Ne regarder que le ballon."],["Going through the motions without a real decision.","Die Übung abspulen, ohne wirklich zu entscheiden.","Hacer el ejercicio de memoria sin decidir de verdad.","Dérouler l'exercice sans vraie décision."]]},
run:{goal:["The stamina to repeat sprints for the whole match.","Die Ausdauer, um über das ganze Spiel Sprints zu wiederholen.","La resistencia para repetir esprints todo el partido.","L'endurance pour répéter les sprints pendant tout le match."],cp:[["Pick a pace you can hold for every rep.","Wähl ein Tempo, das du in jeder Wiederholung halten kannst.","Elige un ritmo que puedas mantener en cada repetición.","Choisis une allure que tu peux tenir à chaque répétition."],["Stay tall with relaxed shoulders.","Bleib aufrecht mit lockeren Schultern.","Mantente erguido con los hombros relajados.","Reste droit, épaules relâchées."],["Breathe rhythmically, out longer than in.","Rhythmisch atmen, länger aus als ein.","Respira con ritmo, espirando más largo.","Respire en rythme, en expirant plus longtemps."]],err:[["Starting too fast and fading.","Zu schnell starten und einbrechen.","Empezar demasiado rápido y hundirse.","Partir trop vite et s'effondrer."],["Skipping the easy parts of the interval.","Die lockeren Abschnitte auslassen.","Saltarse las partes suaves del intervalo.","Zapper les parties faciles de l'intervalle."]]}

window.BZ_BODY=[
["jog","w","strideA","strideB",["Easy jog","Lockeres Einlaufen","Trote suave","Footing léger"],["Jog at an easy pace and let your arms swing loosely.","Trabe in lockerem Tempo und lass die Arme locker mitschwingen.","Trota a ritmo suave dejando los brazos sueltos.","Trottine à allure tranquille, bras relâchés."]],
["jogc","c","strideA","strideB",["Easy jog and walk","Lockeres Auslaufen","Trote suave y caminar","Footing de récupération"],["Jog very slowly, then walk, and let your breathing settle.","Trabe ganz langsam, geh dann und lass die Atmung ruhig werden.","Trota muy despacio, luego camina y deja que la respiración se calme.","Trottine très lentement, puis marche et laisse ta respiration se calmer."]],
["hk","w","kneeR","kneeL",["High knees","Kniehebelauf","Rodillas arriba","Montées de genoux"],["Drive your knees up to hip height in a quick rhythm, staying tall.","Zieh die Knie in schnellem Rhythmus auf Hüfthöhe und bleib aufrecht.","Sube las rodillas a la altura de la cadera a ritmo rápido, erguido.","Monte les genoux à hauteur de hanche à un rythme rapide, buste droit."]],
["bk","w","buttR","buttL",["Butt kicks","Anfersen","Talones al glúteo","Talons-fesses"],["Kick your heels up to your backside with quick, light steps.","Zieh die Fersen mit schnellen, leichten Schritten zum Gesäß.","Lleva los talones al glúteo con pasos rápidos y ligeros.","Ramène les talons aux fesses à petits pas rapides et légers."]],
["ls","wm","swingF","swingB",["Leg swings","Beinpendel","Balanceos de pierna","Balancements de jambe"],["Hold on to something and swing one leg forwards and back. Switch legs halfway.","Halt dich fest und pendel ein Bein vor und zurück. Wechsle zur Hälfte das Bein.","Sujétate y balancea una pierna adelante y atrás. Cambia de pierna a la mitad.","Tiens-toi et balance une jambe d'avant en arrière. Change de jambe à mi-temps."]],
["lt","w","lunge","twist",["Lunge with twist","Ausfallschritt mit Drehung","Zancada con giro","Fente avec rotation"],["Step into a lunge and turn your upper body over the front leg. Alternate legs.","Mach einen Ausfallschritt und dreh den Oberkörper über das vordere Bein. Beine abwechseln.","Da una zancada y gira el tronco sobre la pierna adelantada. Alterna las piernas.","Fais une fente et tourne le buste au-dessus de la jambe avant. Alterne les jambes."]],
["ac","w","stand","armsUp",["Arm circles","Armkreisen","Círculos de brazos","Cercles de bras"],["Circle both arms forwards in big circles, then backwards.","Kreise beide Arme groß nach vorn, dann nach hinten.","Haz círculos amplios con los brazos hacia delante y luego hacia atrás.","Fais de grands cercles de bras vers l'avant, puis vers l'arrière."]],
["og","w","kneeR","gate",["Open the gate","Hüfte öffnen","Abrir la puerta","Ouvrir la porte"],["Lift your knee to hip height and rotate it out to the side. Alternate legs while walking.","Heb das Knie auf Hüfthöhe und dreh es nach außen. Im Gehen die Beine abwechseln.","Sube la rodilla a la altura de la cadera y ábrela hacia fuera. Alterna caminando.","Monte le genou à hauteur de hanche et ouvre-le vers l'extérieur. Alterne en marchant."]],
["iw","wm","fold","pushUp",["Inchworm","Raupe","Gusano","Chenille"],["Fold forwards, walk your hands out to a push-up position, then walk your feet up to your hands.","Beug dich vor, wandere mit den Händen in den Liegestütz und dann mit den Füßen zu den Händen.","Flexiónate, camina con las manos hasta la posición de flexión y luego acerca los pies a las manos.","Penche-toi, avance les mains jusqu'en position de pompe, puis ramène les pieds vers les mains."]],
["sq","w","stand","squat",["Bodyweight squats","Kniebeugen","Sentadillas","Squats"],["Sit back and down with your chest up, then stand tall. Smooth and controlled.","Geh mit aufrechter Brust nach hinten unten und richte dich wieder auf. Ruhig und kontrolliert.","Baja con el pecho arriba y vuelve a subir. Suave y con control.","Descends poitrine haute, puis redresse-toi. Fluide et contrôlé."]],
["sk","w","kneeR","hop",["Skips","Hopserlauf","Skipping","Pas sautillés"],["Skip forwards, driving one knee up and pushing off the other foot.","Hüpf vorwärts, zieh ein Knie hoch und drück dich mit dem anderen Fuß ab.","Avanza a saltitos subiendo una rodilla e impulsándote con el otro pie.","Avance en sautillant, un genou monte pendant que l'autre pied pousse."]],
["pg","w","stand","hop",["Pogo hops","Pogo-Sprünge","Saltos pogo","Sauts pogo"],["Bounce lightly on the balls of your feet with almost straight legs.","Federe leicht auf den Fußballen mit fast gestreckten Beinen.","Rebota ligero sobre las puntas con las piernas casi rectas.","Rebondis légèrement sur l'avant des pieds, jambes presque tendues."]],
["cs","s","calf","calf",["Calf stretch","Wadendehnung","Estiramiento de gemelo","Étirement du mollet"],["Lean against a wall with one leg back and its heel on the floor. Hold, then switch legs halfway.","Stütz dich an einer Wand ab, ein Bein hinten, Ferse am Boden. Halten, zur Hälfte das Bein wechseln.","Apóyate en una pared con una pierna atrás y el talón en el suelo. Aguanta y cambia de pierna a la mitad.","Appuie-toi contre un mur, une jambe en arrière, talon au sol. Tiens, puis change de jambe à mi-temps."]],
["qs","s","quad","quad",["Quad stretch","Oberschenkel vorn dehnen","Estiramiento de cuádriceps","Étirement du quadriceps"],["Stand on one leg and pull the other heel to your backside, knees together. Switch legs halfway.","Steh auf einem Bein und zieh die andere Ferse zum Gesäß, Knie zusammen. Zur Hälfte wechseln.","De pie sobre una pierna, lleva el otro talón al glúteo con las rodillas juntas. Cambia a la mitad.","Debout sur une jambe, ramène l'autre talon vers la fesse, genoux serrés. Change à mi-temps."]],
["hs","s","stand","fold",["Hamstring fold","Rumpfbeuge","Flexión de isquios","Flexion avant"],["With your legs almost straight, fold forwards slowly and let your arms hang. Do not bounce.","Beug dich mit fast gestreckten Beinen langsam vor und lass die Arme hängen. Nicht wippen.","Con las piernas casi rectas, flexiónate despacio y deja colgar los brazos. Sin rebotes.","Jambes presque tendues, penche-toi lentement et laisse pendre les bras. Sans à-coups."]],
["hf","sm","hipFlex","hipFlexB",["Hip flexor stretch","Hüftbeuger dehnen","Estiramiento del flexor de cadera","Étirement du fléchisseur de hanche"],["Kneel on one knee, push your hips gently forwards and reach up. Switch sides halfway.","Knie auf einem Bein, schieb die Hüfte sanft nach vorn und streck die Arme hoch. Zur Hälfte Seite wechseln.","Arrodíllate sobre una pierna, lleva la cadera suavemente adelante y estira los brazos arriba. Cambia a la mitad.","Un genou au sol, pousse doucement le bassin vers l'avant et tends les bras. Change de côté à mi-temps."]],
["gl","sm","seat","seat",["Glute stretch","Gesäßdehnung","Estiramiento de glúteo","Étirement du fessier"],["Sit down, cross one ankle over the other knee and pull the knee towards your chest. Switch sides halfway.","Setz dich, leg einen Knöchel über das andere Knie und zieh das Knie zur Brust. Zur Hälfte wechseln.","Sentado, cruza un tobillo sobre la otra rodilla y acerca la rodilla al pecho. Cambia a la mitad.","Assis, croise une cheville sur l'autre genou et ramène le genou vers la poitrine. Change à mi-temps."]],
["bf","sm","butter","butterB",["Butterfly","Schmetterling","Mariposa","Papillon"],["Sit with the soles of your feet together and let your knees sink. Lean forwards with a straight back.","Sitz mit den Fußsohlen aneinander und lass die Knie sinken. Lehn dich mit geradem Rücken vor.","Sentado con las plantas de los pies juntas, deja caer las rodillas. Inclínate con la espalda recta.","Assis, plantes de pieds jointes, laisse descendre les genoux. Penche-toi dos droit."]],
["cp","sm","child","child",["Child's pose","Kindhaltung","Postura del niño","Posture de l'enfant"],["Kneel, sit back on your heels and stretch your arms far forwards on the floor. Breathe slowly.","Knie dich hin, setz dich auf die Fersen und streck die Arme weit nach vorn. Ruhig atmen.","De rodillas, siéntate sobre los talones y estira los brazos hacia delante. Respira despacio.","À genoux, assieds-toi sur les talons et allonge les bras loin devant. Respire lentement."]],
["co","s","chest","armsUp",["Chest opener","Brust öffnen","Apertura de pecho","Ouverture de poitrine"],["Pull your arms back and open your chest, then reach both arms overhead.","Zieh die Arme nach hinten und öffne die Brust, dann streck beide Arme über den Kopf.","Lleva los brazos atrás abriendo el pecho y luego estíralos por encima de la cabeza.","Tire les bras en arrière en ouvrant la poitrine, puis tends-les au-dessus de la tête."]],
["ds","sm","deep","deep",["Deep squat hold","Tiefe Hocke","Sentadilla profunda","Squat profond"],["Sit in a deep squat with your heels down and press your knees out with your elbows.","Setz dich mit den Fersen am Boden in die tiefe Hocke und drück die Knie mit den Ellbogen nach außen.","Baja a sentadilla profunda con los talones apoyados y separa las rodillas con los codos.","Descends en squat profond, talons au sol, et écarte les genoux avec les coudes."]],
["wg","m","wgA","wgB",["World's greatest stretch","Großer Ausfallschritt mit Rotation","El mejor estiramiento del mundo","Grande fente avec rotation"],["From a deep lunge, put both hands down, then rotate and reach one arm to the sky. Switch sides halfway.","Setz im tiefen Ausfallschritt beide Hände auf, dreh dich auf und streck einen Arm nach oben. Zur Hälfte Seite wechseln.","Desde una zancada profunda, apoya las manos, gira y estira un brazo al cielo. Cambia de lado a la mitad.","En fente profonde, pose les deux mains, puis tourne et tends un bras vers le ciel. Change de côté à mi-temps."]],
["cc","m","catA","catB",["Cat-cow","Katze-Kuh","Gato-vaca","Chat-vache"],["On all fours, round your back up slowly, then let it sink and lift your head.","Mach im Vierfüßlerstand langsam einen runden Rücken, dann lass ihn durchhängen und heb den Kopf.","A cuatro patas, redondea la espalda despacio y luego húndela levantando la cabeza.","À quatre pattes, arrondis lentement le dos, puis creuse-le en relevant la tête."]],
["tr","m","catA","thor",["Thoracic rotation","Brustwirbelsäule drehen","Rotación torácica","Rotation thoracique"],["On all fours, reach one arm up to the ceiling and follow it with your eyes. Switch sides halfway.","Streck im Vierfüßlerstand einen Arm zur Decke und schau ihm nach. Zur Hälfte Seite wechseln.","A cuatro patas, estira un brazo hacia el techo y síguelo con la mirada. Cambia a la mitad.","À quatre pattes, tends un bras vers le plafond et suis-le du regard. Change de côté à mi-temps."]],
["ar","m","ankleA","ankleB",["Ankle rocks","Sprunggelenk mobilisieren","Movilidad de tobillo","Mobilité de cheville"],["Half-kneeling, push your front knee forwards over your toes with the heel down. Switch sides halfway.","Schieb im Halbkniestand das vordere Knie über die Zehen, die Ferse bleibt am Boden. Zur Hälfte wechseln.","Medio arrodillado, lleva la rodilla delantera por encima de los dedos sin levantar el talón. Cambia a la mitad.","En demi-genou, avance le genou avant au-dessus des orteils, talon au sol. Change à mi-temps."]]
];
