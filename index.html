aînement de l'onglet Entraînement. L'appli annonce les couleurs, tu joues contre le mur et tu réagis."],"pass_third":["Without a partner: the wall is your team-mate. Play diagonally against it, run round the cone and play the rebound first time through a cone gate.","Ohne Partner: Die Wand ist dein Mitspieler. Spiel schräg gegen die Wand, lauf um das Hütchen und spiel den Abpraller direkt durch ein Hütchentor.","Sin compañero: la pared es tu compañero. Juega en diagonal contra ella, rodea el cono y pasa el rebote de primeras por una puerta de conos.","Sans partenaire : le mur est ton coéquipier. Joue en diagonale contre lui, contourne le plot et passe le rebond en une touche dans une porte de plots."],"pass_onetwo":["Without a partner: play the one-two diagonally off the wall and burst past the cone in the same way.","Ohne Partner: Spiel den Doppelpass schräg über die Wand und starte genauso am Hütchen vorbei.","Sin compañero: haz la pared en diagonal contra un muro y arranca igual superando el cono.","Sans partenaire : fais le une-deux en diagonale avec le mur et démarre de la même façon en passant le plot."],"pass_choice":["Without a partner: use the Dribble callouts from the app's Training tools as the signal. Left or right decides the gate.","Ohne Partner: Nutze die Dribbel-Kommandos aus den Trainings-Werkzeugen der App als Signal. Links oder rechts bestimmt das Tor.","Sin compañero: usa las Órdenes de regate de las Herramientas de la app como señal. Izquierda o derecha decide la puerta.","Sans partenaire : utilise les Consignes de dribble des Outils d'entraînement de l'appli comme signal. Gauche ou droite désigne la porte."],"pass_rondo":["Without a group: play first time against the wall inside the square and change sides after every pass. Count your clean passes per minute.","Ohne Gruppe: Spiel im Quadrat direkt gegen die Wand und wechsle nach jedem Pass die Seite des Quadrats. Zähle deine sauberen Pässe pro Minute.","Sin grupo: juega de primeras contra la pared dentro del cuadrado y cambia de lado tras cada pase. Cuenta tus pases limpios por minuto.","Sans groupe : joue en une touche contre le mur dans le carré et change de côté après chaque passe. Compte tes passes propres par minute."],"pass_run":["Without a partner: pass into the zone and sprint after it yourself. The ball should almost stop inside the zone.","Ohne Partner: Spiel den Ball in die Zone und sprinte selbst hinterher. Der Ball soll in der Zone fast liegen bleiben.","Sin compañero: pasa a la zona y esprinta tú mismo tras el balón. El balón debe quedarse casi parado dentro.","Sans partenaire : passe dans la zone et sprinte toi-même derrière. Le ballon doit presque s'arrêter dans la zone."],"pass_press":["Without a partner: allow yourself two touches and two seconds at most from the wall contact to the pass through the gate.","Ohne Partner: Gib dir höchstens zwei Kontakte und zwei Sekunden vom Wandkontakt bis zum Pass durchs Hütchentor.","Sin compañero: date como máximo dos toques y dos segundos desde el rebote hasta el pase por la puerta.","Sans partenaire : accorde-toi deux touches et deux secondes maximum entre le rebond et la passe dans la porte."],"pass_finish":["Without a partner: play the one-two off the wall or push the ball diagonally ahead yourself, then finish.","Ohne Partner: Spiel den Doppelpass über die Wand oder leg dir den Ball selbst schräg vor und schließ danach ab.","Sin compañero: haz la pared contra un muro o adelántate el balón en diagonal y después define.","Sans partenaire : fais le une-deux avec le mur ou pousse-toi le ballon en diagonale, puis conclus."],"duel_live":["Without a partner: a cone or pole is your opponent. Attack at full speed, do the feint and time yourself to the line.","Ohne Partner: Ein Hütchen oder eine Stange ist dein Gegner. Lauf mit vollem Tempo an, führ die Finte aus und stoppe die Zeit bis über die Linie.","Sin compañero: un cono o una pica es tu rival. Encara a toda velocidad, haz la finta y cronometra hasta cruzar la línea.","Sans partenaire : un plot ou un piquet est ton adversaire. Attaque à pleine vitesse, fais la feinte et chronomètre-toi jusqu'à la ligne."],"duel_gates":["Without a partner: put a cone in the middle as the opponent. Choose a gate only one metre before it and switch with a single touch.","Ohne Partner: Stell ein Hütchen als Gegner in die Mitte. Entscheide dich erst einen Meter davor für ein Tor und wechsle mit einem einzigen Kontakt.","Sin compañero: coloca un cono en el centro como rival. Elige puerta solo un metro antes y cambia con un único toque.","Sans partenaire : place un plot au milieu comme adversaire. Choisis une porte seulement un mètre avant et change en une seule touche."],"shield":["Without a partner: stand with your back to a wall or pole, roll the ball with the sole on the far foot and turn away over both sides in turn.","Ohne Partner: Stell dich mit dem Rücken an eine Wand oder Stange, führ den Ball mit der Sohle am ballfernen Fuß und dreh dich abwechselnd über beide Seiten weg.","Sin compañero: ponte de espaldas a una pared o pica, mueve el balón con la suela en el pie alejado y gira alternando ambos lados.","Sans partenaire : place-toi dos à un mur ou un piquet, fais rouler le ballon sous la semelle du pied éloigné et tourne en alternant les deux côtés."],"duel_two":["Without partners: two poles are the opponents. Dribble through the gap at speed and stop the ball in the target zone.","Ohne Partner: Zwei Stangen sind die Gegner. Dribble mit Tempo durch die Lücke und stoppe den Ball in der Zielzone.","Sin compañeros: dos picas son los rivales. Conduce con velocidad por el hueco y detén el balón en la zona objetivo.","Sans partenaires : deux piquets sont les adversaires. Dribble en vitesse dans l'intervalle et arrête le ballon dans la zone cible."],"shot_first":["Without a partner: drive the ball diagonally against a wall or toss it to the side yourself and finish the rebound first time.","Ohne Partner: Spiel den Ball schräg fest gegen eine Wand oder wirf ihn dir selbst seitlich vor und schließ den Abpraller direkt ab.","Sin compañero: golpea el balón en diagonal contra una pared o lánzatelo a un lado y remata el rebote de primeras.","Sans partenaire : frappe le ballon en diagonale contre un mur ou lance-le-toi sur le côté et reprends le rebond en une touche."],"shot_press":["Without a partner: set a four-second limit from start to shot and count only goals inside the limit.","Ohne Partner: Gib dir ein Zeitlimit von vier Sekunden vom Start bis zum Schuss und zähle nur Treffer innerhalb des Limits.","Sin compañero: ponte un límite de cuatro segundos desde la salida hasta el disparo y cuenta solo los goles dentro del límite.","Sans partenaire : fixe-toi quatre secondes entre le départ et le tir et ne compte que les buts dans ce délai."],"run_game":["Without a group: play in the small area against a wall. Dribble to the cone, pass against the wall, sprint to the next cone and start again, non-stop for the whole phase.","Ohne Gruppe: Spiel im kleinen Feld gegen die Wand. Dribble zum Hütchen, pass gegen die Wand, sprinte zum nächsten Hütchen und wieder von vorn, die ganze Phase ohne Pause.","Sin grupo: juega en el campo pequeño contra una pared. Conduce al cono, pasa contra la pared, esprinta al siguiente cono y vuelve a empezar, sin parar toda la fase.","Sans groupe : joue dans le petit terrain contre un mur. Conduis jusqu'au plot, passe contre le mur, sprinte au plot suivant et recommence, sans arrêt pendant toute la phase."],"sprint_react":["Without a partner: Cone reaction in the app's Training tools gives you the start signal: go on every call.","Ohne Partner: Die Hütchen-Reaktion aus den Trainings-Werkzeugen der App gibt dir das Startsignal: Du startest bei jeder Ansage.","Sin compañero: Reacción a conos, en las Herramientas de la app, te da la señal de salida: sales con cada orden.","Sans partenaire : Réaction aux plots, dans les Outils d'entraînement de l'appli, te donne le signal : pars à chaque annonce."],"sprint_cod":["Without a partner: use the app's Dribble callouts for the call or decide the side only at the middle cone following a fixed pattern (right, right, left).","Ohne Partner: Nutze die Dribbel-Kommandos der App als Ansage oder entscheide die Seite erst am mittleren Hütchen nach einem festen Muster (rechts, rechts, links).","Sin compañero: usa las Órdenes de regate de la app como señal o decide el lado en el cono central siguiendo un patrón fijo (derecha, derecha, izquierda).","Sans partenaire : utilise les Consignes de dribble de l'appli comme annonce ou décide du côté au plot central selon un schéma fixe (droite, droite, gauche)."],"sprint_duel":["Without a partner: race the clock. Time your first run and try to be no more than a tenth of a second slower in every run after it.","Ohne Partner: Lauf gegen die Uhr. Stoppe deine Zeit im ersten Lauf und versuche, in jedem weiteren Lauf höchstens eine Zehntelsekunde langsamer zu sein.","Sin compañero: compite contra el reloj. Cronometra tu primera carrera e intenta no perder más de una décima en las siguientes.","Sans partenaire : cours contre le chrono. Chronomètre ta première course et essaie de ne pas perdre plus d'un dixième sur les suivantes."],"cross_combo":["Without a partner: play the ball diagonally against a wall or push it far ahead yourself, run round the cone and cross.","Ohne Partner: Spiel den Ball schräg gegen eine Wand oder leg ihn dir selbst weit in den Lauf, überlauf das Hütchen und flanke.","Sin compañero: juega el balón en diagonal contra una pared o adelántatelo largo, dobla el cono y centra.","Sans partenaire : joue le ballon en diagonale contre un mur ou pousse-le loin devant toi, contourne le plot et centre."],"cross_target":["Without a partner: mark two target zones (near and far post). Choose the zone only on your last touch before the cross.","Ohne Partner: Markiere zwei Zielzonen (erster und zweiter Pfosten). Entscheide die Zone erst beim letzten Kontakt vor der Flanke.","Sin compañero: marca dos zonas objetivo (primer y segundo palo). Elige la zona en el último toque antes del centro.","Sans partenaire : marque deux zones cibles (premier et second poteau). Choisis la zone seulement à la dernière touche avant le centre."],"cross_duel":["Without a partner: a pole is the defender. Beat it with a feint and cross with your second touch at the latest.","Ohne Partner: Eine Stange ist der Verteidiger. Geh mit einer Finte vorbei und flanke spätestens mit dem zweiten Kontakt danach.","Sin compañero: una pica es el defensor. Supérala con una finta y centra como muy tarde al segundo toque.","Sans partenaire : un piquet est le défenseur. Passe-le avec une feinte et centre au plus tard à la deuxième touche."],"s_nordic":["Without a partner: hook your heels under a heavy sofa or a fixed bench. Check first that nothing can slip.","Ohne Partner: Klemm die Fersen unter ein schweres Sofa oder eine fest stehende Bank. Prüfe vorher, dass nichts verrutscht.","Sin compañero: engancha los talones bajo un sofá pesado o un banco fijo. Comprueba antes que nada se mueva.","Sans partenaire : coince tes talons sous un canapé lourd ou un banc fixe. Vérifie d'abord que rien ne glisse."],"iq_space":["Without a partner: play against the wall and move to a different corner of the square after every pass. Before each touch, check which corner comes next.","Ohne Partner: Spiel gegen die Wand und wechsle nach jedem Pass in eine andere Ecke des Quadrats. Schau vor jedem Kontakt, welche Ecke du als Nächstes nimmst.","Sin compañero: juega contra la pared y cambia a otra esquina del cuadrado tras cada pase. Antes de cada toque mira qué esquina toca después.","Sans partenaire : joue contre le mur et change de coin du carré après chaque passe. Avant chaque touche, regarde quel coin vient ensuite."],"iq_game":["Without a partner: put a cone in the middle as the opponent and use the app's Dribble callouts. The signal decides which gate you dribble through.","Ohne Partn function head(title,sub,ava){const p=S.profile;
  return `<header class="band">${ava&&p?(p.photo?`<img class="ava" src="${p.photo}" alt="">`:`<div class="ava">${esc(p.name.slice(0,1).toUpperCase())}</div>`):LOGO}<div><h1>${title}</h1><p class="muted">${sub||""}</p></div></header>`}
function ring(v){const c=2*Math.PI*38;return `<svg class="ring" viewBox="0 0 92 92" role="img" aria-label="${v}/100"><circle class="t" cx="46" cy="46" r="38" fill="none" stroke-width="9"/><circle class="v" cx="46" cy="46" r="38" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 46 46)"/><text x="46" y="55" text-anchor="middle">${v}</text></svg>`}
const O=()=>S.profile||A;
function fieldsPicker(){const o=O();return `<div class="chips">${FIELDS.map(f=>`<button class="chip ${o.fields.includes(f[0])?"on":""}" data-a="field" data-f="${f[0]}" aria-pressed="${o.fields.includes(f[0])}">${f[1][L()]}</button>`).join("")}</div><p class="small ${o.fields.length===3?"muted":"note"}">${t("fields_count",o.fields.length)}</p>`}
function schedEditor(){const o=O();return `<div class="sched">${[0,1,2,3,4,5,6].map(w=>`<b>${WDN(w)}</b>
  <select data-c="sched" data-w="${w}" aria-label="${WDN(w)} ${t("when")}">${[["",t("rest_day")],["m",t("tod_m")],["a",t("tod_a")],["e",t("tod_e")]].map(x=>`<option value="${x[0]}" ${(o.sched[w]||"")===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>
  <select data-c="planf" data-w="${w}" ${o.sched[w]?"":"disabled"} aria-label="${WDN(w)} ${t("field")}">${o.fields.map(f=>`<option value="${f}" ${o.plan[w]===f?"selected":""}>${fname(f)}</option>`).join("")}</select>`).join("")}</div>`}
function fixPlan(o){[0,1,2,3,4,5,6].forEach((w,i)=>{if(!o.fields.includes(o.plan[w]))o.plan[w]=o.fields[i%Math.max(1,o.fields.length)]})}
function pitchPick(disabled,withNone){const rows=[["LW","ST","RW"],[0,"SS",0],[0,"CAM",0],[0,"CM",0],[0,"CDM",0],["LB","CB","RB"],[0,"GK",0]];
  return `<div class="pp">${rows.map(r=>`<div class="pr">${r.map(c=>c?`<button class="pb2" data-a="pick" data-v="${c}" ${disabled===c?"disabled":""}>${c}<small>${posName(c)}</small></button>`:"<span></span>").join("")}</div>`).join("")}</div>${withNone?`<button class="opt" data-a="pick" data-v="">${t("no_pos2")}</button>`:""}`}
function bodyInputs(o){const m=o.units!=="i",h=o.h||"",w=o.w||"";
  return `<div class="chips"><button class="chip ${m?"on":""}" data-a="units" data-u="m">cm / kg</button><button class="chip ${m?"":"on"}" data-a="units" data-u="i">ft / lb</button></div>
  <div class="form">${m?`<div><label for="b-h">${t("height")} (cm)</label><input id="b-h" type="number" inputmode="decimal" min="120" max="230" value="${h?Math.round(h):""}"></div>`
   :`<div><label for="b-ft">${t("height")} (ft)</label><input id="b-ft" type="number" inputmode="numeric" min="3" max="7" value="${h?Math.floor(h/30.48):""}"></div><div><label for="b-in">${t("height")} (in)</label><input id="b-in" type="number" inputmode="numeric" min="0" max="11" value="${h?Math.round(h/2.54)%12:""}"></div>`}
  <div><label for="b-w">${t("weight")} (${m?"kg":"lb"})</label><input id="b-w" type="number" inputmode="decimal" min="20" max="500" value="${w?Math.round(m?w:w*2.2046):""}"></div></div>`}
function readBody(o){const m=o.units!=="i",num=id=>{const e=$(id);return e?parseFloat(e.value):NaN};
  const h=m?num("#b-h"):num("#b-ft")*30.48+(num("#b-in")||0)*2.54,w=m?num("#b-w"):num("#b-w")/2.2046;
  if(!(h>=120&&h<=230)||!(w>=25&&w<=200))return false;o.h=Math.round(h);o.w=Math.round(w*10)/10;return true}

// ---------- onboarding ----------
function steps(){const a=["lang","name","age"];if(A.age>=13&&A.age<16)a.push("parent");return a.concat(["consent","body","level","pos","pos2","foot","fields","sched","dur","eq"])}
function startOnb(){A={units:"m",fields:[],plan:{},sched:{0:"a",2:"a",4:"a"},eq:{c:true},cons:{ai:true},dur:45,match:-1};step=0;blocked=false}
function onboarding(){if(!A)startOnb();const st=steps(),id=st[step];let b="",next=true;
  if(blocked)return head("Baller Zone","")+`<section class="card narrow"><h2>${t("u13_h")}</h2><p>${t("u13_t")}</p><button class="btn ghost" data-a="unblock">${t("back")}</button></section>`;
  if(id==="lang"){next=false;b=`<div class="opts">${LANGS.map((l,i)=>`<button class="opt ${S.lang===l?"on":""}" data-a="lang" data-l="${l}">${LNAME[i]}</button>`).join("")}</div>`}
  else if(id==="name")b=`<input id="o-name" maxlength="20" autocomplete="given-name" placeholder="${t("name_ph")}" value="${esc(A.name||"")}">`;
  else if(id==="age")b=`<input id="o-age" type="number" inputmode="numeric" min="5" max="90" placeholder="${t("age_ph")}" value="${A.age||""}"><p class="small muted">${t("age_note")}</p>`;
  else if(id==="parent")b=`<p>${t("parent_t")}</p><label for="o-parent">${t("parent_name")}</label><input id="o-parent" maxlength="40" autocomplete="off"><label class="row" style="color:var(--fg);font-size:1rem"><input type="checkbox" id="o-pc"><span class="grow">${t("parent_c")}</span></label>`;
  else if(id==="consent")b=`<p class="small">${t("cons_intro")}</p>
    <label class="row" style="color:var(--fg);font-size:1rem"><input type="checkbox" id="c-terms"><span class="grow">${t("cons_terms")}</span></label>
    <div class="row"><button class="btn ghost" data-a="tab" data-t="privacy">${t("privacy")}</button><button class="btn ghost" data-a="tab" data-t="terms">${t("terms")}</button></div>
    <label class="row" style="color:var(--fg);font-size:1rem"><input type="checkbox" id="c-health"><span class="grow">${t("cons_health")}</span></label>
    <label class="row" style="color:var(--fg);font-size:1rem"><input type="checkbox" id="c-ai" ${A.cons.ai?"checked":""}><span class="grow">${t("cons_ai")}</span></label>`;
  else if(id==="body")b=bodyInputs(A)+`<p class="small muted">${t("body_note")}</p>`;
  else if(id==="level"){next=false;b=`<div class="opts">${[0,1,2,3].map(i=>`<button class="opt" data-a="set" data-k="lvl" data-v="${i}">${t("lvl"+i)}<small>${t("lvl"+i+"_d")}</small></button>`).join("")}</div>`}
  else if(id==="pos"){next=false;b=pitchPick()}
  else if(id==="pos2"){next=false;b=pitchPick(A.pos,true)}
  else if(id==="foot"){next=false;b=`<div class="opts">${["r","l","b"].map(f=>`<button class="opt" data-a="set" data-k="foot" data-v="${f}">${t("foot_"+f)}</button>`).join("")}</div>`}
  else if(id==="fields")b=`<p class="small muted">${t("fields_note",posName(A.pos))}</p>`+fieldsPicker();
  else if(id==="sched")b=`<p class="small muted">${t("sched_note")}</p>`+schedEditor();
  else if(id==="dur"){next=false;b=`<div class="opts">${[30,45,60,90].map(m=>`<button class="opt" data-a="set" data-k="dur" data-v="${m}">${t("d_min",m)}</button>`).join("")}</div>`}
  else if(id==="eq")b=`<p class="small muted">${t("eq_note")}</p><div class="chips">${["c","w","p","l","m","r","g","x","u"].map(k=>`<button class="chip ${A.eq[k]?"on":""}" data-a="eq" data-k="${k}" aria-pressed="${!!A.eq[k]}">${t("eq_"+k)}</button>`).join("")}</div>`;
  else if(id==="match"){next=false;b=`<div class="opts">${[5,6].map(w=>`<button class="opt" data-a="set" data-k="match" data-v="${w}">${t("wdl").split(",")[w]}</button>`).join("")}<button class="opt" data-a="set" data-k="match" data-v="-1">${t("no_match")}</button></div><p class="small muted">${t("match_note")}</p>`}
  return head("Baller Zone",t("step",step+1,st.length))+`<div class="narrow" style="display:flex;flex-direction:column;gap:16px"><div class="bar"><i style="width:${step/st.length*100}%"></i></div><h2>${t("q_"+id)}</h2>${b}
  ${note?`<p class="note">${esc(note)}</p>`:""}<div class="row">${step?`<button class="btn ghost" data-a="back">${t("back")}</button>`:""}${next?`<button class="btn grow" data-a="next">${t("next")}</button>`:""}</div></div>`}
function advance(){note="";const st=steps();if(step+1>=st.length){fixPlan(A);S.profile=A;A=null;step=0;tab="today";S.seen=null}else step++}
function nextStep(){const id=steps()[step];note="";
  if(id==="name"){const v=$("#o-name").value.trim();if(!v){note=t("err_name");return}A.name=v}
  else if(id==="age"){const v=parseInt($("#o-age").value,10);if(!(v>=5&&v<=90)){note=t("err_age");return}if(v<13){blocked=true;return}A.age=v}
  else if(id==="parent"){const v=$("#o-parent").value.trim();if(!v||!$("#o-pc").checked){note=t("err_parent");return}A.parent={name:v,date:today()}}
  else if(id==="consent"){if(!$("#c-terms").checked||!$("#c-health").checked){note=t("err_cons");return}A.cons={ai:$("#c-ai").checked,lb:false,date:today()}}
  else if(id==="body"){if(!readBody(A)){note=t("err_body");return}}
  else if(id==="fields"){if(A.fields.length!==3){note=t("fields_count",A.fields.length);return}fixPlan(A)}
  else if(id==="sched"){if(!Object.values(A.sched).some(Boolean)){note=t("err_sched");return}}
  advance()}

// ---------- today ----------
function checklist(l){const D=day(today()),own=l==="own",it=items(l);
  return `<section class="card"><h3>${own?t("cl_own"):t("cl_"+l)}</h3><div>${it.map(x=>`<div class="line"><button class="check ${D.checks[x.k]?"on":""}" data-a="chk" data-k="${x.k}" aria-pressed="${!!D.checks[x.k]}"><span class="box">${D.checks[x.k]?"✓":""}</span><span>${esc(x.t)}</span></button>${own?`<button class="x" data-a="delown" data-id="${x.id}" aria-label="${t("delete")}">×</button>`:""}</div>`).join("")}</div>
  ${own?`${it.length?"":`<p class="muted small">${t("cl_own_empty")}</p>`}<form id="ownform" class="row"><input id="o-t" class="grow" placeholder="${t("cl_new")}" maxlength="60" required><button class="btn" type="submit">${t("add")}</button></form>`:""}</section>`}
function vToday(){const d=new Date(),k=today(),p=S.profile,st=stats(),ty=daytype(d),sc=score(k),into=st.xp%250,D=day(k),seen=S.seen||[];
  let top;if(ty==="train"){const s=session(d);top=D.done?`<section class="card hero"><span class="tag">${t("done")}</span><h2>${t("done_h")}</h2><p class="muted">${t("done_t",esc(p.name))}</p></section>`
    :`<section class="card hero"><span class="tag">${t("tod_"+p.sched[wd(d)])} · ${t("d_min",p.dur)}${s.light?" · "+t("light"):""}</span><h2>${fname(s.field)}</h2><p class="muted">${t("today_t",s.list.length-2)}</p><button class="btn block" data-a="tab" data-t="train">${t("start_training")}</button></section>`}
  else top=ty==="match"?`<section class="card hero"><span class="tag">${t("matchday")}</span><h2>${t("match_h")}</h2><p class="muted">${t("match_t")}</p></section>`
    :`<section class="card hero"><span class="tag">${t("rest_day")}</span><h2>${t("rest_h")}</h2><p class="muted">${t("rest_t")}</p></section>`;
  const bars=[6,5,4,3,2,1,0].map(i=>{const x=new Date(d);x.setDate(d.getDate()-i);const v=score(dk(x));return `<div class="${i?"":"now"}">${v}<i style="height:${v*.7}%"></i>${WDN(wd(x))}</div>`}).join("");
  return head(t("hello",esc(p.name)),d.toLocaleDateString(S.lang,{weekday:"long",day:"numeric",month:"long"})+" · "+p.pos+(p.pos2?" / "+p.pos2:"")+" · "+t("lvl"+p.lvl),true)+top+
  `<div class="cols"><section class="card"><div class="row">${ring(sc)}<div class="grow"><h3>Daily Score</h3><p class="small muted">${t("to_next",250-into,st.lvl+1)}</p><div class="bar" style="margin-top:6px"><i style="width:${into/250*100}%"></i></div></div></div>
   <div class="stats"><div><b>${st.streak}</b><span>${t("streak")}</span></div><div><b>${st.xp}</b><span>XP</span></div><div><b>${st.lvl}</b><span>${t("level")}</span></div></div></section>
   <section class="card"><h3>${t("your_week")}</h3><div class="chart" role="img" aria-label="${t("week_note")}">${bars}</div><p class="small muted">${t("week_note")}</p></section></div>
   <div class="cols">${lists(d).filter(l=>l!=="own").map(checklist).join("")}${checklist("own")}</div>
   <section class="card"><h3>${t("badges")}</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${seen.includes(b[0])?"on":""}"><b>${t("b_"+b[0])}</b>${t("bd_"+b[0])}</div>`).join("")}</div></section>`}

// ---------- training ----------
function itemName(e){return e.d?dname(e.d):t(e.k)}
function itemBody(e,f,partner){if(!e.d)return demo(e.k==="wu"?"lap":"spot")+`<div class="dose">${t("d_min",e.m)}</div><p>${t(e.k+"_t")}</p>`;
  const d=e.d,cone=PAT[d.pat]&&PAT[d.pat].cones;
  return demo(d.pat,d.need.includes("p"))+`<div class="dose">${dose(d,f)}</div><p>${esc(dtext(d))}</p>${cone?`<p class="small muted">${t("spacing",spacing())}</p>`:""}`}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function stopTick(){clearInterval(tick);tick=null}
function startTick(){stopTick();tick=setInterval(()=>{if(!run||!run.on)return;run.left--;const el=$("#tm");if(el)el.textContent=fmt(Math.max(0,run.left));
  if(run.left<=0){run.on=false;beep();if(tab==="train")render()}},1000)}
function begin(mode){const s=session(new Date());let list=s.list;if(mode==="mob")list=[list[0],list[list.length-1]];
  run={i:0,list,field:s.field,x:(mode==="tired"?.8:1)*(s.light?.6:1),left:Math.round(list[0].m*60),on:true,mob:mode==="mob"};pre=null;startTick();window.scrollTo(0,0)}
function vTrain(){const d=new Date(),p=S.profile,ty=daytype(d),D=day(today());
  if(run){const e=run.list[run.i],last=run.i+1>=run.list.length,over=run.left<=0,f=factor(run.field,run.x);
    return head(t("training"),t("drill_of",run.i+1,run.list.length))+`<div class="bar"><i style="width:${run.i/run.list.length*100}%"></i></div>
    <section class="card hero"><span class="tag">${e.d?fname(e.d.f):t("frame")}</span><h2>${esc(itemName(e))}</h2><div class="timer" id="tm">${fmt(Math.max(0,run.left))}</div>
    ${over?`<p style="text-align:center"><b>${t("time_up")}</b></p>`:""}
    <div class="row">${over?"":`<button class="btn ghost grow" data-a="pause">${run.on?t("pause"):t("resume")}</button>`}<button class="btn grow" data-a="nextdrill">${last?t("finish"):t("next_drill")}</button></div>
    ${itemBody(e,f)}
    ${e.d?`<div class="row"><button class="btn ghost grow" data-a="adj" data-n="-1">${t("easier")}</button><button class="btn ghost grow" data-a="adj" data-n="1">${t("harder")}</button></div>`:""}
    <button class="btn ghost" data-a="quit">${t("quit")}</button></section>`}
  if(fbAsk)return head(t("training"),fname(fbAsk))+`<section class="card hero narrow"><h2>${t("fb_h")}</h2><p class="muted">${t("fb_t")}</p><div class="opts">${[["-1",t("fb_easy")],["0",t("fb_ok")],["1",t("fb_hard")]].map(x=>`<button class="opt" data-a="fb" data-n="${x[0]}">${x[1]}</button>`).join("")}</div></section>`;
  if(pre==="ask")return head(t("training"),t("check_sub"))+`<section class="card hero narrow"><h2>${t("check_h")}</h2><div class="opts"><button class="opt" data-a="begin" data-m="full">${t("check_fit")}</button><button class="opt" data-a="begin" data-m="tired">${t("check_tired")}<small>${t("check_tired_d")}</small></button><button class="opt" data-a="pain">${t("check_pain")}</button></div><button class="btn ghost" data-a="precancel">${t("back")}</button></section>`;
  if(pre==="pain")return head(t("training"),t("check_sub"))+`<section class="card hero narrow"><h2>${t("pain_h")}</h2><p>${t("pain_t")}</p><button class="btn ghost" data-a="begin" data-m="mob">${t("pain_mob")}</button><button class="btn" data-a="precancel">${t("pain_skip")}</button></section>`;
  const mon=new Date(d);mon.setDate(d.getDate()-wd(d));
  const week=[0,1,2,3,4,5,6].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);const tt=daytype(x),dn=S.days[dk(x)]&&S.days[dk(x)].done;
    return `<div class="${i===wd(d)?"today":""} ${dn?"done":""}"><b>${WDN(i)}</b>${dn?"✓":tt==="train"?fname(p.plan[i]):tt==="match"?t("matchday"):"–"}</div>`}).join("");
  const s=session(d),f=factor(s.field,s.light?.6:1);
  return head(t("training"),ty==="train"?`${t("tod_"+p.sched[wd(d)])} · ${t("d_min",p.dur)} · ${fname(s.field)}`:ty==="match"?t("matchday"):t("rest_day"))+`<div class="week">${week}</div>
   <div class="row"><button class="btn grow" data-a="prestart">${D.done?t("again"):t("start_timer")}</button><button class="btn ghost" data-a="tab" data-t="plan">${t("edit_plan")}</button></div>`+
  (ty!=="train"?`<p class="muted">${ty==="match"?t("match_extra"):t("rest_extra")}</p>`:"")+(s.light?`<p class="muted">${t("light_note")}</p>`:"")+
  `<section class="card"><p class="small"><b>${p.pos} · ${posName(p.pos)}:</b> ${t("tip_"+TIPG[p.pos])}</p><p class="small muted">${p.age<16?t("tip_grow"):p.h>=185?t("tip_tall"):p.h<=170?t("tip_small"):t("tip_mid")}</p>
   ${s.list.map(e=>`<details class="ex"><summary><b>${esc(itemName(e))}</b><span class="small muted">${fmt(Math.round(e.m*60))}</span></summary>${itemBody(e,f)}</details>`).join("")}
   <button class="btn block ghost" data-a="done">${D.done?t("undo_done"):t("done_no_timer")}</button></section>`}
function vPlan(){return head(t("edit_plan"),t("plan_sub"))+`<section class="card"><h3>${t("q_fields")}</h3>${fieldsPicker()}</section>
  <section class="card"><h3>${t("q_sched")}</h3>${schedEditor()}</section>${note?`<p class="note">${esc(note)}</p>`:""}<button class="btn" data-a="plandone">${t("save")}</button>`}

// ---------- food, journal ----------
const FOODS=window.BZ_FOODS,SLOTS=()=>t("slots").split(",");
function vFood(){const d=new Date(),D=day(today()),p=S.profile,sum=D.meals.reduce((a,m)=>[a[0]+m[1],a[1]+m[2],a[2]+m[3],a[3]+m[4]],[0,0,0,0]);
  D.slots=D.slots||{};const n=SLOTS().filter((_,i)=>D.slots[i]).length,wg=waterGoal(d),lo=p.age<18?1.2:1.4,hi=p.age<18?1.5:1.7,pg=Math.round(p.w*lo);
  return head(t("food"),t("food_sub"))+`<div class="cols"><section class="card"><div class="stats" style="grid-template-columns:repeat(4,1fr)"><div><b>${sum[0]}</b><span>kcal</span></div><div><b>${sum[1]}</b><span>${t("protein")} g</span></div><div><b>${sum[2]}</b><span>${t("carbs")} g</span></div><div><b>${sum[3]}</b><span>${t("fat")} g</span></div></div>
   <div><div class="row"><span class="grow small">${t("protein_goal",Math.round(p.w*lo),Math.round(p.w*hi))}</span><b>${sum[1]} / ${pg} g</b></div><div class="bar"><i style="width:${Math.min(1,sum[1]/pg)*100}%"></i></div></div>
   <p class="small muted">${t("food_note")}</p></section>
   <section class="card"><div class="row"><h3 class="grow">${t("water")}</h3><button class="btn ghost" data-a="water" data-n="-2" aria-label="−0.5 l">−</button><b style="font:700 1.6rem var(--display)">${(D.water/4).toFixed(1)} / ${(wg/4).toFixed(1)} l</b><button class="btn" data-a="water" data-n="2" aria-label="+0.5 l">+</button></div><div class="bar"><i style="width:${Math.min(1,D.water/wg)*100}%"></i></div><p class="small muted">${t("water_note",(wg*.25).toFixed(1))}</p></section>
   <section class="card"><div class="row"><h3 class="grow">${t("meal_goal")}</h3><b style="font:700 1.4rem var(--display)">${n} / 5</b></div><div class="bar"><i style="width:${n/5*100}%"></i></div>

async function grab(file,n){if(file.type.startsWith("image/"))return[file];
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";const url=URL.createObjectURL(file);v.src=url;
  try{await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej({code:"video"});setTimeout(()=>rej({code:"video"}),15000)});
    const dur=isFinite(v.duration)?v.duration:0,sc=Math.min(1,960/(v.videoWidth||960)),c=document.createElement("canvas");
    c.width=Math.round((v.videoWidth||960)*sc);c.height=Math.round((v.videoHeight||540)*sc);const out=[];
    for(let i=0;i<n;i++){await new Promise(res=>{v.onseeked=res;v.currentTime=dur*(i+.5)/n;setTimeout(res,4000)});
      c.getContext("2d").drawImage(v,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.8));if(b)out.push(b)}
    if(!out.length)throw{code:"video"};return out}
  finally{URL.revokeObjectURL(url)}}

// ---------- score, counters, badges, ranks ----------
function score(k){const D=S.days[k];if(!D||!S.profile)return 0;const d=new Date(k+"T12:00"),ty=daytype(d);
  let tot=0,on=0;lists(d).forEach(l=>items(l,k).forEach(it=>{tot++;if(D.checks[it.k])on++}));
  const c=tot?on/tot:0,sl=Object.values(D.slots||{}).filter(Boolean).length,wg=waterGoal(d);
  return Math.min(100,Math.round((ty==="train"?(D.done?40:0)+c*25:c*65)+sl*3+Math.min(wg,D.water)/wg*10+(D.journal.trim()?10:0)+(D.chal?10:0)))}
function ext(){const st=stats(),A=S.acts||[],M=(S.matches||[]).filter(m=>m.gf!=null&&m.gf!==""),km=x=>A.filter(a=>a.type===x).reduce((s,a)=>s+a.km,0),f={};
  for(const k in S.days)if(S.days[k].done&&S.days[k].field)f[S.days[k].field]=1;
  return Object.assign(st,{drills:CN().drills,min:CN().min,mob:CN().mob,chal:CN().chal,run:km("run"),ride:km("ride"),match:M.length,goals:M.reduce((s,m)=>s+(+m.goals||0),0),an:(S.analyses||[]).length,fields:Object.keys(f).length,rank:rankOf(st.xp)+1})}
const BDG=[["sess","sess",[1,5,10,25,50,100]],["streak","best",[3,7,14,30]],["jour","jour",[1,7,30]],["water","water",[3,10,30]],["drills","drills",[10,50,100,250]],["min","min",[60,300,1000]],["mob","mob",[1,10,30]],["run","run",[10,50,100]],["ride","ride",[50,200]],["match","match",[1,5,15]],["goals","goals",[1,10]],["an","an",[1,5]],["chal","chal",[1,7,30]],["fields","fields",[5,9]],["rank","rank",[3,5,8]]];
const ROM=["I","II","III","IV","V","VI"];
function badgeList(e){const out=[];BDG.forEach(b=>b[2].forEach((n,i)=>{const v=e[b[1]]||0;out.push({id:b[0]+i,name:t("bc_"+b[0])+" "+ROM[i],desc:t("bx_"+b[0],n),p:Math.min(1,v/n),on:v>=n})}));return out}
function checkNew(){if(!S.profile)return;const e=ext(),got=badgeList(e).filter(b=>b.on);
  if(!S.seen5){S.seen5=got.map(b=>b.id);S.rk=e.rank;return}
  const nw=got.filter(b=>!S.seen5.includes(b.id));S.seen5=S.seen5.concat(nw.map(b=>b.id));
  if(e.rank>(S.rk||1))toast(t("rank_up"),rankName(e.rank-1));else if(nw.length)toast(t("badge_new"),nw.map(b=>b.name).join(", "));
  S.rk=Math.max(S.rk||1,e.rank)}
function ringB(b){const c=2*Math.PI*30;return `<div class="bdg ${b.on?"on":""}"><svg viewBox="0 0 72 72" aria-hidden="true"><circle class="t" cx="36" cy="36" r="30"/><circle class="v" cx="36" cy="36" r="30" stroke-dasharray="${c*b.p} ${c}" transform="rotate(-90 36 36)"/><path class="k" d="${b.on?"M26 37l7 7 14-15":"M36 26v13M36 45v1"}"/></svg><b>${b.name}</b><small>${b.desc}</small></div>`}

// ---------- skills ----------
const SK=["pac","sho","pas","dri","iq","phy"],SKF={pac:["pc"],sho:["fi"],pas:["pa","cr"],dri:["v1","ft"],iq:["iq"],phy:["st","en"]},SKA={sho:[0],dri:[1,2],pas:[3],pac:[4]};
function skills(until,noAn){const p=S.profile,c={},base=[52,60,68,76][p.lvl],o={};
  for(const k in S.days){const D=S.days[k];if(D.done&&D.field&&(!until||k<=until))c[D.field]=(c[D.field]||0)+1}
  SK.forEach(s=>{let n=0;SKF[s].forEach(f=>{n+=c[f]||0});let v=base+Math.min(15,n*.6);
    if(!noAn&&SKA[s]){const a=(S.analyses||[]).find(x=>x.data&&x.data.scores&&SKA[s].includes(x.kind));
      if(a){const l=Object.values(a.data.scores).filter(x=>typeof x==="number");if(l.length)v+=(l.reduce((x,y)=>x+y,0)/l.length-5)*1.5}}
    o[s]=Math.round(Math.max(30,Math.min(99,v)))});return o}
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
function radar(sk,dl){const P=(i,r)=>{const a=(-90+i*60)*Math.PI/180;return[110+r*Math.cos(a),100+r*Math.sin(a)]},pts=f=>SK.map((k,i)=>P(i,62*(typeof f==="number"?f:Math.max(.12,(sk[k]-25)/74))).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=[.33,.66,1].map(f=>`<polygon class="rg" points="${pts(f)}"/>`).join("")+SK.map((_,i)=>{const q=P(i,62);return `<path class="rg" d="M110 100L${q[0].toFixed(1)} ${q[1].toFixed(1)}"/>`}).join("")+`<polygon class="rv" points="${pts()}"/>`;
  SK.forEach((k,i)=>{const q=P(i,86);s+=`<text class="rl" x="${q[0].toFixed(0)}" y="${(q[1]-4).toFixed(0)}" text-anchor="middle">${t("sk_"+k)}</text><text class="rn" x="${q[0].toFixed(0)}" y="${(q[1]+11).toFixed(0)}" text-anchor="middle">${sk[k]}${dl[k]>0?`<tspan class="rd" dx="3">+${dl[k]}</tspan>`:""}</text>`});
  return `<svg class="radar" viewBox="0 0 220 200" role="img" aria-label="${t("skills")}">${s}</svg>`}

const GUIDE=[["gk",["pa","ft","st"]],["df",["pa","st","pc"]],["mf",["pa","ft","iq"]],["at",["fi","v1","pc"]]];

  return{k:g[0],fields:g[1],n:dr.length,list:[Bx("jog"),...bodyPick("w",seed,4,"jog")].map(x=>({x,m:1.2,blk:"wu"})).concat(dr.map(x=>({d:x,m:6,blk:"main"})),[Bx("jogc"),...STR[g[1][0]].map(Bx)].map(x=>({x,m:1,blk:"cd"})))}}
function chalDrill(){const l=DR.filter(x=>x.v===0&&x.need===""&&["touch","spot"].includes(x.pat));return l[Math.floor(Date.now()/864e5)%l.length]}
function quickList(){const p=S.profile,seed="q"+today();return quickF==="you"?p.fields.flatMap(f=>pickF(f,2,seed)):pickF(quickF,6,seed)}
const mins=l=>Math.round(l.reduce((a,e)=>a+e.m,0));
function begin(mode,arg){const d=new Date(),s=session(d);let list=s.list,kind="day",field=s.field;
  if(mode==="mob"){list=mobList(d);kind="mob"}
  else if(mode==="guide"){const g=guided(+arg);list=g.list;field=g.fields[0];kind="guide"}
  else if(mode==="one"){const x=DR[+arg];list=[{d:x,m:6,blk:"main"}];field=x.f;kind="one"}
  else if(mode==="chal"){const x=chalDrill();list=[{d:x,m:1,blk:"main"}];field=x.f;kind="chal"}
  run={i:0,list,field,kind,mob:kind==="mob",x:(mode==="tired"?.8:1)*(kind==="day"&&s.light?.6:1),left:Math.round(list[0].m*60),on:true};pre=null;startTick();tab="train";window.scrollTo(0,0)}
function finishRun(){const r=run,D=day(today()),nd=r.list.filter(e=>e.d).length,mm=mins(r.list);run=null;stopTick();
  if(r.kind==="mob"){D.mob=true;CN().mob++;sub="m";return}
  CN().drills+=nd;CN().min+=mm;
  if(r.kind==="chal"){D.chal=true;CN().chal++;tab="today";return}
  if(r.kind==="one"){tab="drill";return}
  D.done=true;D.field=r.field;D.min=(D.min||0)+mm;fbAsk=r.field}
